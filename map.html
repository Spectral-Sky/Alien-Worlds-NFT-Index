        import { SessionKit } from 'https://esm.sh/@wharfkit/session@1';
        import { WebRenderer } from 'https://esm.sh/@wharfkit/web-renderer@1';
        import { WalletPluginAnchor } from 'https://esm.sh/@wharfkit/wallet-plugin-anchor@1';
        const kit = new SessionKit({
            appName: 'naroncodex',
            chains: [{ id: '1064487b3cd1a897ce03ae5b6a865651747e2e152090f99c1d19d44e01aea5a4', url: 'https://wax.greymass.com' }],
            ui: new WebRenderer(),
            walletPlugins: [new WalletPluginAnchor()],
        });
        window.walletKit = kit;
        try {
            const _tout = new Promise((_,r) => setTimeout(() => r(new Error('timeout')), 4000));
            const session = await Promise.race([kit.restore(), _tout]);
            if (session) {
                window.walletSession = session;
                localStorage.setItem('naron_wallet', String(session.actor));
                if (typeof onWalletReady === 'function') onWalletReady();
            }

    <style>

<script>
    // ── WAX ───────────────────────────────────────────────────────────────────
    var wax = new waxjs.WaxJS({ rpcEndpoint:'https://wax.greymass.com', userAccount:'', tryAutoLogin:false });
    var RPC = ['https://api.waxsweden.org','https://wax.eosphere.io','https://wax.eosnation.io'];

    async function fetchRows(p) {
        for (var i=0;i<RPC.length;i++){
            try {
                var ctrl=new AbortController();
                var tid=setTimeout(function(){ctrl.abort();},5000);
                var r=await fetch(RPC[i]+'/v1/chain/get_table_rows',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p),signal:ctrl.signal});
                clearTimeout(tid);
                if (!r.ok) continue;
                var j=await r.json();
                if (j.rows!==undefined) return j;
            } catch(e){continue;}
        }
        return null;
    }

    function getWallet() {
        if (window.walletSession) return String(window.walletSession.actor);
        if (wax && wax.userAccount) return wax.userAccount;
        return localStorage.getItem('naron_wallet')||null;
    }

    async function signTravel(wallet,x,y) {
        var actions=[{account:'players.ale',name:'travel',authorization:[{actor:wallet,permission:'active'}],data:{wallet:wallet,x:x,y:y}}];
        if (window.walletSession) return await window.walletSession.transact({actions});
        if (wax && wax.api) return await wax.api.transact({actions},{blocksBehind:3,expireSeconds:30});
        throw new Error('No wallet session — please log in.');
    }

    // ── LOGIN GATE ────────────────────────────────────────────────────────────
    function gateStatus(msg){ document.getElementById('gate-status').textContent=msg; }
    function showLoginGate(){ document.getElementById('login-gate').classList.remove('gone'); gateStatus('SESSION EXPIRED — PLEASE LOG IN AGAIN'); }

    async function loginAnchor() {
        gateStatus('CONNECTING TO ANCHOR...');
        try {
            var r=await window.walletKit.login();
            window.walletSession=r.session;
            localStorage.setItem('naron_wallet',String(r.session.actor));
            onWalletReady();
        } catch(e){ gateStatus('FAILED — '+(e&&e.message||String(e))); }
    }
    async function loginWCC() {
        gateStatus('CONNECTING TO CLOUD WALLET...');
        try {
            var acc=await wax.login();
            localStorage.setItem('naron_wallet',acc);
            onWalletReady();
        } catch(e){ gateStatus('FAILED — '+(e&&e.message||String(e))); }
    }
    var _sceneStarted = false;
    function onWalletReady() {
        document.getElementById('login-gate').classList.add('gone');
        updateWalletBtn();
        if (!_sceneStarted) { _sceneStarted = true; startScene(); }
    }
    function updateWalletBtn() {
        var btn = document.getElementById('ph-wallet-btn');
        if (!btn) return;
        var w = getWallet();
        if (w) { btn.textContent = w; btn.classList.add('connected'); btn.title = 'Click to disconnect'; }
        else   { btn.textContent = 'CONNECT'; btn.classList.remove('connected'); btn.title = ''; }
    }
    function phWalletClick() {
        var w = getWallet();
        if (w) {
            window.walletSession = null;
            localStorage.removeItem('naron_wallet');
            updateWalletBtn();
        } else {
            document.getElementById('login-gate').classList.remove('gone');
        }
    }

    // ── CONSTANTS ─────────────────────────────────────────────────────────────
    var BASE_SPEED      = 0.003;
    var BOOST_PER_CLICK = 10;
    var MAX_MULTIPLIER  = 10000;

    var PLANETS = {
        magor:  {name:'Magor',  color:'#e05030'},
        naron:  {name:'Naron',  color:'#30a060'},
        eyeke:  {name:'Eyeke',  color:'#5090e0'},
        kavian: {name:'Kavian', color:'#c060d0'},
        neri:   {name:'Neri',   color:'#e0b030'},
        veles:  {name:'Veles',  color:'#40c0c0'},
    };

    var PLANET_ID_MAP = {
        0:'magor',1:'naron',2:'eyeke',3:'kavian',4:'neri',5:'veles',
        '0':'magor','1':'naron','2':'eyeke','3':'kavian','4':'neri','5':'veles',
    };

    function normalizePlanet(p) {
        if (p===null||p===undefined) return null;
        var s=String(p).toLowerCase().trim();
        if (PLANETS[s]) return s;
        if (PLANET_ID_MAP[s]) return PLANET_ID_MAP[s];
        var n=parseInt(s);
        if (!isNaN(n)&&n>=0&&n<=5) return ['magor','naron','eyeke','kavian','neri','veles'][n];
        return null;
    }

    var CAM_OFFSETS = {
        eyeke:{x:1.1,y:-0.5}, kavian:{x:-1.3,y:0.2}, magor:{x:0.2,y:0.8},
        naron:{x:0.6,y:-0.25}, neri:{x:-0.7,y:-0.6}, veles:{x:1.4,y:0.4}
    };

    var ALE_PORTALS = {
        magor:  [{x:2,y:2,to:'naron'},{x:3,y:18,to:'kavian'},{x:2,y:19,to:'eyeke'},{x:38,y:3,to:'neri'},{x:37,y:18,to:'veles'}],
        naron:  [{x:3,y:2,to:'magor'},{x:2,y:20,to:'neri'},{x:39,y:2,to:'veles'},{x:38,y:3,to:'eyeke'},{x:37,y:18,to:'kavian'}],
        eyeke:  [{x:3,y:2,to:'veles'},{x:2,y:4,to:'neri'},{x:38,y:2,to:'naron'},{x:3,y:19,to:'magor'},{x:37,y:19,to:'kavian'}],

    var ALE_LOCATIONS = {

        neri:   {dungeons:[],taverns:[],arenas:[]},
        veles:  {dungeons:[],taverns:[],arenas:[]},
    };

    function decodeLandId(id) {
        if (!id||typeof id!=='string') return null;
        var sep=id.indexOf('x');
        if (sep<1||sep>=id.length-1) return null;
        var dec=function(s){var n=0;for(var k=0;k<s.length;k++){var d=s.charCodeAt(k)-97;if(d<0||d>9)return NaN;n=n*10+d;}return n;};
        var cx=dec(id.slice(0,sep)),cy=dec(id.slice(sep+1));
        if (isNaN(cx)||isNaN(cy)||cx<1||cx>40||cy<1||cy>20) return null;
        return {x:cx,y:cy};
    }

    function _addDungeonCoord(planet,x,y,owner,land_id) {
        if (!planet||!x||!y||!ALE_LOCATIONS[planet]) return false;
        var dup=ALE_LOCATIONS[planet].dungeons.some(function(d){return d.x===x&&d.y===y;});
        if (!dup){ALE_LOCATIONS[planet].dungeons.push({x:x,y:y,owner:owner||null,land_id:land_id||null});return true;}
        return false;
    }

    function _parseDungeonRow(row,defaultPlanet) {
        var x=row.x,y=row.y;
        if ((!x||!y)&&row.land_id){var c=decodeLandId(row.land_id);if(c){x=c.x;y=c.y;}}
        var planet=(row.planet!==undefined&&row.planet!==null)?normalizePlanet(row.planet):defaultPlanet;
        return _addDungeonCoord(planet,x,y,row.owner||row.account||null,row.land_id||null);
    }

    function _refreshAllMaps() {
        var planets=Object.keys(_rendered);
        for (var i=0;i<planets.length;i++){
            if (_rendered[planets[i]]){
                _rendered[planets[i]]=false;
                if (planets[i]===_activePlanet) buildMap(planets[i]);
            }
        }
    }

    var _playerPlayedDungeons=new Set(); // "planet.land_id" strings beaten today

    async function fetchPlayerTaverns(wallet){
        if(!wallet)return;
        try{
            var res=await fetchRows({code:'players.ale',scope:'players.ale',table:'players',lower_bound:wallet,upper_bound:wallet,limit:1,json:true});
            if(!res||!res.rows||!res.rows[0]||res.rows[0].wallet!==wallet)return;
            // Dungeons beaten today
            _playerPlayedDungeons=new Set(res.rows[0].played_dungeons||[]);
            Object.keys(ALE_LOCATIONS).forEach(function(p){ALE_LOCATIONS[p].taverns=[];});
            (res.rows[0].active_taverns||[]).forEach(function(t){
                var planet=normalizePlanet(t.planet);
                if(!planet||!ALE_LOCATIONS[planet])return;
                ALE_LOCATIONS[planet].taverns.push({x:t.x,y:t.y,objectives:t.objectives||[],land_id:t.land_id});
            });
            _refreshAllMaps();
            checkAndOpenTavern();
        }catch(e){}
    }

    function checkAndOpenTavern(){
        if(!_playerPos)return;
        var locs=ALE_LOCATIONS[_playerPos.planet]||{};
        var tv=(locs.taverns||[]).find(function(t){return t.x===_playerPos.x&&t.y===_playerPos.y;});
        if(tv)onCell(_playerPos.x,_playerPos.y);
    }

    function loadUsedTaverns(){

    async function fetchAllDungeons() {
        var planetList=['magor','naron','eyeke','kavian','neri','veles'],added=0;
        try {
            var gd=await fetchRows({code:'dungeons.ale',scope:'dungeons.ale',table:'dungeons',limit:1000,json:true});
            if (gd&&gd.rows) gd.rows.forEach(function(r){if(_parseDungeonRow(r,null))added++;});
        } catch(e){}
        for (var pi=0;pi<planetList.length;pi++){
            try {
                var pd=await fetchRows({code:'dungeons.ale',scope:planetList[pi],table:'dungeons',limit:500,json:true});
                if (pd&&pd.rows) pd.rows.forEach(function(r){if(_parseDungeonRow(r,planetList[pi]))added++;});
            } catch(e){}
        }
        if (added>0) _refreshAllMaps();
        return added;
    }

    async function fetchAllBuildings() {
        var planetList=['magor','naron','eyeke','kavian','neri','veles'],added=0;
        for (var pi=0;pi<planetList.length;pi++){
            var planet=planetList[pi],rows=[];
            for (var si=0;si<2;si++){
                try {
                    var d=await fetchRows({code:'lands.ale',scope:[planet,'lands.ale'][si],table:'lands',limit:1000,json:true});
                    if (d&&d.rows&&d.rows.length) rows=rows.concat(d.rows);
                } catch(e){}
            }
            rows.forEach(function(row){
                var x=row.x,y=row.y;
                if ((!x||!y)&&row.land_id){var c=decodeLandId(row.land_id);if(c){x=c.x;y=c.y;}}
                if (!x||!y) return;
                var rp=(row.planet!==undefined)?normalizePlanet(row.planet):planet;
                if (!rp||!ALE_LOCATIONS[rp]) return;
                var owner=row.owner||null;
                var buildings=row.buildings||row.building||[];
                if (!Array.isArray(buildings)) buildings=[buildings];
                var bStr=JSON.stringify(buildings).toLowerCase();
                if (bStr.indexOf('arena')>=0){
                    var dup2=ALE_LOCATIONS[rp].arenas.some(function(a){return a.x===x&&a.y===y;});
                    if (!dup2){ALE_LOCATIONS[rp].arenas.push({x:x,y:y,owner:owner});added++;}
                }
            });
        }
        if (added>0) _refreshAllMaps();
        return added;
    }

    function initStars() {
        var canvas=document.getElementById('stars-canvas');
        if (!canvas) return;
        var ctx=canvas.getContext('2d'),W,H,cx,cy;
        function resize(){ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; cx=W/2; cy=H/2; }
        resize();
        window.addEventListener('resize',resize);
        var stars=[];
        for (var i=0;i<160;i++) stars.push({x:(Math.random()-0.5)*W,y:(Math.random()-0.5)*H,z:Math.random()*W});
        function draw() {
            ctx.fillStyle='rgba(3,3,14,0.2)';
            ctx.fillRect(0,0,W,H);
            for (var i=0;i<stars.length;i++){
                var s=stars[i],pz=s.z;
                s.z-=_starSpeed;
                if(s.z<=0){s.x=(Math.random()-0.5)*W;s.y=(Math.random()-0.5)*H;s.z=W;pz=s.z;}
                var sx=(s.x/s.z)*W+cx,sy=(s.y/s.z)*H+cy;
                var px=(s.x/pz)*W+cx,py=(s.y/pz)*H+cy;
                var b=1-s.z/W,sz=Math.max(0.5,b*2.5);
                ctx.strokeStyle='rgba(180,255,235,'+b.toFixed(2)+')';
                ctx.lineWidth=sz;
                ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(sx,sy);ctx.stroke();
            }
            // Planet is on its own CSS layer above — no drawImage needed here
            requestAnimationFrame(draw);
        }
        draw();
    }

    function rampStars(target,ms,cb) {
        var start=_starSpeed,t0=performance.now();
        (function step(now){
            var t=Math.min(1,(now-t0)/ms);
            _starSpeed=start+(target-start)*(1-Math.pow(1-t,3));
            if(t<1) requestAnimationFrame(step);
            else{_starSpeed=target;if(cb)cb();}
        })(performance.now());
    }

    function _drawFallbackPlanet(planetKey) {
        var canvas = document.getElementById('planet-webgl');
        var ctx = canvas.getContext('2d');
        if (!ctx) return;
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
        var W = canvas.width, H = canvas.height;
        var cx = W/2, cy = H/2, r = Math.min(W,H)*0.22;
        function drawSphere(img) {
            ctx.clearRect(0,0,W,H);
            ctx.save();
            ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.clip();
            if (img) {
                ctx.drawImage(img, cx-r, cy-r, r*2, r*2);
            } else {
                var p = PLANETS[planetKey]||{color:'#5090e0'};
                var g = ctx.createRadialGradient(cx-r*0.35,cy-r*0.35,r*0.05,cx,cy,r);
                g.addColorStop(0,'rgba(255,255,255,0.55)'); g.addColorStop(0.3,p.color); g.addColorStop(1,'rgba(0,0,0,0.75)');
                ctx.fillStyle=g; ctx.fillRect(cx-r,cy-r,r*2,r*2);
            }
            ctx.restore();
            var shad = ctx.createRadialGradient(cx+r*0.3,cy-r*0.3,0,cx,cy,r);
            shad.addColorStop(0,'rgba(255,255,255,0.12)'); shad.addColorStop(0.5,'rgba(0,0,0,0)'); shad.addColorStop(1,'rgba(0,0,0,0.65)');
            ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle=shad; ctx.fill();
        }
        var img = new Image();
        img.onload = function(){ drawSphere(img); canvas.classList.add('visible'); };
        img.onerror = function(){ drawSphere(null); canvas.classList.add('visible'); };
        img.src = 'planets/'+planetKey+'.jpg';
    }

    function loadPlanetMesh(planetKey, doApproach) {
        initPlanetRenderer();
        if (_webglFailed) { _drawFallbackPlanet(planetKey); return; }
        setPlanetVisible(false); // hide until texture ready — prevents ghost
        if (_mesh){_scene.remove(_mesh);_mesh=null;}
        var off=CAM_OFFSETS[planetKey]||{x:0.6,y:-0.25};
        _mesh=new THREE.Mesh(
            new THREE.SphereGeometry(2.2,64,64),
            new THREE.MeshStandardMaterial({roughness:0.75,metalness:0.05})
        );
        _mesh.userData.speedMultiplier=1;
        _mesh.userData.clickCount=0;
        _mesh.position.x=0;
        _scene.add(_mesh);
        var tx=new THREE.TextureLoader().load('planets/'+planetKey+'.jpg',function(){
            if (_mesh) _mesh.material.map=tx;
            if (_mesh) _mesh.material.needsUpdate=true;
            setPlanetVisible(true);
        });
        tx.minFilter=THREE.LinearFilter;tx.generateMipmaps=false;
        if (doApproach){
            _camera.position.set(off.x,off.y,22);
            _camera.lookAt(0,0,0);
            var t0=null;
            (function approach(ts){
                if(_skipReq){_camera.position.z=4.5;return;}
                if(!t0)t0=ts;
                var t=Math.min(1,(ts-t0)/1800);
                var ease=t<0.65?Math.pow(t/0.65,2)*0.65:0.65+0.35*(1-Math.pow(1-(t-0.65)/0.35,5));
                _camera.position.z=22-ease*(22-4.5);
                if(t<1)requestAnimationFrame(approach);
            })(performance.now());
        } else {
            _camera.position.set(off.x,off.y,4.5);
            _camera.lookAt(0,0,0);
        }
    }

    // Called on tab switch: camera stays fixed, planet flies in from far ahead (warp arrival)
    function loadPlanetMeshWarpIn(planetKey) {
        initPlanetRenderer();
        if (_webglFailed) { _drawFallbackPlanet(planetKey); return; }
        setPlanetVisible(false);
        if (_mesh){_scene.remove(_mesh);_mesh=null;}
        var off=CAM_OFFSETS[planetKey]||{x:0.6,y:-0.25};
        _mesh=new THREE.Mesh(
            new THREE.SphereGeometry(2.2,64,64),
            new THREE.MeshStandardMaterial({roughness:0.75,metalness:0.05})
        );
        _mesh.userData.speedMultiplier=1;
        _mesh.userData.clickCount=0;
        _mesh.position.set(0,0,-22); // far ahead along camera's line of sight
        _scene.add(_mesh);
        // Camera stays at normal viewing distance — no camera movement needed
        _camera.position.set(off.x,off.y,4.5);
        _camera.lookAt(0,0,0);
        var tx=new THREE.TextureLoader().load('planets/'+planetKey+'.jpg',function(){
            if (!_mesh) return;
            _mesh.material.map=tx;
            _mesh.material.needsUpdate=true;
            setPlanetVisible(true);
            // Planet flies from z:-22 toward z:0 (camera is at z:4.5, planet rushes in)
            var t0=null,m=_mesh;
            (function flyIn(ts){
                if(!t0)t0=ts;
                var p=Math.min(1,(ts-t0)/820);
                var ease=1-Math.pow(1-p,2.5); // fast start, ease-out settle
                if(m) m.position.z=-22*(1-ease);
                if(p<1)requestAnimationFrame(flyIn);
                else if(m) m.position.z=0;
            })(performance.now());
        });
        tx.minFilter=THREE.LinearFilter;tx.generateMipmaps=false;
    }

    // ── PLANET WARP: pan right → warp punch → new planet zooms in ────────────
    function warpSwitch(planet,cb){
        // Capture the OLD mesh now — loadPlanetMeshWarpIn will replace _mesh at warp peak,
        // so the panOut closure must not reference the global _mesh.
        var outMesh=_mesh;
        if (outMesh){
            var startX=outMesh.position.x,t0=null;
            (function panOut(ts){
                if(!t0)t0=ts;
                var p=Math.min(1,(ts-t0)/360);
                outMesh.position.x=startX+p*p*15; // ease-in to the right
                if(p<1)requestAnimationFrame(panOut);
            })(performance.now());
        }
        // Stars spike hard (warp punch), then hold briefly before slowing as new planet arrives
        rampStars(38,260,function(){
            // At warp peak: drop old planet, load new one zooming in from far
            setPlanetVisible(false);
            loadPlanetMeshWarpIn(planet);
            showArrival(planet);
            // Stars ramp down over 900ms matching the camera zoom-in
            rampStars(0.35,900);
            if(cb)cb();
        });
    }

    // ── HIRE FIGHTER ──────────────────────────────────────────────────────────
    // nfttemplates: {templateid_string → full row} — eligibility + properties for AP calc
    var _tavernTemplateMap=null;

    async function loadTavernData(){
        if(_tavernTemplateMap)return;
        var map={},lb='';
        while(true){
            var d=await fetchRows({code:'tavern.ale',scope:'tavern.ale',table:'nfttemplates',limit:500,lower_bound:lb||undefined,json:true});
            if(!d||!d.rows||!d.rows.length)break;
            d.rows.forEach(function(r){if(r.templateid!=null)map[String(r.templateid)]=r;});
            if(!d.more)break;
            lb=d.next_key||'';if(!lb)break;
        }
        _tavernTemplateMap=map;
    }

    // Returns true if a single objective matches a template row
    function _objMatch(tmplRow, obj){
        if(!tmplRow||!obj)return false;
        switch(obj.objective_type){
            case 'schema':   return tmplRow.schema===obj.objective_string;
            case 'rarity':   return tmplRow.rarity===obj.objective_string;
            case 'shine':    return tmplRow.shine===obj.objective_string;
            case 'element':  return tmplRow.element===obj.objective_string;
            case 'race':     return tmplRow.race===obj.objective_string;
            case 'cardname': return tmplRow.cardname===obj.objective_string;
            case 'type':     return tmplRow.type===obj.objective_string;
            case 'atk':      return Number(tmplRow.atk)===Number(obj.objective_value);
            case 'def':      return Number(tmplRow.def)===Number(obj.objective_value);
            case 'pow':      return Number(tmplRow.pow)===Number(obj.objective_value);
            case 'movcost':  return Number(tmplRow.movcost)===Number(obj.objective_value);
            case 'tlm.mp':   return Number(tmplRow.tlm_mp)===Number(obj.objective_value);
            case 'nft.mp':   return Number(tmplRow.nft_mp)===Number(obj.objective_value);
        }
        return false;
    }

    // Per-NFT potential reduction (for display label only — not used for the final cost)
    function calcHireMod(tmplRow, objectives){
        if(!objectives||!tmplRow)return 0;
        return objectives.reduce(function(t,obj){return t+(_objMatch(tmplRow,obj)?Number(obj.mod_value||0):0);},0);
    }

    // True cost reduction: each objective counts once if ANY selected template covers it
    function calcTotalReduction(checkedTids, objectives){
        if(!objectives||!checkedTids||!checkedTids.length)return 0;
        var tmpls=checkedTids.map(function(tid){return _tavernTemplateMap&&_tavernTemplateMap[tid];}).filter(Boolean);
        return objectives.reduce(function(t,obj){
            var covered=tmpls.some(function(tmpl){return _objMatch(tmpl,obj);});
            return t+(covered?Number(obj.mod_value||0):0);
        },0);
    }

    async function loadPlayerHireNFTs(wallet, objectives){
        await loadTavernData();
        // Extract unique schemas from eligible templates
        var schemas={};
        Object.values(_tavernTemplateMap).forEach(function(r){if(r.schema)schemas[r.schema]=true;});
        var schemaList=Object.keys(schemas);
        var results=[];
        for(var i=0;i<schemaList.length;i++){
            try{
                // Fetch up to 2 pages per schema
                for(var pg=1;pg<=2;pg++){
                    var url='https://wax.api.atomicassets.io/atomicassets/v1/assets'
                        +'?owner='+encodeURIComponent(wallet)
                        +'&collection_name=alien.worlds'
                        +'&schema_name='+encodeURIComponent(schemaList[i])
                        +'&limit=100&page='+pg;
                    var r=await fetch(url);
                    var j=await r.json();
                    if(!j.success||!j.data||!j.data.length)break;
                    j.data.forEach(function(a){
                        var tid=String(a.template&&a.template.template_id);
                        var tmpl=_tavernTemplateMap[tid];
                        if(!tmpl)return; // not in eligible list
                        var mod=calcHireMod(tmpl,objectives);
                        results.push({
                            asset_id:a.asset_id,
                            template_id:tid,
                            name:tmpl.cardname||a.name||('NFT #'+a.asset_id),
                            schema:tmpl.schema,
                            rarity:tmpl.rarity||'',
                            shine:tmpl.shine||'',
                            mod_value:mod,
                        });
                    });
                    if(j.data.length<100)break;
                }
            }catch(e){}
        }
        // Dedup by template_id — multiple assets from same template give no extra reduction
        var seen={};
        results=results.filter(function(n){
            if(seen[n.template_id])return false;
            seen[n.template_id]=true;
            return true;
        });
        // Sort highest AP reduction first
        results.sort(function(a,b){return b.mod_value-a.mod_value;});
        return results;
    }

    function _hEsc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

    function renderHireNFTs(nfts,baseCost){
        var el=document.getElementById('hire-nft-list');
        if(!el)return;
        if(!nfts||!nfts.length){
            el.innerHTML='<div class="hire-nft-empty">No eligible NFTs in wallet.</div>';
            el.classList.add('open');return;
        }
        var html='<div class="hire-cost-note">Select up to 3 NFTs to reduce AP cost:</div>';
        var schemaShort={'arms.worlds':'arms','tool.worlds':'tool','crew.worlds':'crew','level.worlds':'level','faces.worlds':'face','land.worlds':'land'};
        var autoCount=0;
        nfts.forEach(function(n,i){
            // Auto-check top 3 with mod_value > 0
            var autoCheck=n.mod_value>0&&autoCount<3;
            if(autoCheck)autoCount++;
            var sc=schemaShort[n.schema]||n.schema||'';
            var meta='#'+n.asset_id+' · '+_hEsc(n.rarity)+(n.shine&&n.shine!=='-'?' · '+_hEsc(n.shine):'')+' · '+sc;
            html+='<label class="hire-nft-row" onclick="onHireNftChange(event,this)">'
                +'<input type="checkbox" class="hire-nft-cb" value="'+_hEsc(n.asset_id)+'" data-mod="'+Number(n.mod_value)+'"'+(autoCheck?' checked':'')+' data-tid="'+_hEsc(n.template_id||'')+'">'
                +'<div class="hire-nft-info">'
                +'<span class="hire-nft-name">'+_hEsc(n.name)+'</span>'
                +'<span class="hire-nft-meta">'+meta+'</span>'
                +'</div>'
                +(n.mod_value?'<span class="hire-nft-ap">-'+n.mod_value+' AP</span>':'<span class="hire-nft-ap" style="color:#3a4050">0 AP</span>')
                +'</label>';
        });
        html+='<div class="hire-cost-summary" id="hire-cost-summary"></div>';
        el.innerHTML=html;
        el.classList.add('open');
        updateHireCost();
        showHireNFTPanel();
    }

    function onHireNftChange(e,label){
        // Enforce max 3 selected
        var cb=label.querySelector('.hire-nft-cb');
        var allCbs=document.querySelectorAll('.hire-nft-cb');
        var checked=document.querySelectorAll('.hire-nft-cb:checked');
        if(cb&&cb.checked&&checked.length>3){
            cb.checked=false;
            e.preventDefault();
            return;
        }
        // Dim labels that can't be selected when at limit
        var nowChecked=document.querySelectorAll('.hire-nft-cb:checked').length;
        allCbs.forEach(function(c){
            c.closest('label').style.opacity=(nowChecked>=3&&!c.checked)?'0.35':'';
            c.disabled=nowChecked>=3&&!c.checked;
        });
        updateHireCost();
    }

    function updateHireCost(){
        var base=_hireBaseCost||100;
        var checked=document.querySelectorAll('.hire-nft-cb:checked');
        var checkedTids=[];
        checked.forEach(function(cb){if(cb.dataset.tid)checkedTids.push(cb.dataset.tid);});
        var reduction=calcTotalReduction(checkedTids,_hireObjectives);
        var final=Math.max(1,base-reduction);
        var btn=document.getElementById('hire-btn');
        if(btn)btn.textContent='HIRE FIGHTER ('+final+' AP)';
        var summary=document.getElementById('hire-cost-summary');
        var count=checked.length;
        if(summary&&reduction>0)summary.textContent='est. ~'+final+' AP with '+count+' NFT'+(count!==1?'s':'');
        else if(summary)summary.textContent=base+' AP — no NFTs selected';
        // Apply dim state on initial render
        var allCbs=document.querySelectorAll('.hire-nft-cb');
        allCbs.forEach(function(c){
            c.closest('label').style.opacity=(count>=3&&!c.checked)?'0.35':'';
            c.disabled=count>=3&&!c.checked;
        });
        updateHireNFTPanel();
    }

    async function doHire(){
        if(!_sel||!_sel.isTavern)return;
        var wallet=getWallet();
        var btn=document.getElementById('hire-btn');
        var status=document.getElementById('action-status');
        if(!wallet){status.textContent='⚠ PLEASE LOG IN';status.className='err';return;}
        var cbs=document.querySelectorAll('.hire-nft-cb:checked');

        var checkedTids=[];
        cbs.forEach(function(cb){asset_ids.push(cb.value);if(cb.dataset.tid)checkedTids.push(cb.dataset.tid);});
        var reduction=calcTotalReduction(checkedTids,_hireObjectives);
        var authorizedCost=Math.max(1,(_hireBaseCost||100)-reduction);
        btn.disabled=true;btn.textContent='HIRING…';
        status.textContent='';status.className='';
        try{
            var actions=[{account:'players.ale',name:'hire',authorization:[{actor:wallet,permission:'active'}],
                data:{wallet:wallet,asset_ids:asset_ids,cost_action_points:authorizedCost}}];
            if(window.walletSession)await window.walletSession.transact({actions});
            else if(wax&&wax.api)await wax.api.transact({actions},{blocksBehind:3,expireSeconds:30});
            else throw new Error('No wallet session — please log in.');
            status.textContent='✓ FIGHTER HIRED';status.className='ok';
            if(_sel&&_sel.tavernEntry&&_sel.tavernEntry.land_id){
                var tvKey=_activePlanet+'.'+_sel.tavernEntry.land_id;
                _playerUsedTaverns.add(tvKey);
                var tvToday=new Date().toISOString().slice(0,10);
                try{localStorage.setItem('naron_used_taverns',JSON.stringify({date:tvToday,keys:Array.from(_playerUsedTaverns)}));}catch(e){}
                var tvContainer=document.getElementById('map-'+_activePlanet);
                if(tvContainer){
                    var tvCell=tvContainer.querySelector('[data-x="'+_sel.x+'"][data-y="'+_sel.y+'"]');

                        tvCell.classList.add('ale-tv-locked');

                    }
                }
            }
            setTimeout(dismissStrip,3000);
        }catch(e){
            status.textContent='✗ '+((e&&e.message)||'Failed').substring(0,60);
            status.className='err';
        }
        btn.disabled=false;btn.textContent='HIRE FIGHTER ('+authorizedCost+' AP)';
    }

            } else {
                var tmpls=checkedTids.map(function(tid){return _tavernTemplateMap&&_tavernTemplateMap[tid];}).filter(Boolean);
                var ohtml='';
                _hireObjectives.forEach(function(obj){
                    var covered=tmpls.some(function(tmpl){return _objMatch(tmpl,obj);});
                    var label=obj.objective_string||obj.objective_value||obj.objective_type||'?';
                    var ap=Number(obj.mod_value||0);
                    ohtml+='<div class="hnp-obj-sq '+(covered?'covered':'uncovered')+'">'+label+(ap?'<br>−'+ap+' AP':'')+'</div>';
                });
                objsEl.innerHTML=ohtml;
            }
        }
    }

    // ── PLAYER POSITION REFRESH ───────────────────────────────────────────────
    function updatePlayerPlanetLabel(){
        var lbl=document.getElementById('player-planet-display');
        if(!lbl||!_playerPos)return;
        var pn=_playerPos.planet;
        var pName=(PLANETS[pn]||{name:pn}).name.toUpperCase();
        lbl.textContent='YOU: '+pName+' ('+_playerPos.x+', '+_playerPos.y+')';
        lbl.style.color=(PLANETS[pn]||{}).color||'#a09060';
    }

    async function refreshPlayerPos(){
        var wallet=getWallet();
        var btn=document.getElementById('pos-refresh');
        var lbl=document.getElementById('player-planet-display');
        if(!wallet){if(lbl){lbl.textContent='LOG IN FIRST';lbl.style.color='#705050';}return;}
        if(btn)btn.disabled=true;
        if(lbl){lbl.textContent='…';lbl.style.color='#555';}
        try{
            var res=await fetchRows({code:'players.ale',scope:'players.ale',table:'players',lower_bound:wallet,upper_bound:wallet,limit:1,json:true});
            if(res&&res.rows&&res.rows[0]&&res.rows[0].wallet===wallet){
                var row=res.rows[0];
                var pn=normalizePlanet(row.planet||'');
                if(pn&&PLANETS[pn]){
                    _playerPos={planet:pn,x:row.x||1,y:row.y||1};
                    applyMarker();
                    updatePlayerPlanetLabel();
                }
            }
        }catch(e){if(lbl){lbl.textContent='ERROR';lbl.style.color='#905050';}}
        if(btn)btn.disabled=false;
    }

    // ── GRID TOGGLE ───────────────────────────────────────────────────────────
    var _gridOn=false;
    function toggleGrid(){
        _gridOn=!_gridOn;
        document.querySelector('.maps-stack').classList.toggle('ale-grid-on',_gridOn);
        document.getElementById('grid-toggle').classList.toggle('on',_gridOn);
    }

    // ── QUICK TRAVEL TOGGLE ───────────────────────────────────────────────────
    function toggleQuickTravel(){
        _quickTravel=!_quickTravel;
        document.getElementById('qt-toggle').classList.toggle('on',_quickTravel);
    }

    // ── PANEL TOGGLE ──────────────────────────────────────────────────────────
    function togglePanel(){
        _panelOpen=!_panelOpen;
        document.getElementById('map-panel').classList.toggle('collapsed',!_panelOpen);
        document.getElementById('minimize-btn').textContent=_panelOpen?'― MINIMIZE MAP ―':'+ OPEN MAP +';
    }

    // ── QUEST OVERLAY ─────────────────────────────────────────────────────────
    var _qData=null, _qPerms={}, _qScope='day', _qLoaded=false;

    function toggleQuestOverlay(){
        var panel=document.getElementById('qo-panel');
        var btn=document.getElementById('qo-toggle');
        var open=panel.classList.toggle('open');
        btn.classList.toggle('open',open);
        btn.innerHTML=(open?'&#x2B21; ACTIVE QUESTS &#9650;':'&#x2B21; ACTIVE QUESTS &#9660;');
        if(open&&!_qLoaded) loadQuestOverlay();
    }

    function setQScope(scope){
        _qScope=scope;
        document.querySelectorAll('.qo-tab').forEach(function(t){t.classList.toggle('active',t.dataset.scope===scope);});
        renderQuestOverlay();
    }

    async function loadQuestOverlay(){
        var wallet=getWallet();
        if(!wallet){document.getElementById('qo-list').innerHTML='<div class="qo-empty">Log in to view quests.</div>';return;}
        document.getElementById('qo-status').textContent='Loading…';
        try{
            var qres=await fetchRows({code:'quests.ale',scope:'quests.ale',table:'activequests',lower_bound:wallet,upper_bound:wallet,limit:1,json:true});
            _qData=(qres&&qres.rows&&qres.rows[0]&&qres.rows[0].player===wallet)?qres.rows[0]:null;
            var pres=await fetchRows({code:'players.ale',scope:'players.ale',table:'players',lower_bound:wallet,upper_bound:wallet,limit:1,json:true});
            _qPerms={};
            if(pres&&pres.rows&&pres.rows[0]) (pres.rows[0].permstats||[]).forEach(function(s){_qPerms[s.first]=Number(s.second);});
            _qLoaded=true;
            document.getElementById('qo-status').textContent='';
            renderQuestOverlay();
        }catch(e){document.getElementById('qo-status').textContent='✗ '+((e&&e.message)||'Error');}
    }

    function renderQuestOverlay(){
        var list=document.getElementById('qo-list');
        if(!list) return;
        if(!_qData||!_qData.quests||!_qData.quests.length){list.innerHTML='<div class="qo-empty">No active quests.</div>';return;}
        var scoped=_qData.quests.filter(function(q){return q.quest_scope===_qScope;});
        if(!scoped.length){list.innerHTML='<div class="qo-empty">No '+_qScope+' quests.</div>';return;}
        var html='';
        scoped.forEach(function(q){
            var delta=q.task_end_value-q.task_start_value;
            var gained=Math.max(0,(_qPerms[q.task_type]||0)-q.task_start_value);
            var pct=delta>0?Math.min(1,gained/delta):0;
            var done=pct>=1;
            var bar=Math.round(pct*100);
            var reward=q.reward_type==='tlm'
                ?'<span class="qo-reward" style="color:#60c0e0;">'+(q.reward_amount/10000).toFixed(2)+' TLM</span>'
                :'<span class="qo-reward" style="color:#c060e0;">'+(q.reward_amount/10).toFixed(1)+' SHARDS</span>';
            html+='<div class="qo-item'+(done?' done':'')+'"><div class="qo-title">'+reward+_qEsc(q.quest_title)+'</div>';
            html+='<div class="qo-bar-wrap"><div class="qo-bar"><div class="qo-bar-fill'+(done?' done':'')+'" style="width:'+bar+'%"></div></div>';
            html+='<span class="qo-pct">'+(done?'✓':bar+'%')+'</span></div></div>';
        });
        list.innerHTML=html;
    }

    function _qEsc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

    // ── INIT ──────────────────────────────────────────────────────────────────
    initStars();
    updateWalletBtn();
    if(localStorage.getItem('naron_wallet')) {
        document.getElementById('login-gate').classList.add('gone');
        _sceneStarted = true;
        startScene();
    }
</script>

    <div id="hnp-slots"></div>
    <div id="hnp-objs"></div>
</div>
