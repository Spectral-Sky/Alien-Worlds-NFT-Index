        if (itemEl) itemEl.style.background = 'rgba(192,144,96,0.08)';
        if (progLbl)  progLbl.textContent = 'RETRY ' + (j+1) + '/' + toRetry.length + '  ·  ' + step.label;
        if (progFill) progFill.style.width = (j / toRetry.length * 100).toFixed(0) + '%';

        // Recompute hire actions with current _hireBaseCost before each retry
        if (step.isTravelAndHire || step.isHire) {
            var hd = txqBestHire(wallet, allNFTs, step.objectives);
            if (step.isTravelAndHire) {
                step.actions = [
                    { account:'players.ale', name:'travel', authorization:[{actor:wallet,permission:'active'}], data: step.travelData },
                    { account:'players.ale', name:'hire',   authorization:[{actor:wallet,permission:'active'}], data: hd }
                ];
            } else {
                step.actions = [{ account:'players.ale', name:'hire',
                    authorization:[{actor:wallet,permission:'active'}], data: hd }];
            }
        }

        try {
            if (window.walletSession) await window.walletSession.transact({actions: step.actions});
            else if (wax && wax.api)  await wax.api.transact({actions: step.actions},{blocksBehind:3,expireSeconds:30});
            else throw new Error('No wallet session');

            var travelAct = step.actions.find(function(a){ return a.name==='travel'; });
            if (travelAct) _playerPos = {planet:_activePlanet, x:travelAct.data.x, y:travelAct.data.y};
            if (step.tavern && step.tavern.land_id) {
                var key = _activePlanet + '.' + step.tavern.land_id;
                _playerUsedTaverns.add(key);
                try {
                    var today = new Date().toISOString().slice(0,10);
                    localStorage.setItem('naron_used_taverns', JSON.stringify({date:today, keys:Array.from(_playerUsedTaverns)}));
                } catch(e){}
            }
            if (itemEl) {
                itemEl.style.background = 'rgba(96,224,144,0.06)';
                var lbl = itemEl.querySelector('.txq-item-label');
                if (lbl) lbl.style.color = '#60e090';
                var rb = itemEl.querySelector('.txq-item-retry');
                if (rb) rb.remove();
            }
            succeeded++;
        } catch(e) {
            console.error('Retry queue error:', e);
            _failedPlan.push(step);
            if (itemEl) {
                itemEl.style.background = 'rgba(255,68,68,0.06)';
                var lbl = itemEl.querySelector('.txq-item-label');
                if (lbl) lbl.style.color = '#ff6688';
            }
            failed++;
        }

        if (j < toRetry.length - 1 && !_txQueueAbort) {
            await new Promise(function(r){ setTimeout(r, 2500); });
        }
    }

    if (progFill) progFill.style.width = '100%';
    var retrySummary = _txQueueAbort
        ? '⚠ RETRY ABORTED  (' + succeeded + ' done)'
        : '⟳ RETRY: ' + succeeded + '/' + toRetry.length + (failed ? '  ·  ' + failed + ' still failed' : '  ✓ ALL CLEAR');
    if (progLbl)  progLbl.textContent = retrySummary + '  ·  refreshing…';
    if (runBtn)   { runBtn.disabled = false; }
    if (closeBtn) { closeBtn.textContent = '▼'; closeBtn.style.color = ''; }
    if (rfBtn) {
        if (_failedPlan.length) { rfBtn.disabled = false; rfBtn.textContent = '⟳ RETRY FAILED (' + _failedPlan.length + ')'; }
        else rfBtn.style.display = 'none';
    }

    _txQueueRunning = false;
    applyMarker();
    updatePlayerPlanetLabel();

    _playerNFTCache = null;
    _playerNFTCacheTime = 0;
    try { await fetchPlayerTaverns(wallet); } catch(e) {}
    _refreshAllMaps();
    updateTabCounts();
    loadPlayerHireNFTs(wallet, []).catch(function(){});
    if (progLbl) progLbl.textContent = retrySummary;
}

// ── AUTO-REROLL QUEST PANEL ───────────────────────────────────────────────────

function renderArSlots() {
    var el = document.getElementById('ar-slots');
    if (!el) return;
    var html = '';
    ['day','week','month'].forEach(function(scope) {
        var running = _arRunning[scope];

        // Pull current quest data for this scope from the already-loaded quest cache
        var q = null;
        if (typeof _qData !== 'undefined' && _qData && _qData.quests) {
            q = _qData.quests.find(function(x){ return (x.scope||x.quest_scope) === scope; }) || null;
        }
        var questInfo = '';
        var hasProgress = false;
        if (q) {
            var isShardQ = q.reward_type !== 'tlm';
            var reward = isShardQ
                ? (q.reward_amount/10).toFixed(1)+' SHARDS'
                : (q.reward_amount/10000).toFixed(2)+' TLM';
            var delta = q.task_end_value - q.task_start_value;
            var gained = (typeof _qPerms !== 'undefined') ? Math.max(0, (_qPerms[q.task_type]||0) - q.task_start_value) : 0;
            var pct = delta > 0 ? Math.min(100, Math.round(gained/delta*100)) : 0;
            hasProgress = pct > 5;
            var progressColor = pct >= 100 ? '#60e090' : hasProgress ? '#e0a030' : '#606070';
            questInfo = '<span style="font-size:0.54em;color:'+progressColor+';margin-left:4px;">'
                + reward + ' · ' + pct + '%'
                + (hasProgress && !running ? ' ⚠' : '')
                + '</span>';
        }

        html += '<div id="ar-slot-'+scope+'" style="display:flex;align-items:center;gap:4px;padding:3px 0;flex-wrap:wrap;">'
            + '<span style="font-size:0.58em;color:#a09070;min-width:36px;">'+scope.toUpperCase()+'</span>'
            + (running
                ? '<button style="font-size:0.6em;padding:2px 6px;border:1px solid #c06060;color:#c06060;background:transparent;cursor:pointer;" onclick="stopAutoReroll(\''+scope+'\')">&#9632; STOP</button>'
                : '<button style="font-size:0.6em;padding:2px 6px;border:1px solid rgba(192,144,96,0.4);color:'+(hasProgress?'#a07030':'#c09060')+';background:transparent;cursor:pointer;" onclick="startAutoReroll(\''+scope+'\')" title="'+(hasProgress?'⚠ This quest has progress — confirm before rolling':'Roll until shard quest found')+'">&#9654; START</button>')
            + questInfo
            + '<span id="ar-status-'+scope+'" style="font-size:0.54em;color:#606070;margin-left:2px;"></span>'
            + '</div>';
    });
    el.innerHTML = html;
}

async function startAutoReroll(scope) {
    var wallet = getWallet();
    if (!wallet || _arRunning[scope]) return;
    _arRunning[scope] = true;
    _arStop[scope] = false;
    renderArSlots();
    updateArStatus(scope, 'Rolling…');

    while (!_arStop[scope]) {
        var q = null;
        try { q = await fetchQuestByScope(wallet, scope); } catch(fe) {
            updateArStatus(scope, '✗ Fetch error: ' + ((fe && fe.message) || String(fe)));
            break;
        }
        if (!q) { updateArStatus(scope, '✗ No quest found for ' + scope); break; }

        // Stop condition: explicitly a non-TLM reward type (shard quest)
        if (q.reward_type && q.reward_type !== 'tlm') {
            _arRunning[scope] = false;
            renderArSlots();
            showArShardFound(scope, q);
            return;
        }

        try {
            var sess = window.walletSession;
            if (!sess) { updateArStatus(scope, '✗ Not logged in'); break; }
            await sess.transact({ actions: [{
                account: 'quests.ale', name: 'reroll',
                authorization: [{actor: wallet, permission: 'active'}],
                data: { wallet: wallet, scope: (q.scope || q.quest_scope || scope),
                        quest_name: q.quest_name,
                        reward_amount: q.reward_amount,
                        task_end_value: q.task_end_value }
            }]});
            updateArStatus(scope, 'Rerolled…');
        } catch(e) {
            updateArStatus(scope, '✗ ' + ((e && e.message) || 'TX fail'));
            break;
        }

        await new Promise(function(r){ setTimeout(r, 1000); });
    }

    _arRunning[scope] = false;
    renderArSlots();
    if (_arStop[scope]) updateArStatus(scope, 'Stopped.');
}

function stopAutoReroll(scope) {
    _arStop[scope] = true;
}

function updateArStatus(scope, msg) {
    var el = document.getElementById('ar-status-'+scope);
    if (el) el.textContent = msg;
}

function showArShardFound(scope, q) {
    var el = document.getElementById('ar-slot-'+scope);
    if (!el) return;
    var shards = (q.reward_amount / 10).toFixed(1);
    el.innerHTML =
        '<div style="font-size:0.56em;color:#c060e0;margin-bottom:3px;">⬡ SHARD QUEST — '+shards+' SHARDS</div>'
        + '<button style="font-size:0.58em;padding:2px 8px;border:1px solid rgba(192,144,96,0.4);color:#c09060;background:transparent;cursor:pointer;" '
        +   'onclick="startAutoReroll(\''+scope+'\')">&#9654; CONTINUE REROLLING</button>'
        + '<button style="font-size:0.58em;padding:2px 8px;margin-left:4px;border:1px solid rgba(96,192,96,0.4);color:#60c090;background:transparent;cursor:pointer;" '
        +   'onclick="acceptArQuest(\''+scope+'\')">&#10003; ACCEPT QUEST</button>';
}

function acceptArQuest(scope) {
    _arStop[scope] = true;
    _arRunning[scope] = false;
    var el = document.getElementById('ar-slot-'+scope);
    if (el) el.innerHTML = '<span style="font-size:0.56em;color:#60c090;">'+scope.toUpperCase()+' — Quest accepted.</span>';
}

async function fetchQuestByScope(wallet, scope) {
    var res = await fetchRows({code:'quests.ale', scope:'quests.ale', table:'activequests',
        lower_bound:wallet, upper_bound:wallet, limit:1, json:true});
    if (!res || !res.rows || !res.rows[0]) return null;
    var quests = res.rows[0].quests || [];
    return quests.find(function(q){ return (q.scope || q.quest_scope) === scope; }) || null;
}
</script>
