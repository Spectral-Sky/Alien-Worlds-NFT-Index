<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-48CCMEYHXG"></script>

    <title>ALE Star Chart // Naron Codex</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="NCico.png">
    <script src="waxjs.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script type="module">
        import { SessionKit } from 'https://esm.sh/@wharfkit/session@1';
        import { WebRenderer } from 'https://esm.sh/@wharfkit/web-renderer@1';
        import { WalletPluginAnchor } from 'https://esm.sh/@wharfkit/wallet-plugin-anchor@1';
        const kit = new SessionKit({
            appName: 'naroncodex',
            chains: [{ id: '1064487b3cd1a897ce03ae5b6a865651747e2e152090f99c1d19d44e01aea5a4', url: 'https://wax.greymass.com' }],
            ui: new WebRenderer(),
            walletPlugins: [new WalletPluginAnchor()],
        });
        window.walletKit = kit;
        try {
            const session = await kit.restore();
            if (session) {
                window.walletSession = session;
                localStorage.setItem('naron_wallet', String(session.actor));
                if (typeof onWalletReady === 'function') onWalletReady();
            }
        } catch(e) {
            localStorage.removeItem('naron_wallet');
            if (typeof showLoginGate === 'function') showLoginGate();
        }
    </script>
    <style>
        :root { --gold: #e8a020; }
        *, *::before, *::after { box-sizing: border-box; }
        body { margin:0; padding:0; background:#03030e; color:#d0d0d0; font-family:'Courier New',monospace; overflow:hidden; height:100vh; width:100vw; cursor:crosshair; }
        a, button { cursor:crosshair !important; }

        /* ── BACKGROUND LAYERS ─────────────────────────────────────────────── */
        #stars-canvas { position:fixed; inset:0; width:100vw; height:100vh; z-index:1; pointer-events:none; }
        #planet-webgl  { display:none; position:absolute; top:-9999px; left:-9999px; }

        /* ── PAGE HEADER ───────────────────────────────────────────────────── */
        .page-header {
            position:fixed; top:0; left:0; right:0; z-index:600;
            display:flex; justify-content:space-between; align-items:center;
            background:rgba(3,3,14,0.88); backdrop-filter:blur(8px);
            border-bottom:1px solid rgba(232,160,32,0.25);
            padding:0 20px; height:52px;
        }
        .ph-logo a { color:var(--gold); font-size:1.3em; letter-spacing:4px; text-decoration:none; text-transform:uppercase; text-shadow:0 0 10px rgba(232,160,32,0.4); transition:opacity 0.2s; }
        .ph-logo a:hover { opacity:0.8; }
        .ph-right img { height:32px; opacity:0.6; }

        /* ── LOGIN GATE ────────────────────────────────────────────────────── */
        #login-gate { position:fixed; inset:0; z-index:9000; background:rgba(3,3,14,0.93); backdrop-filter:blur(8px); display:flex; align-items:center; justify-content:center; }
        #login-gate.gone { display:none; }
        .gate-box { border:1px solid rgba(232,160,32,0.4); background:rgba(10,8,2,0.97); padding:42px 52px 36px; text-align:center; max-width:400px; width:88%; box-shadow:0 0 50px rgba(232,160,32,0.08); }
        .gate-logo { margin-bottom:16px; }
        .gate-logo img { height:52px; opacity:0.85; }
        .gate-title { color:var(--gold); font-size:1.1em; letter-spacing:5px; margin:0 0 6px; text-transform:uppercase; }
        .gate-sub { color:#445; font-size:0.68em; letter-spacing:2px; margin:0 0 30px; }
        .gate-btn { display:block; width:100%; padding:13px 0; margin-bottom:12px; background:transparent; border:1px dashed var(--gold); color:var(--gold); font-family:'Courier New',monospace; font-size:0.88em; letter-spacing:3px; text-transform:uppercase; cursor:pointer; transition:all 0.25s; }
        .gate-btn:hover { background:var(--gold); color:#000; border-style:solid; }
        #gate-status { color:#555; font-size:0.67em; letter-spacing:2px; margin-top:18px; min-height:1.5em; }

        /* ── ARRIVAL BANNER ────────────────────────────────────────────────── */
        #arrival-banner { position:fixed; top:52px; left:0; right:0; z-index:200; text-align:center; padding:24px 20px 18px; pointer-events:none; opacity:0; transition:opacity 0.6s; }
        #arrival-banner.visible { opacity:1; }
        #arrival-planet-name { font-size:2.1em; letter-spacing:8px; font-weight:bold; color:var(--gold); text-transform:uppercase; text-shadow:0 0 30px rgba(232,160,32,0.6),0 2px 8px #000; margin-bottom:8px; }
        #arrival-sub   { color:#ccaa88; font-size:0.72em; letter-spacing:3px; text-shadow:0 1px 6px #000; margin-bottom:4px; }
        #arrival-status { color:#aa8866; font-size:0.65em; letter-spacing:2px; text-shadow:0 1px 6px #000; }
        @keyframes fadein-up { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
        #arrival-banner > * { animation:fadein-up 0.7s ease both; }
        #arrival-banner > *:nth-child(2) { animation-delay:0.3s; }
        #arrival-banner > *:nth-child(3) { animation-delay:0.55s; }

        /* ── EASTER EGG ────────────────────────────────────────────────────── */
        #egg-msg { position:fixed; top:50%; left:50%; z-index:300; transform:translate(-50%,-50%); color:var(--gold); font-size:1.5em; letter-spacing:4px; text-transform:uppercase; text-shadow:0 0 24px rgba(232,160,32,0.9); pointer-events:none; opacity:0; font-weight:bold; }
        @keyframes egg-pop { 0%{opacity:0;transform:translate(-50%,-50%) scale(0.4);} 18%{opacity:1;transform:translate(-50%,-50%) scale(1.12);} 70%{opacity:1;transform:translate(-50%,-50%) scale(1);} 100%{opacity:0;transform:translate(-50%,-62%);} }
        #egg-msg.pop { animation:egg-pop 2s ease forwards; }

        /* ── SKIP BUTTON ───────────────────────────────────────────────────── */
        #skip-btn { position:fixed; bottom:22px; right:22px; z-index:700; padding:7px 18px; background:rgba(0,0,0,0.7); border:1px solid #2a2a3a; color:#444; font-family:'Courier New',monospace; font-size:0.66em; letter-spacing:2px; cursor:pointer; display:none; transition:all 0.2s; }
        #skip-btn:hover { color:#888; border-color:#555; }

        /* ── MAP OVERLAY: centered floating panel ──────────────────────────── */
        #map-overlay {
            position:fixed; top:52px; left:0; right:0; bottom:0;
            z-index:500;
            display:flex; align-items:center; justify-content:center;
            pointer-events:none;
        }
        #map-overlay.gone { display:none; }

        #map-box {
            pointer-events:all;
            display:flex; flex-direction:column;
            background:rgba(5,8,20,0.82); backdrop-filter:blur(8px);
            border:1px solid rgba(232,160,32,0.22);
            box-shadow:0 0 60px rgba(0,0,0,0.9), 0 0 20px rgba(232,160,32,0.06);
            max-width:calc(100vw - 20px);
            max-height:calc(100vh - 72px);
            overflow:hidden;
        }

        /* ── MINIMIZE TOGGLE ───────────────────────────────────────────────── */
        #minimize-btn {
            display:flex; align-items:center; justify-content:center;
            padding:5px; background:rgba(0,0,0,0.5);
            border-bottom:1px solid rgba(232,160,32,0.1);
            color:#446; font-size:0.58em; letter-spacing:3px; cursor:pointer;
            font-family:'Courier New',monospace; text-transform:uppercase;
            transition:color 0.2s; user-select:none; flex-shrink:0;
        }
        #minimize-btn:hover { color:#aaa; }

        /* ── PLANET TABS ───────────────────────────────────────────────────── */
        #planet-tabs {
            display:flex; background:rgba(8,6,2,0.95);
            border-bottom:2px solid rgba(232,160,32,0.15);
            padding:0 12px; overflow-x:auto; flex-shrink:0;
        }
        .planet-tab { padding:8px 18px 10px; font-family:'Courier New',monospace; font-weight:bold; font-size:0.82em; letter-spacing:2px; text-transform:uppercase; background:transparent; border:none; color:#555; cursor:pointer; transition:all 0.2s; border-bottom:2px solid transparent; white-space:nowrap; flex-shrink:0; }
        .planet-tab:hover { color:var(--gold); }
        .planet-tab.active { color:#000; background:var(--gold); border-bottom-color:var(--gold); }

        /* ── MAP PANEL (collapsible) ───────────────────────────────────────── */
        #map-panel { overflow:hidden; transition:max-height 0.35s ease; max-height:700px; display:flex; flex-direction:column; }
        #map-panel.collapsed { max-height:0; }

        /* ── MAP STATUS BAR ────────────────────────────────────────────────── */
        .map-status-bar { display:flex; align-items:center; gap:16px; padding:6px 20px; background:rgba(0,0,0,0.6); border-bottom:1px solid rgba(232,160,32,0.1); font-family:'Courier New',monospace; font-size:0.78em; min-width:1260px; flex-shrink:0; }
        #coord-display { color:var(--gold); letter-spacing:1px; min-width:130px; }
        #active-planet-label { color:#a09060; letter-spacing:2px; }
        #portal-hint { color:#607080; font-size:0.9em; margin-left:auto; }

        /* ── RULER LAYOUT (exact from alemap.html) ─────────────────────────── */
        .map-scroll { overflow-x:auto; overflow-y:hidden; flex:1; min-height:0; }
        .map-ruler-outer { display:flex; flex-direction:row; min-width:1260px; }
        .ruler-y { width:28px; padding-top:22px; display:flex; flex-direction:column; flex-shrink:0; background:rgba(0,0,0,0.35); border-right:1px solid rgba(232,160,32,0.08); }
        .ruler-y .ruler-cell { height:30px; display:flex; align-items:center; justify-content:flex-end; padding-right:4px; font-size:8px; font-family:'Courier New',monospace; color:#3a5060; flex-shrink:0; line-height:1; }
        .ruler-y .ruler-cell.marker { color:#607880; }
        .map-right-col { display:flex; flex-direction:column; }
        .ruler-x { display:flex; flex-direction:row; height:22px; background:rgba(0,0,0,0.35); border-bottom:1px solid rgba(232,160,32,0.08); }
        .ruler-x .ruler-cell { width:30px; height:22px; display:flex; align-items:center; justify-content:center; font-size:8px; font-family:'Courier New',monospace; color:#3a5060; flex-shrink:0; line-height:1; }
        .ruler-x .ruler-cell.marker { color:#607880; }
        .maps-stack { width:1200px; position:relative; }

        /* ── PLANET MAP GRID (exact from alemap.html) ──────────────────────── */
        .ale-map { display:none; width:1200px; height:600px; background-size:cover; background-position:center; }
        .ale-map.active-map { display:grid; grid-template-columns:repeat(40,30px); grid-template-rows:repeat(20,30px); }
        .ale-cell { width:30px; height:30px; border:1px solid rgba(255,255,255,0.06); cursor:crosshair !important; transition:background 0.08s,border-color 0.08s; position:relative; }
        .ale-cell:hover { background:rgba(232,160,32,0.18); border-color:rgba(232,160,32,0.5); z-index:2; }
        .ale-cell.selected { background:rgba(232,160,32,0.15) !important; border-color:var(--gold) !important; box-shadow:inset 0 0 8px rgba(232,160,32,0.35); z-index:3; }
        .ale-portal { border-width:1px; }
        .ale-me { background:rgba(232,160,32,0.15) !important; border-color:var(--gold) !important; z-index:4; }
        .ale-me::after { content:'📍'; position:absolute; top:50%; left:50%; transform:translate(-50%,-52%); font-size:15px; pointer-events:none; z-index:5; filter:drop-shadow(0 0 4px rgba(232,160,32,0.8)); }
        .cell-icon { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:none; display:flex; align-items:center; justify-content:center; width:32px; height:32px; z-index:2; }
        .cell-icon img { width:32px; height:32px; opacity:0.95; filter:drop-shadow(0 0 3px rgba(0,0,0,0.9)); }
        .cell-icon img.icon-portal { width:42px; height:42px; }

        /* ── CONFIRM STRIP (exact from alemap.html) ─────────────────────────── */
        .confirm-strip { min-width:1260px; background:rgba(4,8,20,0.96); border-top:1px solid rgba(232,160,32,0.4); padding:10px 20px; display:none; align-items:center; gap:12px; flex-wrap:wrap; flex-shrink:0; }
        .confirm-strip.open { display:flex; }
        #confirm-content { font-family:'Courier New',monospace; font-size:0.88em; color:#c8c0a0; flex:1; }
        #confirm-content strong { color:var(--gold); }
        .conf-btn { background:transparent; border:1px solid; padding:7px 18px; font-family:'Courier New',monospace; font-weight:bold; font-size:0.8em; letter-spacing:1px; cursor:crosshair; transition:all 0.2s; border-radius:2px; }
        .conf-btn.confirm  { color:var(--gold); border-color:var(--gold); }
        .conf-btn.confirm:hover  { background:var(--gold); color:#000; }
        .conf-btn.view-map { color:#5090e0; border-color:#5090e0; }
        .conf-btn.view-map:hover { background:#5090e0; color:#000; }
        .conf-btn.cancel   { color:#666; border-color:#444; }
        .conf-btn.cancel:hover   { color:#ccc; border-color:#888; }
        #strip-status { font-family:'Courier New',monospace; font-size:0.82em; }
        #strip-status.ok  { color:#40c070; }
        #strip-status.err { color:#c04040; }

        /* ── SCROLLBAR ─────────────────────────────────────────────────────── */
        ::-webkit-scrollbar { height:6px; width:6px; }
        ::-webkit-scrollbar-track { background:rgba(0,0,0,0.4); }
        ::-webkit-scrollbar-thumb { background:#1a2030; border:1px solid rgba(232,160,32,0.2); }
    </style>
</head>
<body>

<canvas id="stars-canvas"></canvas>
<canvas id="planet-webgl"></canvas>

<header class="page-header">
    <div class="ph-logo"><a href="index.html">NARON CODEX</a></div>
    <div class="ph-right"><img src="ALElogo.png" alt="Alien Legends"></div>
</header>

<!-- LOGIN GATE -->
<div id="login-gate">
    <div class="gate-box">
        <div class="gate-logo"><img src="ALElogo.png" alt="Alien Legends"></div>
        <p class="gate-title">ALE STAR CHART</p>
        <p class="gate-sub">AUTHENTICATE TO ACCESS NAVIGATION SYSTEMS</p>
        <button class="gate-btn" onclick="loginAnchor()">[ &#9875; ANCHOR WALLET ]</button>
        <button class="gate-btn" onclick="loginWCC()">[ &#9729; CLOUD WALLET ]</button>
        <div id="gate-status"></div>
    </div>
</div>

<!-- ARRIVAL BANNER -->
<div id="arrival-banner">
    <div id="arrival-planet-name"></div>
    <div id="arrival-sub"></div>
    <div id="arrival-status"></div>
</div>

<!-- EASTER EGG -->
<div id="egg-msg"></div>

<!-- SKIP WARP -->
<button id="skip-btn" onclick="skipWarp()">&#9654;&#9654; SKIP</button>

<!-- MAP OVERLAY: centered floating panel -->
<div id="map-overlay" class="gone">
<div id="map-box">

    <div id="minimize-btn" onclick="togglePanel()">&#8213; MINIMIZE MAP &#8213;</div>

    <div id="planet-tabs">
        <button class="planet-tab active" data-planet="magor"  onclick="switchPlanet('magor')">MAGOR</button>
        <button class="planet-tab"        data-planet="naron"  onclick="switchPlanet('naron')">NARON</button>
        <button class="planet-tab"        data-planet="eyeke"  onclick="switchPlanet('eyeke')">EYEKE</button>
        <button class="planet-tab"        data-planet="kavian" onclick="switchPlanet('kavian')">KAVIAN</button>
        <button class="planet-tab"        data-planet="neri"   onclick="switchPlanet('neri')">NERI</button>
        <button class="planet-tab"        data-planet="veles"  onclick="switchPlanet('veles')">VELES</button>
    </div>

    <div id="map-panel">

        <div class="map-status-bar">
            <span id="coord-display">X:&#8212; &nbsp;Y:&#8212;</span>
            <span id="active-planet-label">MAGOR</span>
            <span id="portal-hint" style="margin-left:auto"></span>
        </div>

        <div class="map-scroll">
            <div class="map-ruler-outer">
                <div class="ruler-y" id="ruler-y"></div>
                <div class="map-right-col">
                    <div class="ruler-x" id="ruler-x"></div>
                    <div class="maps-stack">
                        <div id="map-magor"  class="ale-map active-map" style="background-image:url('planets/magor.jpg')"></div>
                        <div id="map-naron"  class="ale-map"            style="background-image:url('planets/naron.jpg')"></div>
                        <div id="map-eyeke"  class="ale-map"            style="background-image:url('planets/eyeke.jpg')"></div>
                        <div id="map-kavian" class="ale-map"            style="background-image:url('planets/kavian.jpg')"></div>
                        <div id="map-neri"   class="ale-map"            style="background-image:url('planets/neri.jpg')"></div>
                        <div id="map-veles"  class="ale-map"            style="background-image:url('planets/veles.jpg')"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="confirm-strip" id="confirm-strip">
            <div id="confirm-content"></div>
            <button id="confirm-travel-btn" class="conf-btn confirm"  onclick="doConfirm()"    style="display:none;">CONFIRM TRAVEL</button>
            <button id="view-map-btn"        class="conf-btn view-map" onclick="doViewPlanet()" style="display:none;">VIEW MAP</button>
            <span id="strip-status"></span>
            <button class="conf-btn cancel" onclick="dismissStrip()">&#10005;</button>
        </div>

    </div>
</div>
</div>

<script>
    // ── WAX ───────────────────────────────────────────────────────────────────
    var wax = new waxjs.WaxJS({ rpcEndpoint:'https://wax.greymass.com', userAccount:'', tryAutoLogin:false });
    var RPC = ['https://wax.greymass.com','https://api.waxsweden.org','https://wax.eosphere.io','https://wax.eosnation.io'];

    async function fetchRows(p) {
        for (var i=0;i<RPC.length;i++){
            try {
                var r=await fetch(RPC[i]+'/v1/chain/get_table_rows',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});
                if (!r.ok) continue;
                var j=await r.json();
                if (j.rows!==undefined) return j;
            } catch(e){continue;}
        }
        return null;
    }

    function getWallet() {
        if (window.walletSession) return String(window.walletSession.actor);
        if (wax && wax.userAccount) return wax.userAccount;
        return localStorage.getItem('naron_wallet')||null;
    }

    async function signTravel(wallet,x,y) {
        var actions=[{account:'players.ale',name:'travel',authorization:[{actor:wallet,permission:'active'}],data:{wallet:wallet,x:x,y:y}}];
        if (window.walletSession) return await window.walletSession.transact({actions});
        if (wax && wax.api) return await wax.api.transact({actions},{blocksBehind:3,expireSeconds:30});
        throw new Error('No wallet session — please log in.');
    }

    // ── LOGIN GATE ────────────────────────────────────────────────────────────
    function gateStatus(msg){ document.getElementById('gate-status').textContent=msg; }
    function showLoginGate(){ document.getElementById('login-gate').classList.remove('gone'); gateStatus('SESSION EXPIRED — PLEASE LOG IN AGAIN'); }

    async function loginAnchor() {
        gateStatus('CONNECTING TO ANCHOR...');
        try {
            var r=await window.walletKit.login();
            window.walletSession=r.session;
            localStorage.setItem('naron_wallet',String(r.session.actor));
            onWalletReady();
        } catch(e){ gateStatus('FAILED — '+(e&&e.message||String(e))); }
    }
    async function loginWCC() {
        gateStatus('CONNECTING TO CLOUD WALLET...');
        try {
            var acc=await wax.login();
            localStorage.setItem('naron_wallet',acc);
            onWalletReady();
        } catch(e){ gateStatus('FAILED — '+(e&&e.message||String(e))); }
    }
    function onWalletReady() {
        document.getElementById('login-gate').classList.add('gone');
        startScene();
    }

    // ── CONSTANTS ─────────────────────────────────────────────────────────────
    var BASE_SPEED      = 0.003;
    var BOOST_PER_CLICK = 10;
    var MAX_MULTIPLIER  = 10000;

    var PLANETS = {
        magor:  {name:'Magor',  color:'#e05030'},
        naron:  {name:'Naron',  color:'#30a060'},
        eyeke:  {name:'Eyeke',  color:'#5090e0'},
        kavian: {name:'Kavian', color:'#c060d0'},
        neri:   {name:'Neri',   color:'#e0b030'},
        veles:  {name:'Veles',  color:'#40c0c0'},
    };

    var CAM_OFFSETS = {
        eyeke:{x:1.1,y:-0.5}, kavian:{x:-1.3,y:0.2}, magor:{x:0.2,y:0.8},
        naron:{x:0.6,y:-0.25}, neri:{x:-0.7,y:-0.6}, veles:{x:1.4,y:0.4}
    };

    var ALE_PORTALS = {
        magor:  [{x:2,y:2,to:'naron'},{x:3,y:18,to:'kavian'},{x:2,y:19,to:'eyeke'},{x:38,y:3,to:'neri'},{x:37,y:18,to:'veles'}],
        naron:  [{x:3,y:2,to:'magor'},{x:2,y:20,to:'neri'},{x:39,y:2,to:'veles'},{x:38,y:3,to:'eyeke'},{x:37,y:18,to:'kavian'}],
        eyeke:  [{x:3,y:2,to:'veles'},{x:2,y:4,to:'neri'},{x:38,y:2,to:'naron'},{x:3,y:19,to:'magor'},{x:37,y:19,to:'kavian'}],
        kavian: [{x:3,y:2,to:'neri'},{x:2,y:20,to:'magor'},{x:38,y:3,to:'veles'},{x:36,y:18,to:'eyeke'},{x:35,y:19,to:'naron'}],
        neri:   [{x:2,y:2,to:'kavian'},{x:3,y:3,to:'eyeke'},{x:2,y:19,to:'veles'},{x:3,y:18,to:'naron'},{x:38,y:2,to:'magor'}],
        veles:  [{x:2,y:2,to:'eyeke'},{x:3,y:19,to:'neri'},{x:38,y:2,to:'kavian'},{x:36,y:19,to:'magor'},{x:39,y:4,to:'naron'}],
    };

    // ── STATE ─────────────────────────────────────────────────────────────────
    var _planetVisible = false;
    var _activePlanet  = 'magor';
    var _playerPos     = null;
    var _panelOpen     = true;
    var _skipReq       = false;
    var _renderer      = null;
    var _scene         = null;
    var _camera        = null;
    var _mesh          = null;
    var _eggCount      = 0;
    var _rendered      = {};
    var _sel           = null;
    var _arrTimer      = null;

    // ── STARS ─────────────────────────────────────────────────────────────────
    var _starSpeed = 5;

    function initStars() {
        var canvas=document.getElementById('stars-canvas');
        if (!canvas) return;
        var ctx=canvas.getContext('2d'), W, H, cx, cy;
        function resize(){ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; cx=W/2; cy=H/2; }
        resize();
        window.addEventListener('resize',resize);
        var stars=[];
        for (var i=0;i<160;i++) stars.push({x:(Math.random()-0.5)*W,y:(Math.random()-0.5)*H,z:Math.random()*W});
        function draw() {
            ctx.fillStyle='rgba(3,3,14,0.2)';
            ctx.fillRect(0,0,W,H);
            for (var i=0;i<stars.length;i++){
                var s=stars[i],pz=s.z;
                s.z-=_starSpeed;
                if(s.z<=0){s.x=(Math.random()-0.5)*W;s.y=(Math.random()-0.5)*H;s.z=W;pz=s.z;}
                var sx=(s.x/s.z)*W+cx,sy=(s.y/s.z)*H+cy;
                var px=(s.x/pz)*W+cx,py=(s.y/pz)*H+cy;
                var b=1-s.z/W,sz=Math.max(0.5,b*2.5);
                ctx.strokeStyle='rgba(180,255,235,'+b.toFixed(2)+')';
                ctx.lineWidth=sz;
                ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(sx,sy);ctx.stroke();
            }
            if (_planetVisible&&_renderer){
                var pw=document.getElementById('planet-webgl');
                if(pw) ctx.drawImage(pw,0,0,W,H);
            }
            requestAnimationFrame(draw);
        }
        draw();
    }

    function rampStars(target,ms,cb) {
        var start=_starSpeed,t0=performance.now();
        (function step(now){
            var t=Math.min(1,(now-t0)/ms);
            _starSpeed=start+(target-start)*(1-Math.pow(1-t,3));
            if(t<1) requestAnimationFrame(step);
            else{_starSpeed=target;if(cb)cb();}
        })(performance.now());
    }

    // ── PLANET 3D ─────────────────────────────────────────────────────────────
    function initPlanetRenderer() {
        if (_renderer) return;
        var canvas=document.getElementById('planet-webgl');
        var W=window.innerWidth,H=window.innerHeight;
        _renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true,preserveDrawingBuffer:true});
        _renderer.setClearColor(0x000000,0);
        _renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
        _renderer.setSize(W,H);
        _scene=new THREE.Scene();
        _camera=new THREE.PerspectiveCamera(55,W/H,0.1,500);
        _scene.add(new THREE.AmbientLight(0xffffff,0.55));
        var sun=new THREE.DirectionalLight(0xfff5e0,2.8);sun.position.set(6,4,10);_scene.add(sun);
        var rim=new THREE.DirectionalLight(0xffffff,0.3);rim.position.set(-4,-2,-5);_scene.add(rim);
        window.addEventListener('resize',function(){
            W=window.innerWidth;H=window.innerHeight;
            _renderer.setSize(W,H);_camera.aspect=W/H;_camera.updateProjectionMatrix();
        });
        (function frame(){
            requestAnimationFrame(frame);
            if(_mesh){
                var spd=_mesh.userData.speedMultiplier||1;
                _mesh.rotation.y+=BASE_SPEED*spd;
                // Multiplicative decay: ~1 second from 11x back to ~1x
                if(spd>1) _mesh.userData.speedMultiplier=Math.max(1,spd*0.993);
            }
            _renderer.render(_scene,_camera);
        })();
    }

    function loadPlanetMesh(planetKey, doApproach) {
        initPlanetRenderer();
        _planetVisible=false; // hide until new texture is loaded (prevents ghost silhouette)
        if(_mesh){_scene.remove(_mesh);_mesh=null;}
        var off=CAM_OFFSETS[planetKey]||{x:0.6,y:-0.25};
        var tx=new THREE.TextureLoader().load('planets/'+planetKey+'.jpg', function(){
            _planetVisible=true; // reveal only when texture is ready
        });
        tx.minFilter=THREE.LinearFilter;tx.generateMipmaps=false;
        _mesh=new THREE.Mesh(
            new THREE.SphereGeometry(2.2,64,64),
            new THREE.MeshStandardMaterial({map:tx,roughness:0.75,metalness:0.05})
        );
        _mesh.userData.speedMultiplier=1;
        _mesh.userData.clickCount=0;
        _scene.add(_mesh);
        if(doApproach){
            _camera.position.set(off.x,off.y,22);
            _camera.lookAt(0,0,0);
            var t0=null;
            (function approach(ts){
                if(_skipReq){_camera.position.z=4.5;return;}
                if(!t0)t0=ts;
                var t=Math.min(1,(ts-t0)/1800);
                var ease=t<0.65?Math.pow(t/0.65,2)*0.65:0.65+0.35*(1-Math.pow(1-(t-0.65)/0.35,5));
                _camera.position.z=22-ease*(22-4.5);
                if(t<1)requestAnimationFrame(approach);
            })(performance.now());
        } else {
            _camera.position.set(off.x,off.y,4.5);
            _camera.lookAt(0,0,0);
        }
    }

    // ── PLANET CLICK TO SPIN ──────────────────────────────────────────────────
    document.addEventListener('click',function(e){
        var overlay=document.getElementById('map-overlay');
        var gate=document.getElementById('login-gate');
        if(overlay&&!overlay.classList.contains('gone')&&overlay.contains(e.target))return;
        if(gate&&!gate.classList.contains('gone')&&gate.contains(e.target))return;

        if(_mesh&&_camera){
            var mouse=new THREE.Vector2();
            mouse.x=(e.clientX/window.innerWidth)*2-1;
            mouse.y=-(e.clientY/window.innerHeight)*2+1;
            var rc=new THREE.Raycaster();
            rc.setFromCamera(mouse,_camera);
            if(rc.intersectObject(_mesh).length>0){
                _mesh.userData.clickCount=(_mesh.userData.clickCount||0)+1;
                var boost=_mesh.userData.clickCount>8?50:BOOST_PER_CLICK;
                _mesh.userData.speedMultiplier=Math.min((_mesh.userData.speedMultiplier||1)+boost,MAX_MULTIPLIER);
                return;
            }
        }
        _eggCount++;
        if(_eggCount%5===0){
            var msgs=['SPACE IS BIG.','VERY BIG.','MIND-BOGGLINGLY BIG.','WHO ARE YOU?','◈ FOUND YOU','NICE CLICKS.','STOP THAT.','…OKAY KEEP GOING','MAGOR APPROVES','NARON WATCHING','YOU SPIN ME RIGHT ROUND','PLANET GO BRRR','◎ ◎ ◎','DO A BARREL ROLL','WARP CORES NOMINAL','LIFE DETECTED…','…OR IS IT?','GREETINGS, TRAVELLER'];
            var msg=msgs[Math.floor(Math.random()*msgs.length)];
            var el=document.getElementById('egg-msg');
            el.textContent=msg;el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');
        }
    });

    // ── SCENE STARTUP ─────────────────────────────────────────────────────────
    async function startScene() {
        var wallet=getWallet();
        if(!wallet)return;
        rampStars(22,900);
        document.getElementById('skip-btn').style.display='';
        var playerPlanet='magor';
        try {
            var res=await fetchRows({code:'players.ale',scope:'players.ale',table:'players',lower_bound:wallet,upper_bound:wallet,limit:1,json:true});
            if(res&&res.rows&&res.rows[0]&&res.rows[0].wallet===wallet){
                var row=res.rows[0];
                var pn=String(row.planet||'').toLowerCase().trim();
                if(PLANETS[pn])playerPlanet=pn;
                _playerPos={planet:playerPlanet,x:row.x||1,y:row.y||1};
            }
        }catch(e){}
        _activePlanet=playerPlanet;
        loadPlanetMesh(playerPlanet,true);
        setTimeout(function(){
            rampStars(0.35,1800,function(){
                if(!_skipReq){showArrival(playerPlanet);setTimeout(revealMap,800);}
            });
        },900);
    }

    function revealMap(){
        document.getElementById('skip-btn').style.display='none';
        document.getElementById('map-overlay').classList.remove('gone');
        buildRulers();
        buildMap(_activePlanet);
        setActiveTab(_activePlanet);
    }

    function skipWarp(){
        _skipReq=true;_starSpeed=0.35;
        if(_camera)_camera.position.z=4.5;
        document.getElementById('skip-btn').style.display='none';
        showArrival(_activePlanet);
        revealMap();
    }

    // ── ARRIVAL BANNER ────────────────────────────────────────────────────────
    function showArrival(planet){
        var p=PLANETS[planet]||{name:planet.toUpperCase()};
        document.getElementById('arrival-planet-name').textContent=p.name.toUpperCase();
        document.getElementById('arrival-sub').textContent='LANDING SEQUENCE COMPLETE · SURFACE ACCESSIBLE';
        document.getElementById('arrival-status').textContent='PORTALS DETECTED: '+(ALE_PORTALS[planet]||[]).length+' · ENGAGE TRAVEL SYSTEMS';
        var banner=document.getElementById('arrival-banner');
        banner.classList.add('visible');
        if(_arrTimer)clearTimeout(_arrTimer);
        _arrTimer=setTimeout(function(){banner.classList.remove('visible');},4200);
    }

    // ── PLANET WARP (tab switch) ───────────────────────────────────────────────
    function warpSwitch(planet,cb){
        rampStars(18,280,function(){
            loadPlanetMesh(planet,false);
            showArrival(planet);
            rampStars(0.35,520);
            if(cb)cb();
        });
    }

    // ── RULERS ────────────────────────────────────────────────────────────────
    var _rulersBuilt=false;
    function buildRulers(){
        if(_rulersBuilt)return;
        var xEl=document.getElementById('ruler-x');
        var yEl=document.getElementById('ruler-y');
        if(!xEl||!yEl)return;
        var xHtml='',yHtml='';
        for(var i=1;i<=40;i++){
            var cls=(i%5===0)?'ruler-cell marker':'ruler-cell';
            xHtml+='<div class="'+cls+'">'+i+'</div>';
        }
        for(var j=1;j<=20;j++){
            var cls2=(j%5===0)?'ruler-cell marker':'ruler-cell';
            yHtml+='<div class="'+cls2+'">'+j+'</div>';
        }
        xEl.innerHTML=xHtml;
        yEl.innerHTML=yHtml;
        _rulersBuilt=true;
    }

    // ── MAP GRID ──────────────────────────────────────────────────────────────
    function buildMap(planet){
        if(_rendered[planet]){applyMarker();return;}
        var container=document.getElementById('map-'+planet);
        if(!container)return;
        var portals=ALE_PORTALS[planet]||[],pmap={};
        portals.forEach(function(p){pmap[p.x+','+p.y]=p;});
        var html='';
        for(var y=1;y<=20;y++){
            for(var x=1;x<=40;x++){
                var key=x+','+y,portal=pmap[key];
                var cls='ale-cell',sty='',dataTo='',icon='';
                if(portal){
                    var c=PLANETS[portal.to].color;
                    cls+=' ale-portal';
                    sty=' style="border-color:'+c+'80;box-shadow:inset 0 0 6px '+c+'60;"';
                    dataTo=' data-to="'+portal.to+'"';
                    icon='<span class="cell-icon"><img src="Ale%20images/portal.png" alt="portal" class="icon-portal"></span>';
                }
                html+='<div class="'+cls+'" data-x="'+x+'" data-y="'+y+'"'+dataTo+sty
                    +' onmouseenter="onHov('+x+','+y+')" onmouseleave="onLeave()" onclick="onCell('+x+','+y+')">'
                    +icon+'</div>';
            }
        }
        container.innerHTML=html;
        _rendered[planet]=true;
        applyMarker();
    }

    function applyMarker(){
        document.querySelectorAll('.ale-me').forEach(function(el){el.classList.remove('ale-me');});
        if(!_playerPos)return;
        var c=document.getElementById('map-'+_playerPos.planet);
        if(!c)return;
        var cell=c.querySelector('[data-x="'+_playerPos.x+'"][data-y="'+_playerPos.y+'"]');
        if(cell)cell.classList.add('ale-me');
    }

    function setActiveTab(planet){
        document.querySelectorAll('.planet-tab').forEach(function(t){
            t.classList.toggle('active',t.dataset.planet===planet);
        });
        document.querySelectorAll('.ale-map').forEach(function(m){
            m.classList.toggle('active-map',m.id==='map-'+planet);
        });
        document.getElementById('active-planet-label').textContent=(PLANETS[planet]||{name:planet}).name.toUpperCase();
    }

    function switchPlanet(planet){
        if(planet===_activePlanet)return;
        // Update tab highlight immediately for feedback
        document.querySelectorAll('.planet-tab').forEach(function(t){
            t.classList.toggle('active',t.dataset.planet===planet);
        });
        _activePlanet=planet;
        dismissStrip();
        buildMap(planet);
        // Switch grid + 3D together after warp completes
        warpSwitch(planet,function(){
            setActiveTab(planet);
        });
    }

    // ── CELL INTERACTION ──────────────────────────────────────────────────────
    function onHov(x,y){
        document.getElementById('coord-display').textContent='X:'+x+'  Y:'+y;
    }
    function onLeave(){
        document.getElementById('coord-display').textContent='X:&#8212;  Y:&#8212;';
    }

    function onCell(x,y){
        var portals=ALE_PORTALS[_activePlanet]||[],portal=null;
        for(var i=0;i<portals.length;i++){if(portals[i].x===x&&portals[i].y===y){portal=portals[i];break;}}
        _sel={x:x,y:y,planet:_activePlanet,portal:portal};
        document.querySelectorAll('.ale-cell.selected').forEach(function(el){el.classList.remove('selected');});
        var container=document.getElementById('map-'+_activePlanet);
        if(container){var cell=container.querySelector('[data-x="'+x+'"][data-y="'+y+'"]');if(cell)cell.classList.add('selected');}
        var content=document.getElementById('confirm-content');
        var tBtn=document.getElementById('confirm-travel-btn');
        var vBtn=document.getElementById('view-map-btn');
        document.getElementById('strip-status').textContent='';
        document.getElementById('strip-status').className='';
        if(portal){
            var dest=(PLANETS[portal.to]||{name:portal.to.toUpperCase()}).name.toUpperCase();
            content.innerHTML='<strong>PORTAL</strong> → '+dest+' &nbsp;·&nbsp; ('+x+', '+y+')';
            tBtn.textContent='TRAVEL TO PORTAL'; tBtn.style.display='';
            vBtn.textContent='VIEW '+dest+' MAP'; vBtn.style.display='';
        } else {
            content.innerHTML='Travel to <strong>'+(PLANETS[_activePlanet]||{name:_activePlanet}).name+'</strong> ('+x+', '+y+')';
            tBtn.textContent='CONFIRM TRAVEL'; tBtn.style.display='';
            vBtn.style.display='none';
        }
        document.getElementById('confirm-strip').classList.add('open');
    }

    function dismissStrip(){
        document.getElementById('confirm-strip').classList.remove('open');
        document.querySelectorAll('.ale-cell.selected').forEach(function(el){el.classList.remove('selected');});
        _sel=null;
    }

    function doViewPlanet(){
        if(!_sel||!_sel.portal)return;
        switchPlanet(_sel.portal.to);
    }

    async function doConfirm(){
        if(!_sel)return;
        var wallet=getWallet();
        var btn=document.getElementById('confirm-travel-btn');
        var status=document.getElementById('strip-status');
        if(!wallet){status.textContent='⚠ PLEASE LOG IN FIRST';status.className='err';return;}
        btn.disabled=true;btn.textContent='TRANSMITTING…';
        status.textContent='';status.className='';
        try{
            await signTravel(wallet,_sel.x,_sel.y);
            status.textContent='✓ Travelled to ('+_sel.x+', '+_sel.y+')';
            status.className='ok';
            var destPlanet=_sel.portal?_sel.portal.to:_activePlanet;
            _playerPos={x:_sel.x,y:_sel.y,planet:destPlanet};
            applyMarker();
            if(_sel.portal){
                var to=_sel.portal.to;
                setTimeout(function(){switchPlanet(to);_playerPos={x:_sel.x,y:_sel.y,planet:to};applyMarker();},1400);
            }
            setTimeout(dismissStrip,3000);
        }catch(e){
            status.textContent='✗ '+((e&&e.message)||'Transaction failed').substring(0,100);
            status.className='err';
        }
        btn.disabled=false;
        btn.textContent=(_sel&&_sel.portal)?'TRAVEL TO PORTAL':'CONFIRM TRAVEL';
    }

    // ── PANEL TOGGLE ──────────────────────────────────────────────────────────
    function togglePanel(){
        _panelOpen=!_panelOpen;
        document.getElementById('map-panel').classList.toggle('collapsed',!_panelOpen);
        document.getElementById('minimize-btn').textContent=_panelOpen?'― MINIMIZE MAP ―':'+ OPEN MAP +';
    }

    // ── INIT ──────────────────────────────────────────────────────────────────
    initStars();
    if(localStorage.getItem('naron_wallet')) document.getElementById('login-gate').classList.add('gone');
</script>
