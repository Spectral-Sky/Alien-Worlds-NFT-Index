        /* ── LEGEND BAR (bottom) ─────────────────────────────────────────── */

        .legend-row { display:inline-flex; align-items:center; gap:5px; font-size:0.65em; color:#7888a0;

        /* ── ACTION PANEL (floating right side) ──────────────────────────── */

        .act-btn { display:block; width:100%; padding:6px 6px; font-size:0.7em; letter-spacing:0.5px; background:transparent; border:1px solid; cursor:crosshair; transition:all 0.2s; text-align:center; text-transform:uppercase; }

        /* ── QUICK TRAVEL TOGGLE ─────────────────────────────────────────── */

        /* ── QUEST OVERLAY ───────────────────────────────────────────────── */

        #qo-toggle { display:block; width:100%; padding:7px 12px; background:rgba(4,8,20,0.82); backdrop-filter:blur(6px); border:1px solid rgba(232,160,32,0.18); color:#557; font-size:0.64em; letter-spacing:2px; text-transform:uppercase; cursor:crosshair; text-align:left; transition:all 0.2s; }

        #qo-panel.open { display:block; }
        .qo-tabs { display:flex; border-bottom:1px solid rgba(232,160,32,0.1); }

        /* ── MAP FOOTER — slim buffer at bottom ──────────────────────────── */

        /* ── SCROLLBAR ───────────────────────────────────────────────────── */

        /* ── TAVERN SWEEP ────────────────────────────────────────────────── */

        #txq-run-btn { flex:1; padding:6px; background:rgba(192,144,96,0.1);

<script>
    // ── WAX ───────────────────────────────────────────────────────────────────
    var wax = new waxjs.WaxJS({ rpcEndpoint:'https://wax.greymass.com', userAccount:'', tryAutoLogin:false });
    var RPC = ['https://api.waxsweden.org','https://wax.eosphere.io','https://wax.eosnation.io'];

    async function fetchRows(p) {
        for (var i=0;i<RPC.length;i++){
            try {
                var ctrl=new AbortController();
                var tid=setTimeout(function(){ctrl.abort();},5000);
                var r=await fetch(RPC[i]+'/v1/chain/get_table_rows',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p),signal:ctrl.signal});
                clearTimeout(tid);
                if (!r.ok) continue;
                var j=await r.json();
                if (j.rows!==undefined) return j;
            } catch(e){continue;}
        }
        return null;
    }

    function getWallet() {
        if (window.walletSession) return String(window.walletSession.actor);
        if (wax && wax.userAccount) return wax.userAccount;
        return localStorage.getItem('naron_wallet')||null;
    }

    async function signTravel(wallet,x,y) {
        var actions=[{account:'players.ale',name:'travel',authorization:[{actor:wallet,permission:'active'}],data:{wallet:wallet,x:x,y:y}}];
        if (window.walletSession) return await window.walletSession.transact({actions});
        if (wax && wax.api) return await wax.api.transact({actions},{blocksBehind:3,expireSeconds:30});
        throw new Error('No wallet session — please log in.');
    }

    // ── LOGIN GATE ────────────────────────────────────────────────────────────
    function gateStatus(msg){ document.getElementById('gate-status').textContent=msg; }
    function showLoginGate(){ document.getElementById('login-gate').classList.remove('gone'); gateStatus('SESSION EXPIRED — PLEASE LOG IN AGAIN'); }

    async function loginAnchor() {
        gateStatus('CONNECTING TO ANCHOR...');
        try {
            var r=await window.walletKit.login();
            window.walletSession=r.session;
            localStorage.setItem('naron_wallet',String(r.session.actor));
            onWalletReady();
        } catch(e){ gateStatus('FAILED — '+(e&&e.message||String(e))); }
    }
    async function loginWCC() {
        gateStatus('CONNECTING TO CLOUD WALLET...');
        try {
            var acc=await wax.login();
            localStorage.setItem('naron_wallet',acc);
            onWalletReady();
        } catch(e){ gateStatus('FAILED — '+(e&&e.message||String(e))); }
    }
    var _sceneStarted = false;
    function onWalletReady() {
        document.getElementById('login-gate').classList.add('gone');
        updateWalletBtn();
        if (!_sceneStarted) { _sceneStarted = true; startScene(); }
    }
    function updateWalletBtn() {
        var btn = document.getElementById('ph-wallet-btn');
        if (!btn) return;
        var w = getWallet();
        if (w) { btn.textContent = w; btn.classList.add('connected'); btn.title = 'Click to disconnect'; }
        else   { btn.textContent = 'CONNECT'; btn.classList.remove('connected'); btn.title = ''; }
    }
    function phWalletClick() {
        var w = getWallet();
        if (w) {
            window.walletSession = null;
            localStorage.removeItem('naron_wallet');
            updateWalletBtn();
        } else {
            document.getElementById('login-gate').classList.remove('gone');
        }
    }

    // ── CONSTANTS ─────────────────────────────────────────────────────────────
    var BASE_SPEED      = 0.003;
    var BOOST_PER_CLICK = 10;
    var MAX_MULTIPLIER  = 10000;

    var FIGHTER_CLASSES = {
        'voidwarden':   {e:'🛡',  n:'Voidwarden'},
        'juggernaut':   {e:'💪',  n:'Juggernaut'},
        'lunatic':      {e:'🤪',  n:'Lunatic'},
        'arcanist':     {e:'✨',       n:'Arcanist'},
        'hunter':       {e:'🔫',  n:'Hunter'},
        'explosioneer': {e:'💣',  n:'Explosioneer'},
        'mindblade':    {e:'🧠',  n:'Mindblade'},
        'desperado':    {e:'🃏',  n:'Desperado'},
        'astralknight': {e:'🙏',  n:'Astral Knight'},
        'mystic':       {e:'🧙',  n:'Mystic'},
        'voidcaller':   {e:'🌀',  n:'Voidcaller'},
        'tactician':    {e:'🎯',  n:'Tactician'},
    };
    var FIGHTER_ELEMENTS = {
        'fire':'🔥', 'nature':'🌿', 'metal':'⚙️',
        'air':'💨',  'gem':'💎',    'neutral':'⬜',
    };

    var PLANETS = {
        magor:  {name:'Magor',  color:'#e05030'},
        naron:  {name:'Naron',  color:'#30a060'},
        eyeke:  {name:'Eyeke',  color:'#5090e0'},
        kavian: {name:'Kavian', color:'#c060d0'},
        neri:   {name:'Neri',   color:'#e0b030'},
        veles:  {name:'Veles',  color:'#40c0c0'},
    };

    var PLANET_ID_MAP = {
        0:'magor',1:'naron',2:'eyeke',3:'kavian',4:'neri',5:'veles',
        '0':'magor','1':'naron','2':'eyeke','3':'kavian','4':'neri','5':'veles',
    };

    function normalizePlanet(p) {
        if (p===null||p===undefined) return null;
        var s=String(p).toLowerCase().trim();
        if (PLANETS[s]) return s;
        if (PLANET_ID_MAP[s]) return PLANET_ID_MAP[s];
        var n=parseInt(s);
        if (!isNaN(n)&&n>=0&&n<=5) return ['magor','naron','eyeke','kavian','neri','veles'][n];
        return null;
    }

    var CAM_OFFSETS = {
        eyeke:{x:1.1,y:-0.5}, kavian:{x:-1.3,y:0.2}, magor:{x:0.2,y:0.8},
        naron:{x:0.6,y:-0.25}, neri:{x:-0.7,y:-0.6}, veles:{x:1.4,y:0.4}
    };

    var ALE_PORTALS = {
        magor:  [{x:2,y:2,to:'naron'},{x:3,y:18,to:'kavian'},{x:2,y:19,to:'eyeke'},{x:38,y:3,to:'neri'},{x:37,y:18,to:'veles'}],
        naron:  [{x:3,y:2,to:'magor'},{x:2,y:20,to:'neri'},{x:39,y:2,to:'veles'},{x:38,y:3,to:'eyeke'},{x:37,y:18,to:'kavian'}],
        eyeke:  [{x:3,y:2,to:'veles'},{x:2,y:4,to:'neri'},{x:38,y:2,to:'naron'},{x:3,y:19,to:'magor'},{x:37,y:19,to:'kavian'}],
        kavian: [{x:3,y:2,to:'neri'},{x:2,y:20,to:'magor'},{x:38,y:3,to:'veles'},{x:36,y:18,to:'eyeke'},{x:35,y:19,to:'naron'}],
        neri:   [{x:2,y:2,to:'kavian'},{x:3,y:3,to:'eyeke'},{x:2,y:19,to:'veles'},{x:3,y:18,to:'naron'},{x:38,y:2,to:'magor'}],
        veles:  [{x:2,y:2,to:'eyeke'},{x:3,y:19,to:'neri'},{x:38,y:2,to:'kavian'},{x:36,y:19,to:'magor'},{x:39,y:4,to:'naron'}],
    };

    // ── LOCATION DATA (fetched from chain on load) ────────────────────────────
    var ALE_LOCATIONS = {
        magor:  {dungeons:[],taverns:[],arenas:[]},
        naron:  {dungeons:[],taverns:[],arenas:[]},
        eyeke:  {dungeons:[],taverns:[],arenas:[]},
        kavian: {dungeons:[],taverns:[],arenas:[]},
        neri:   {dungeons:[],taverns:[],arenas:[]},
        veles:  {dungeons:[],taverns:[],arenas:[]},
    };

    function decodeLandId(id) {
        if (!id||typeof id!=='string') return null;
        var sep=id.indexOf('x');
        if (sep<1||sep>=id.length-1) return null;
        var dec=function(s){var n=0;for(var k=0;k<s.length;k++){var d=s.charCodeAt(k)-97;if(d<0||d>9)return NaN;n=n*10+d;}return n;};
        var cx=dec(id.slice(0,sep)),cy=dec(id.slice(sep+1));
        if (isNaN(cx)||isNaN(cy)||cx<1||cx>40||cy<1||cy>20) return null;
        return {x:cx,y:cy};
    }

    function _addDungeonCoord(planet,x,y,owner,land_id,boost) {
        if (!planet||!x||!y||!ALE_LOCATIONS[planet]) return false;
        var dup=ALE_LOCATIONS[planet].dungeons.some(function(d){return d.x===x&&d.y===y;});
        if (!dup){ALE_LOCATIONS[planet].dungeons.push({x:x,y:y,owner:owner||null,land_id:land_id||null,boost:boost||0});return true;}
        return false;
    }

    function _parseDungeonRow(row,defaultPlanet) {
        var x=row.x,y=row.y;
        if ((!x||!y)&&row.land_id){var c=decodeLandId(row.land_id);if(c){x=c.x;y=c.y;}}
        var planet=(row.planet!==undefined&&row.planet!==null)?normalizePlanet(row.planet):defaultPlanet;
        return _addDungeonCoord(planet,x,y,row.owner||row.account||null,row.land_id||null,row.boost||row.reward_boost||0);
    }

    function _refreshAllMaps() {
        var planets=Object.keys(_rendered);
        for (var i=0;i<planets.length;i++){
            if (_rendered[planets[i]]){
                _rendered[planets[i]]=false;
                if (planets[i]===_activePlanet) buildMap(planets[i]);
            }
        }
    }

    var _playerPlayedDungeons=new Set(); // "planet.land_id" strings beaten today
    var _playerUsedTaverns=new Set();   // "planet.land_id" hired this session
    (function(){
        var today=new Date().toISOString().slice(0,10);
        try{
            var saved=JSON.parse(localStorage.getItem('naron_used_taverns')||'{}');
            if(saved.date===today)(saved.keys||[]).forEach(function(k){_playerUsedTaverns.add(k);});
            else localStorage.removeItem('naron_used_taverns');
        }catch(e){}
    })();
    var _playerLockedArenas=new Set();   // "planet.x.y" arenas where player's fighter is defending
    var _arenaDefenderIds={};            // planet.x.y -> {fid, wallet} for all live arenas
    var _fighterCache={};               // assetId -> fighter row cache
    var _myFighters=[];                  // loaded from fighters.ale for logged-in wallet
    var _fighterSort='level';             // current sort: 'level'|'class'|'element'|'marker'

    var LOCKED_SVG='<svg width="18" height="19" viewBox="0 0 18 19" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 1C12.1919 1 14.7246 3.66329 14.7246 6.87988V7.50488C15.2323 7.63 15.705 7.85309 16.1035 8.26465C16.622 8.80012 16.8245 9.45859 16.915 10.1543C17.0022 10.8244 17 11.6684 17 12.6631C17 13.6576 17.0022 14.5009 16.915 15.1709C16.8245 15.8666 16.622 16.5251 16.1035 17.0605C15.5807 17.6004 14.9308 17.8155 14.2422 17.9111C13.5856 18.0023 12.7606 18 11.7998 18H6.2002C5.23941 18 4.4144 18.0023 3.75781 17.9111C3.06921 17.8155 2.41926 17.6004 1.89648 17.0605C1.37801 16.5251 1.17553 15.8666 1.08496 15.1709C0.997791 14.5009 0.999999 13.6576 1 12.6631C1 11.6684 0.997765 10.8244 1.08496 10.1543C1.17553 9.45859 1.37798 8.80012 1.89648 8.26465C2.29498 7.85309 2.76766 7.63 3.27539 7.50488V6.87988C3.27539 3.66329 5.80808 1 9 1ZM9 4.08398C7.55273 4.08398 6.3252 5.30557 6.3252 6.87988V7.3252H11.6748V6.87988C11.6748 5.30557 10.4473 4.08398 9 4.08398Z" fill="#FFB800" stroke="#1C274C" stroke-width="2"/></svg>';

    async function fetchPlayerTaverns(wallet){
        if(!wallet)return;
        try{
            var res=await fetchRows({code:'players.ale',scope:'players.ale',table:'players',lower_bound:wallet,upper_bound:wallet,limit:1,json:true});
            if(!res||!res.rows||!res.rows[0]||res.rows[0].wallet!==wallet)return;
            // Dungeons beaten today
            _playerPlayedDungeons=new Set(res.rows[0].played_dungeons||[]);
            // Build new tavern list atomically to avoid a gap where onCell sees empty taverns
            var newTaverns={};
            Object.keys(ALE_LOCATIONS).forEach(function(p){newTaverns[p]=[];});
            (res.rows[0].active_taverns||[]).forEach(function(t){
                var planet=normalizePlanet(t.planet);
                if(!planet||!ALE_LOCATIONS[planet])return;
                newTaverns[planet].push({x:t.x,y:t.y,objectives:t.objectives||[],land_id:t.land_id});
            });
            Object.keys(newTaverns).forEach(function(p){ALE_LOCATIONS[p].taverns=newTaverns[p];});
            _refreshAllMaps();
            updateTabCounts();
            checkAndOpenTavern();
        }catch(e){}
    }

    function checkAndOpenTavern(){
        if(!_playerPos)return;
        var locs=ALE_LOCATIONS[_playerPos.planet]||{};
        var tv=(locs.taverns||[]).find(function(t){return t.x===_playerPos.x&&t.y===_playerPos.y;});
        if(tv)onCell(_playerPos.x,_playerPos.y);
    }

    async function fetchArenaLock(wallet){
        if(!wallet)return;
        try{
            var res=await fetchRows({code:'arena.ale',scope:'arena.ale',table:'livearena',limit:1000,json:true});
            if(!res||!res.rows)return;
            _playerLockedArenas=new Set();
            res.rows.forEach(function(row){
                var def=row.defender||row.defender_wallet||row.owner||'';
                if(def!==wallet)return;
                var planet=row.planet?normalizePlanet(row.planet):null;
                var x=row.x,y=row.y;
                if((!x||!y)&&row.land_id){var c=decodeLandId(row.land_id);if(c){x=c.x;y=c.y;}}
                if(planet&&x&&y){
                var arKey=planet+'.'+x+'.'+y;
                var fid=row.fighter_id||row.fighter||row.defender_fighter||row.defender_id||row.asset_id||null;
                _arenaDefenderIds[arKey]={fid:fid,wallet:def};
                if(def===wallet)_playerLockedArenas.add(arKey);
            }
            });
            if(_playerLockedArenas.size>0)_refreshAllMaps();
        }catch(e){}
    }

    async function fetchAllDungeons() {
        var planetList=['magor','naron','eyeke','kavian','neri','veles'],added=0;
        try {
            var gd=await fetchRows({code:'dungeons.ale',scope:'dungeons.ale',table:'dungeons',limit:1000,json:true});
            if (gd&&gd.rows) {
                if(gd.rows.length>0) console.log('[dungeon row sample]',gd.rows[0]);
                gd.rows.forEach(function(r){if(_parseDungeonRow(r,null))added++;});
            }
        } catch(e){}

    async function fetchAllBuildings() {
        var planetList=['magor','naron','eyeke','kavian','neri','veles'],added=0;
        for (var pi=0;pi<planetList.length;pi++){
            var planet=planetList[pi],rows=[];
            for (var si=0;si<2;si++){
                try {
                    var d=await fetchRows({code:'lands.ale',scope:[planet,'lands.ale'][si],table:'lands',limit:1000,json:true});
                    if (d&&d.rows&&d.rows.length) rows=rows.concat(d.rows);
                } catch(e){}
            }
            rows.forEach(function(row){
                var x=row.x,y=row.y;
                if ((!x||!y)&&row.land_id){var c=decodeLandId(row.land_id);if(c){x=c.x;y=c.y;}}
                if (!x||!y) return;
                var rp=(row.planet!==undefined)?normalizePlanet(row.planet):planet;
                if (!rp||!ALE_LOCATIONS[rp]) return;
                var owner=row.owner||null;
                var buildings=row.buildings||row.building||[];
                if (!Array.isArray(buildings)) buildings=[buildings];
                var bStr=JSON.stringify(buildings).toLowerCase();
                if (bStr.indexOf('arena')>=0){
                    var dup2=ALE_LOCATIONS[rp].arenas.some(function(a){return a.x===x&&a.y===y;});
                    if (!dup2){ALE_LOCATIONS[rp].arenas.push({x:x,y:y,owner:owner});added++;}
                }
            });
        }
        if (added>0){ _refreshAllMaps(); updateTabCounts(); }
        return added;
    }

    function initStars() {
        var canvas=document.getElementById('stars-canvas');
        if (!canvas) return;
        var ctx=canvas.getContext('2d'),W,H,cx,cy;
        function resize(){ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; cx=W/2; cy=H/2; }
        resize();
        window.addEventListener('resize',resize);
        var stars=[];
        for (var i=0;i<160;i++) stars.push({x:(Math.random()-0.5)*W,y:(Math.random()-0.5)*H,z:Math.random()*W});
        function draw() {
            if(_bgFrozen) return; // loop stops; _starsRestartFn() resumes it
            ctx.fillStyle='rgba(3,3,14,0.2)';
            ctx.fillRect(0,0,W,H);
            for (var i=0;i<stars.length;i++){
                var s=stars[i],pz=s.z;
                s.z-=_starSpeed;
                if(s.z<=0){s.x=(Math.random()-0.5)*W;s.y=(Math.random()-0.5)*H;s.z=W;pz=s.z;}
                var sx=(s.x/s.z)*W+cx,sy=(s.y/s.z)*H+cy;
                var px=(s.x/pz)*W+cx,py=(s.y/pz)*H+cy;
                var b=1-s.z/W,sz=Math.max(0.5,b*2.5);
                ctx.strokeStyle='rgba(180,255,235,'+b.toFixed(2)+')';
                ctx.lineWidth=sz;
                ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(sx,sy);ctx.stroke();
            }
            requestAnimationFrame(draw);
        }
        _starsRestartFn = draw;
        draw();
    }

    function rampStars(target,ms,cb) {
        var start=_starSpeed,t0=performance.now();
        (function step(now){
            var t=Math.min(1,(now-t0)/ms);
            _starSpeed=start+(target-start)*(1-Math.pow(1-t,3));
            if(t<1) requestAnimationFrame(step);
            else{_starSpeed=target;if(cb)cb();}
        })(performance.now());
    }

    function _drawFallbackPlanet(planetKey) {
        var canvas = document.getElementById('planet-webgl');
        var ctx = canvas.getContext('2d');
        if (!ctx) return;
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
        var W = canvas.width, H = canvas.height;
        var cx = W/2, cy = H/2, r = Math.min(W,H)*0.22;
        function drawSphere(img) {
            ctx.clearRect(0,0,W,H);
            ctx.save();
            ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.clip();
            if (img) {
                ctx.drawImage(img, cx-r, cy-r, r*2, r*2);
            } else {
                var p = PLANETS[planetKey]||{color:'#5090e0'};
                var g = ctx.createRadialGradient(cx-r*0.35,cy-r*0.35,r*0.05,cx,cy,r);
                g.addColorStop(0,'rgba(255,255,255,0.55)'); g.addColorStop(0.3,p.color); g.addColorStop(1,'rgba(0,0,0,0.75)');
                ctx.fillStyle=g; ctx.fillRect(cx-r,cy-r,r*2,r*2);
            }
            ctx.restore();
            var shad = ctx.createRadialGradient(cx+r*0.3,cy-r*0.3,0,cx,cy,r);
            shad.addColorStop(0,'rgba(255,255,255,0.12)'); shad.addColorStop(0.5,'rgba(0,0,0,0)'); shad.addColorStop(1,'rgba(0,0,0,0.65)');
            ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle=shad; ctx.fill();
        }
        var img = new Image();
        img.onload = function(){ drawSphere(img); canvas.classList.add('visible'); };
        img.onerror = function(){ drawSphere(null); canvas.classList.add('visible'); };
        img.src = 'planets/'+planetKey+'.jpg';
    }

    function loadPlanetMesh(planetKey, doApproach) {
        initPlanetRenderer();
        if (_webglFailed) { _drawFallbackPlanet(planetKey); return; }
        setPlanetVisible(false); // hide until texture ready — prevents ghost
        if (_mesh){_scene.remove(_mesh);_mesh=null;}
        var off=CAM_OFFSETS[planetKey]||{x:0.6,y:-0.25};
        _mesh=new THREE.Mesh(
            new THREE.SphereGeometry(2.2,64,64),
            new THREE.MeshStandardMaterial({roughness:0.75,metalness:0.05})
        );
        _mesh.userData.speedMultiplier=1;
        _mesh.userData.clickCount=0;
        _mesh.position.x=0;
        _scene.add(_mesh);
        var tx=new THREE.TextureLoader().load('planets/'+planetKey+'.jpg',function(){
            if (_mesh) _mesh.material.map=tx;
            if (_mesh) _mesh.material.needsUpdate=true;
            setPlanetVisible(true);
        });
        tx.minFilter=THREE.LinearFilter;tx.generateMipmaps=false;
        if (doApproach){
            _camera.position.set(off.x,off.y,22);
            _camera.lookAt(0,0,0);
            var t0=null;
            (function approach(ts){
                if(_skipReq){_camera.position.z=4.5;return;}
                if(!t0)t0=ts;
                var t=Math.min(1,(ts-t0)/1800);
                var ease=t<0.65?Math.pow(t/0.65,2)*0.65:0.65+0.35*(1-Math.pow(1-(t-0.65)/0.35,5));
                _camera.position.z=22-ease*(22-4.5);
                if(t<1)requestAnimationFrame(approach);
            })(performance.now());
        } else {
            _camera.position.set(off.x,off.y,4.5);
            _camera.lookAt(0,0,0);
        }
    }

    // Called on tab switch: camera stays fixed, planet flies in from far ahead (warp arrival)
    function loadPlanetMeshWarpIn(planetKey) {
        initPlanetRenderer();
        if (_webglFailed) { _drawFallbackPlanet(planetKey); return; }
        setPlanetVisible(false);
        if (_mesh){_scene.remove(_mesh);_mesh=null;}
        var off=CAM_OFFSETS[planetKey]||{x:0.6,y:-0.25};
        _mesh=new THREE.Mesh(
            new THREE.SphereGeometry(2.2,64,64),
            new THREE.MeshStandardMaterial({roughness:0.75,metalness:0.05})
        );
        _mesh.userData.speedMultiplier=1;
        _mesh.userData.clickCount=0;
        _mesh.position.set(0,0,-22); // far ahead along camera's line of sight
        _scene.add(_mesh);
        // Camera stays at normal viewing distance — no camera movement needed
        _camera.position.set(off.x,off.y,4.5);
        _camera.lookAt(0,0,0);
        var tx=new THREE.TextureLoader().load('planets/'+planetKey+'.jpg',function(){
            if (!_mesh) return;
            _mesh.material.map=tx;
            _mesh.material.needsUpdate=true;
            setPlanetVisible(true);
            // Planet flies from z:-22 toward z:0 (camera is at z:4.5, planet rushes in)
            var t0=null,m=_mesh;
            (function flyIn(ts){
                if(!t0)t0=ts;
                var p=Math.min(1,(ts-t0)/820);
                var ease=1-Math.pow(1-p,2.5); // fast start, ease-out settle
                if(m) m.position.z=-22*(1-ease);
                if(p<1)requestAnimationFrame(flyIn);
                else if(m) m.position.z=0;
            })(performance.now());
        });
        tx.minFilter=THREE.LinearFilter;tx.generateMipmaps=false;
    }

    // ── PLANET WARP: pan right → warp punch → new planet zooms in ────────────
    function warpSwitch(planet,cb){
        // Capture the OLD mesh now — loadPlanetMeshWarpIn will replace _mesh at warp peak,
        // so the panOut closure must not reference the global _mesh.
        var outMesh=_mesh;
        if (outMesh){
            var startX=outMesh.position.x,t0=null;
            (function panOut(ts){
                if(!t0)t0=ts;
                var p=Math.min(1,(ts-t0)/360);
                outMesh.position.x=startX+p*p*15; // ease-in to the right
                if(p<1)requestAnimationFrame(panOut);
            })(performance.now());
        }
        // Stars spike hard (warp punch), then hold briefly before slowing as new planet arrives
        rampStars(38,260,function(){
            // At warp peak: drop old planet, load new one zooming in from far
            setPlanetVisible(false);
            loadPlanetMeshWarpIn(planet);
            showArrival(planet);
            // Stars ramp down over 900ms matching the camera zoom-in
            rampStars(0.35,900);
            if(cb)cb();
        });
    }

    function onHov(x,y,evt){
        document.getElementById('coord-display').textContent='X:'+x+'  Y:'+y;
        var tip=document.getElementById('cell-tip');
        if(!tip)return;
        var lines=['('+x+', '+y+')'];
        var portals=ALE_PORTALS[_activePlanet]||[];
        var portal=portals.find(function(p){return p.x===x&&p.y===y;});
        if(portal){
            var dest=(PLANETS[portal.to]||{name:portal.to}).name.toUpperCase();
            lines.push('PORTAL → '+dest);
        } else {
            var locs=ALE_LOCATIONS[_activePlanet]||{};
            var dg=(locs.dungeons||[]).find(function(d){return d.x===x&&d.y===y;});
            var tv=(locs.taverns||[]).find(function(t){return t.x===x&&t.y===y;});
            var ar=(locs.arenas||[]).some(function(a){return a.x===x&&a.y===y;});
            if(dg){
                var dgLk=dg.land_id&&_playerPlayedDungeons.has(_activePlanet+'.'+dg.land_id);
                var dgBoostTip=(dg.boost||0)>0?' · ⚡ +'+dg.boost+'%':'';
                lines.push('DUNGEON'+dgBoostTip+(dgLk?' · ✓ COMPLETED TODAY':''));
            } else if(tv){
                lines.push('TAVERN');
            } else if(ar){
                var arLk=_playerLockedArenas.has(_activePlanet+'.'+x+'.'+y);
                lines.push('ARENA'+(arLk?' · FIGHTER DEFENDING':''));
            }
        }
        if(_playerPos&&_playerPos.planet===_activePlanet&&_playerPos.x===x&&_playerPos.y===y){
            lines.push('YOUR POSITION');
        }
        tip.innerHTML=lines.join('<br>');
        tip.style.display='block';
        _tipMove(evt);
    }

    async function loadTavernData(){
        var _now=Date.now();
        if(_tavernTemplateMap&&_now-_tavernTemplateMapAge<300000)return; // 5-min cache
        var map={},lb='';
        while(true){
            var d=await fetchRows({code:'tavern.ale',scope:'tavern.ale',table:'nfttemplates',limit:500,lower_bound:lb||undefined,json:true});
            if(!d||!d.rows||!d.rows.length)break;
            d.rows.forEach(function(r){if(r.templateid!=null)map[String(r.templateid)]=r;});
            if(!d.more)break;
            lb=d.next_key||'';if(!lb)break;
        }
        _tavernTemplateMap=map;
        _tavernTemplateMapAge=Date.now();
    }

    // Returns true if a single objective matches a template row
    function _objMatch(tmplRow, obj){
        if(!tmplRow||!obj)return false;
        // Blank or '-' objective_type = wildcard (chain treats as always-covered)
        var type=String(obj.objective_type||'');
        if(!type||type==='-')return true;
        var s=String(obj.objective_string||'').toLowerCase();
        var v=obj.objective_value;
        function strEq(a){return String(a==null?'':a).toLowerCase()===s;}
        switch(type){
            case 'schema':   return strEq(tmplRow.schema);
            case 'rarity':   return strEq(tmplRow.rarity);
            case 'shine':    return strEq(tmplRow.shine)||strEq(tmplRow.element);
            case 'element':  return strEq(tmplRow.element)||strEq(tmplRow.shine);
            case 'race':     return strEq(tmplRow.race);
            case 'cardname': return strEq(tmplRow.cardname);
            case 'type':     return strEq(tmplRow.type);
            case 'atk':      return Number(tmplRow.atk)===Number(v);
            case 'def':      return Number(tmplRow.def)===Number(v);
            case 'pow':      return Number(tmplRow.pow)===Number(v);
            case 'movcost':  return Number(tmplRow.movcost)===Number(v);
            case 'tlm.mp':   return Number(tmplRow.tlm_mp)===Number(v);
            case 'nft.mp':   return Number(tmplRow.nft_mp)===Number(v);
        }
        // Unknown type: try matching any field by that name
        if(type&&tmplRow[type]!=null){
            return strEq(tmplRow[type]);
        }
        return false;
    }

    // Per-NFT potential reduction (for display label only — not used for the final cost)
    function calcHireMod(tmplRow, objectives){
        if(!objectives||!tmplRow)return 0;
        return objectives.reduce(function(t,obj){return t+(_objMatch(tmplRow,obj)?Number(obj.mod_value||0):0);},0);
    }

    // True cost reduction: each objective counts once if ANY selected template covers it
    function calcTotalReduction(checkedTids, objectives){
        if(!objectives||!checkedTids||!checkedTids.length)return 0;
        var tmpls=checkedTids.map(function(tid){return _tavernTemplateMap&&_tavernTemplateMap[tid];}).filter(Boolean);
        return objectives.reduce(function(t,obj){
            var covered=tmpls.some(function(tmpl){return _objMatch(tmpl,obj);});
            return t+(covered?Number(obj.mod_value||0):0);
        },0);
    }

    async function loadPlayerHireNFTs(wallet, objectives){
        await loadTavernData();
        var now=Date.now();
        var rawNFTs;
        if(_playerNFTCache && _playerNFTCacheWallet===wallet && now-_playerNFTCacheTime<_playerNFTCacheTTL){
            rawNFTs=_playerNFTCache;
        } else {
            // Fetch from AtomicAssets — store raw data without objectives-specific mod_value
            var schemas={};
            Object.values(_tavernTemplateMap).forEach(function(r){if(r.schema)schemas[r.schema]=true;});
            var schemaList=Object.keys(schemas);
            var fetched=[];
            for(var i=0;i<schemaList.length;i++){
                try{
                    for(var pg=1;pg<=2;pg++){
                        var url='https://wax.api.atomicassets.io/atomicassets/v1/assets'
                            +'?owner='+encodeURIComponent(wallet)
                            +'&collection_name=alien.worlds'
                            +'&schema_name='+encodeURIComponent(schemaList[i])
                            +'&limit=100&page='+pg;
                        var _ac=new AbortController();
                        var _at=setTimeout(function(){_ac.abort();},8000);
                        var r=await fetch(url,{signal:_ac.signal});
                        clearTimeout(_at);
                        var j=await r.json();
                        if(!j.success||!j.data||!j.data.length)break;
                        j.data.forEach(function(a){
                            var tid=String(a.template&&a.template.template_id);
                            var tmpl=_tavernTemplateMap[tid];
                            if(!tmpl)return;
                            if(!_templateImages[tid]){
                                var imgHash=(a.template&&a.template.immutable_data&&a.template.immutable_data.img)||
                                            (a.data&&a.data.img)||'';
                                if(imgHash)_templateImages[tid]='https://atomichub-ipfs.com/ipfs/'+imgHash;
                            }
                            fetched.push({
                                asset_id:a.asset_id, template_id:tid,
                                name:tmpl.cardname||a.name||('NFT #'+a.asset_id),
                                schema:tmpl.schema, rarity:tmpl.rarity||'', shine:tmpl.shine||''
                            });
                        });
                        if(j.data.length<100)break;
                    }
                }catch(e){}
            }
            // Dedup by template_id
            var seen={};
            rawNFTs=fetched.filter(function(n){
                if(seen[n.template_id])return false;
                seen[n.template_id]=true;
                return true;
            });
            _playerNFTCache=rawNFTs;
            _playerNFTCacheWallet=wallet;
            _playerNFTCacheTime=Date.now();
        }
        // Score for the requested objectives and sort
        var results=rawNFTs.map(function(n){
            return Object.assign({},n,{mod_value:calcHireMod(_tavernTemplateMap[n.template_id]||{},objectives)});
        });
        results.sort(function(a,b){return b.mod_value-a.mod_value;});
        return results;
    }

    function _hEsc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

    // Greedy optimal: pick up to 3 cards that together maximise calcTotalReduction
    function autoSelectOptimalNFTs(nfts, objectives){
        var selected=[], remaining=nfts.filter(function(n){return n.mod_value>0;});
        for(var i=0;i<3;i++){
            if(!remaining.length)break;
            var baseTids=selected.map(function(n){return n.template_id;});
            var baseR=calcTotalReduction(baseTids,objectives);
            var bestIdx=-1, bestR=baseR;
            for(var j=0;j<remaining.length;j++){
                var r=calcTotalReduction(baseTids.concat([remaining[j].template_id]),objectives);
                if(r>bestR){bestR=r;bestIdx=j;}
            }
            if(bestIdx<0)break;
            selected.push(remaining[bestIdx]);
            remaining.splice(bestIdx,1);
        }
        return selected.map(function(n){return n.template_id;});
    }

            var delta=q.task_end_value-q.task_start_value;

            var pct=delta>0?Math.min(1,gained/delta):0;
            var done=pct>=1;
            var bar=Math.round(pct*100);
            var reward=q.reward_type==='tlm'
                ?'<span class="qo-reward" style="color:#60c0e0;">'+(q.reward_amount/10000).toFixed(2)+' TLM</span>'

    function _fightersSorted() {
        var s = _myFighters.slice();
        if (_fighterSort==='level')   s.sort(function(a,b){return ((b.stats&&b.stats.level)||0)-((a.stats&&a.stats.level)||0);});
        if (_fighterSort==='class')   s.sort(function(a,b){return (a.classname||'').localeCompare(b.classname||'');});
        if (_fighterSort==='element') s.sort(function(a,b){return (a.element||'').localeCompare(b.element||'');});
        if (_fighterSort==='marker')  s.sort(function(a,b){return (a.marker||'').localeCompare(b.marker||'');});
        return s;
    }

    function _markerSym(m) {
        if(!m) return '';
        var lm=String(m).toLowerCase();
        // Color-prefix markers (gold-up, green-duble-up, etc.)
        if(lm.indexOf('gold')===0)  return '<span style="color:#d4a017">▲</span>';
        if(lm.indexOf('green')===0) return '<span style="color:#40c070">▲</span>';
        if(lm.indexOf('red')===0)   return '<span style="color:#e05050">▲</span>';
        if(lm.indexOf('blue')===0)  return '<span style="color:#5090e0">▲</span>';
        if(lm.indexOf('purple')===0)return '<span style="color:#9060d0">▲</span>';
        if(lm.indexOf('white')===0) return '<span style="color:#c0c0c0">▲</span>';
        // Stat-name markers
        var icons={'health':'<span style="color:#e06060">❤</span>',
                   'damage':'<span style="color:#e08040">⚔</span>',
                   'attackspeed':'<span style="color:#d4a017">⚡</span>',
                   'taunt':'<span style="color:#5090e0">🛡</span>',
                   'target':'<span style="color:#c060c0">🎯</span>',
                   'initiative':'<span style="color:#40c0c0">⚡</span>'};
        if(icons[lm]) return icons[lm];
        return '<span style="color:#446;font-size:0.55em">'+String(m).slice(0,3).toUpperCase()+'</span>';
    }

    async function loadMyFighters() {
        var wallet=getWallet();
        if(!wallet){showToast('⚠ PLEASE LOG IN');return;}
        var overlay=document.getElementById('fighters-overlay');
        if(!overlay)return;
        overlay.classList.add('open');
        var list=document.getElementById('fighters-list-inner');
        if(list) list.innerHTML='<div class="fp-loading">LOADING FIGHTERS…</div>';
        try {
            var res=await fetchRows({code:'fighters.ale',scope:wallet,table:'fighters',limit:500,json:true});
            var rows=res&&res.rows?res.rows:[];
            _myFighters=rows.filter(function(f){ return f.active===1||f.active==='1'; });
            _myFighters.forEach(function(f){
                var fid=String(f.fighter_id!=null?f.fighter_id:'');
                if(fid) _fighterCache[fid]=f;
            });
            console.log('[fighters] loaded',_myFighters.length,'active fighters for',wallet);
            renderFighterList();
        } catch(e){
            console.error('[fighters] load error:',e);
            if(list) list.innerHTML='<div class="fp-empty">ERROR: '+(e&&e.message||'Failed')+'</div>';
        }
    }
    function renderFighterList() {
        var list=document.getElementById('fighters-list-inner');
        var countEl=document.getElementById('fighters-count');
        if(!list) return;
        var sorted=_fightersSorted();
        if(countEl) countEl.textContent=sorted.length+' FIGHTERS';
        if(!sorted.length){list.innerHTML='<div class="fp-empty">NO FIGHTERS FOUND</div>';return;}
        var html='';
        sorted.forEach(function(f){
            var origIdx=_myFighters.indexOf(f);
            var cls=(f.classname||'').toLowerCase().replace(/[\s_-]/g,'');
            var ci=FIGHTER_CLASSES[cls]||{e:'⚔️',n:f.classname||'?'};
            var el=(f.element||'').toLowerCase();
            var ee=FIGHTER_ELEMENTS[el]||'';
            var race=f.racename||'';
            var lvl=(f.stats&&f.stats.level!=null)?f.stats.level:'?';
            var marker=f.marker||'';
            var msym=_markerSym(marker);
            var inUse=f.in_use===1||f.in_use==='1';
            html+='<div class="fp-row" onclick="showFighterSheet('+origIdx+')">'
                +'<span class="fp-marker">'+msym+'</span>'
                +'<span class="fp-class-e">'+ci.e+'</span>'
                +'<span class="fp-name">'+ci.n+'</span>'
                +'<span class="fp-race">'+race.toUpperCase()+'</span>'
                +'<span class="fp-el-e">'+ee+'</span>'
                +'<span class="fp-level">LV'+lvl+'</span>'
                +(inUse?'<span class="fp-in-use">DEPLOYED</span>':'')
                +'</div>';
        });
        list.innerHTML=html;
    }
    function showFighterSheet(origIdx) {
        var f=_myFighters[origIdx];
        if(!f) return;
        var list=document.getElementById('fighters-list-inner');
        if(!list) return;
        var cls=(f.classname||'').toLowerCase().replace(/[\s_-]/g,'');
        var ci=FIGHTER_CLASSES[cls]||{e:'⚔️',n:f.classname||'Fighter'};
        var el=(f.element||'').toLowerCase();
        var ee=FIGHTER_ELEMENTS[el]||'';
        var race=f.racename||'';
        var s=f.stats||{};
        var lvl=s.level!=null?s.level:'?';
        var marker=f.marker||'';
        var target=s.target||'';
        var inUse=f.in_use===1||f.in_use==='1';
        var statDefs=[
            {mn:'damage_min',     mx:'damage_max',      l:'DMG', col:'#60a860'},
            {mn:'health_min',     mx:'health_max',       l:'HP',  col:'#60a860'},
            {mn:'attackspeed_min',mx:'attackspeed_max',  l:'CD',  col:'#c07060'},
            {mn:'initiative_min', mx:'initiative_max',   l:'WU',  col:'#c07060'},
            {mn:'taunt_min',      mx:'taunt_max',        l:'TNT', col:'#a0b0c0'},
        ];
        var statsHtml='';
        statDefs.forEach(function(sd){
            var mn=s[sd.mn],mx=s[sd.mx];
            if(mn==null&&mx==null)return;
            statsHtml+='<div class="fp-sheet-stat">'
                +'<span class="fp-sheet-stat-lbl" style="color:'+sd.col+'">'+sd.l+'</span>'
                +'<span class="fp-sheet-stat-val">'+mn+' – '+mx+'</span>'
                +'</div>';
        });
        var expHtml='';
        if(s.experience!=null&&s.required_experience){
            var pct=Math.round(100*s.experience/s.required_experience);
            expHtml='<div class="fp-sheet-exp">XP: '+s.experience+' / '+s.required_experience
                +' <span class="fp-sheet-exp-bar"><span style="width:'+pct+'%"></span></span></div>';
        }
        var ablHtml='';
        if(s.abilities&&s.abilities.length){
            ablHtml='<div class="fp-sheet-abl-title">ABILITIES</div><div class="fp-sheet-abls">'
                +s.abilities.map(function(a){return '<span class="fp-sheet-abl">'+(a.displayname||a.name||'?')+'</span>';}).join('')
                +'</div>';
        }
        var html='<button class="fp-sheet-back" onclick="renderFighterList()">◂ BACK TO LIST</button>'
            +'<div class="fp-sheet-title">'+ci.e+' '+ci.n.toUpperCase()+'</div>'
            +'<div class="fp-sheet-sub">'+(ee?ee+' ':'')+el.toUpperCase()+(race?' · '+race.toUpperCase():'')+'</div>'
            +'<div class="fp-sheet-meta">LEVEL '+lvl+(inUse?' · <span class="fp-in-use">DEPLOYED</span>':'')
                +(marker?' · MARKER: '+_markerSym(marker):'')+'</div>'
            +expHtml
            +'<div class="fp-sheet-stats">'+statsHtml+'</div>'
            +(target?'<div class="fp-sheet-target">TARGET: '+target+'</div>':'')
            +ablHtml;
        list.innerHTML=html;
    }
    function setFighterSort(s) {
        _fighterSort=s;
        document.querySelectorAll('.fp-sort-btn').forEach(function(b){
            b.classList.toggle('active',b.dataset.sort===s);
        });
        renderFighterList();
    }

    function closeFightersPanel() {
        var overlay=document.getElementById('fighters-overlay');
        if(overlay) overlay.classList.remove('open');
    }

    // ── FIGHTER STAT PANE ─────────────────────────────────────────────────────

    async function fetchFighterData(assetId, wallet) {
        if (!assetId) return null;
        var key = String(assetId);
        if (_fighterCache[key]) return _fighterCache[key];
        var row = null;
        // Primary key lookup in global scope
        try {
            var r1 = await fetchRows({code:'fighters.ale',scope:'fighters.ale',table:'fighters',lower_bound:key,upper_bound:key,limit:1,json:true});
            if (r1 && r1.rows && r1.rows.length) row = r1.rows[0];
        } catch(e) {}
        // Fallback: wallet scope
        if (!row && wallet) {
            try {
                var r2 = await fetchRows({code:'fighters.ale',scope:wallet,table:'fighters',lower_bound:key,upper_bound:key,limit:1,json:true});
                if (r2 && r2.rows && r2.rows.length) row = r2.rows[0];
            } catch(e) {}
        }
        if (row) _fighterCache[key] = row;
        return row;
    }

    function _fspStat(data, key, icon, label) {
        var s = data.stats || {};
        var mn = s[key+'_min'], mx = s[key+'_max'];
        if (mn == null && mx == null) return '';
        return '<div class="fsp-stat">'
            + (icon ? '<img src="Ale%20images/'+icon+'" alt="">' : '')
            + '<span class="fsp-stat-lbl">'+label+'</span>'
            + '<span class="fsp-stat-val">'+mn+' – '+mx+'</span>'
            + '</div>';
    }
    function showStatPane(data, evt) {
        var pane = document.getElementById('fighter-stat-pane');
        if (!pane) return;
        var cls = String(data.classname||'').toLowerCase().replace(/[\s_-]/g,'');
        var clsInfo = FIGHTER_CLASSES[cls] || {e:'⚔️', n:(data.classname||'Fighter')};
        var elKey = String(data.element||'').toLowerCase();
        var elEmoji = FIGHTER_ELEMENTS[elKey] || '';
        var race = data.racename || '';
        var s = data.stats || {};
        var lvl = s.level != null ? s.level : '';
        var target = s.target || '';

        var html = '<div class="fsp-header">'+clsInfo.e+' '+clsInfo.n.toUpperCase()+'</div>';
        html += '<div class="fsp-sub">';
        if (elEmoji) html += elEmoji+' ';
        if (elKey) html += elKey.toUpperCase();
        if (race) html += ' · '+race.toUpperCase();
        if (lvl) html += ' · LV'+lvl;
        html += '</div>';
        html += _fspStat(data,'damage','damage.svg','DMG');
        html += _fspStat(data,'health','health.svg','HP');
        html += _fspStat(data,'attackspeed','cooldown.svg','CD');
        html += _fspStat(data,'initiative','windup.svg','WU');
        html += _fspStat(data,'taunt','taunt.svg','TNT');
        if (target) html += '<div class="fsp-target">TARGET: '+target+'</div>';
        pane.innerHTML = html;
        pane.style.display = 'block';
        _moveStatPane(evt);
    }
    function _moveStatPane(e) {
        if (!e) return;
        var pane = document.getElementById('fighter-stat-pane');
        if (!pane || pane.style.display === 'none') return;
        pane.style.left = (e.clientX + 16) + 'px';
        pane.style.top  = Math.max(10, e.clientY - 24) + 'px';
    }

    function hideStatPane() {
        var pane = document.getElementById('fighter-stat-pane');
        if (pane) pane.style.display = 'none';
    }

    async function fetchAndShowStatPane(assetId, wallet, evt) {
        var data = await fetchFighterData(assetId, wallet);
        if (data) showStatPane(data, evt);
    }

    initStars();
    updateWalletBtn();
    if(localStorage.getItem('naron_wallet')) {
        document.getElementById('login-gate').classList.add('gone');
        _sceneStarted = true;
        startScene();
    }
</script>

<script>
// ── ACTION QUEUE + KEYPAD UNLOCK ──────────────────────────────────────────────
var SWEEP_CODE      = '62766'; // NARON — unlocks queue panel AND auto-reroll
var _tabClickCount  = 0;
var _tabClickTimer  = null;
var _sweepUnlocked  = false;
var _sweepKpBuf     = '';

// Queue state (exposed on window so onCell can read them)
window._txQueue        = [];   // [{type,x,y,name,land_id}]
window._txQueueMode    = false; // when true, map clicks add to queue
window._txQPanelOpen   = false;
var _txQueueStacked    = true;  // true=STACKED (travel+hire in one TX); false=SPLIT (separate TXs)
var _txQueueRunning    = false;
var _txQueueAbort      = false;
var _pendingAutoRetry  = false;
var _failedPlan        = []; // plan steps that failed in last run, available for retry
var _arRunning  = {day:false, week:false, month:false};
var _arStop     = {day:false, week:false, month:false};

// Returns true if the WAX error looks like a hire cost mismatch
function _isCostMismatchError(e) {
    var msg = '';
    try {
        if (e && e.message) msg += e.message;
        if (e && e.toString) msg += e.toString();
        if (e && e.json) msg += JSON.stringify(e.json);
    } catch(_) {}
    msg = msg.toLowerCase();
    return msg.indexOf('cost') !== -1;
}

// Try to extract the required AP cost directly from the WAX contract error message
function _extractCostFromError(e) {
    var msg = '';
    try {
        if (e && e.message) msg += ' ' + e.message;
        if (e && e.toString) msg += ' ' + e.toString();
        if (e && e.json) msg += ' ' + JSON.stringify(e.json);
    } catch(_) {}
    var patterns = [
        /expected[:\s]+(\d+)/i,
        /required[:\s]+(\d+)/i,
        /cost[:\s]+(\d+)/i,
        /needs?\s+(\d+)/i,
        /(\d+)\s*(?:ap\b|action.?points)/i
    ];
    for (var i = 0; i < patterns.length; i++) {
        var m = msg.match(patterns[i]);
        if (m) { var v = parseInt(m[1], 10); if (v > 0 && v < 10000) return v; }
    }
    return null;
}

// Show the cost-correction input in the queue footer
function txqShowCostFix() {
    var el  = document.getElementById('txq-cost-fix');
    var inp = document.getElementById('txq-cost-input');
    if (!el) return;
    el.style.display = 'flex';
    if (inp) { inp.value = _hireBaseCost || 100; inp.focus(); inp.select(); }
}

// Apply the user-supplied cost, update _hireBaseCost, and trigger retry of failed steps
function txqApplyCostFix() {
    var inp = document.getElementById('txq-cost-input');
    var el  = document.getElementById('txq-cost-fix');
    if (!inp) return;
    var v = parseInt(inp.value, 10);
    if (isNaN(v) || v < 1) { inp.focus(); inp.select(); return; }
    _hireBaseCost = v;
    if (el) el.style.display = 'none';
    var progLbl = document.getElementById('txq-prog-lbl');
    if (progLbl) progLbl.textContent = 'Hire cost set to ' + v + ' AP — retrying failed steps…';
    txqRetryFailed();
}

// ── KEYPAD unlock trigger ────────────────────────────────────────────────────
function onPlanetTabClick(planet) {
    if (planet === _activePlanet) {
        _tabClickCount++;
        clearTimeout(_tabClickTimer);
        _tabClickTimer = setTimeout(function(){ _tabClickCount = 0; }, 1800);
        if (_tabClickCount >= 5) {
            _tabClickCount = 0;
            openSweepConsole();
        }
    } else {
        _tabClickCount = 0;
        switchPlanet(planet);
    }
}

function openSweepConsole() {
    if (_sweepUnlocked) { openTxQueuePanel(); return; }
    var el = document.getElementById('sweep-console');
    if (!el) return;
    el.style.display = 'flex';
    renderSweepLogin();
}

function closeSweepConsole() {
    var el = document.getElementById('sweep-console');
    if (el) el.style.display = 'none';
}

function renderSweepLogin() {
    _sweepKpBuf = '';
    document.getElementById('sweep-inner').innerHTML =
        '<div class="sw-title">⚡ ACTION QUEUE ACCESS</div>' +
        '<div id="sw-kp-display" class="sw-kp-display">_</div>' +
        '<div class="sw-kp-grid">' +
        [1,2,3,4,5,6,7,8,9].map(function(n){
            return '<button class="sw-kp-btn" onclick="swKp(\''+n+'\')">'+n+'</button>';
        }).join('') +
        '</div>' +
        '<div class="sw-kp-row">' +
        '<button class="sw-kp-btn" onclick="swKpClear()">CLR</button>' +
        '<button class="sw-kp-btn" onclick="swKp(\'0\')">0</button>' +
        '<button class="sw-kp-btn" onclick="swKpEnter()">OK</button>' +
        '</div>' +
        '<div id="sw-kp-status" class="sw-kp-status"></div>' +
        '<button class="sw-close-btn" onclick="closeSweepConsole()">CANCEL</button>';
}

function swKp(d) {
    if (_sweepKpBuf.length < 8) {
        _sweepKpBuf += d;
        var el = document.getElementById('sw-kp-display');
        if (el) el.textContent = '●'.repeat(_sweepKpBuf.length);
    }
}
function swKpClear() {
    _sweepKpBuf = '';
    var el = document.getElementById('sw-kp-display');
    if (el) el.textContent = '_';
}
function swKpEnter() {
    if (_sweepKpBuf === SWEEP_CODE) {
        _sweepUnlocked = true;
        var s = document.getElementById('sw-kp-status');
        if (s) { s.textContent = '✓ UNLOCKED'; s.style.color = '#60e090'; }
        setTimeout(function() {
            closeSweepConsole();
            openTxQueuePanel();
        }, 500);
    } else {
        var s = document.getElementById('sw-kp-status');
        if (s) { s.textContent = '✗ ACCESS DENIED'; s.style.color = '#ff4466'; }
        setTimeout(function() {
            _sweepKpBuf = '';
            var d = document.getElementById('sw-kp-display');
            if (d) d.textContent = '_';
            if (s) s.textContent = '';
        }, 900);
    }
}

// ── QUEUE PANEL ──────────────────────────────────────────────────────────────
function openTxQueuePanel() {
    window._txQPanelOpen = true;
    var panel = document.getElementById('txq-panel');
    if (panel) { panel.style.display = 'flex'; setTimeout(function(){ panel.classList.add('open'); }, 10); }
    renderTxQueue();
    // Also reveal auto-reroll panel (both unlocked by the same code)
    var ar = document.getElementById('ar-panel');
    if (ar && ar.style.display === 'none') { ar.style.display = ''; renderArSlots(); }
}

function openAutoRerollPanel() {
    if (!_sweepUnlocked) return;
    var qo = document.getElementById('quest-overlay');
    if (qo) qo.style.display = '';
    var qpanel = document.getElementById('qo-panel');
    if (qpanel) qpanel.classList.add('open');
    var btn = document.getElementById('qo-toggle');
    if (btn) { btn.classList.add('open'); btn.innerHTML = '&#x2B21; ACTIVE QUESTS &#9650;'; }
    var ar = document.getElementById('ar-panel');
    if (ar) { ar.style.display = ''; renderArSlots(); }
    if (!_qLoaded) loadQuestOverlay();
}

function closeTxQueuePanel() {
    window._txQueueMode = false;
    window._txQPanelOpen = false;
    if (_txQueueRunning) _txQueueAbort = true;
    var panel = document.getElementById('txq-panel');
    if (panel) {
        panel.classList.remove('open');
        setTimeout(function(){ panel.style.display = 'none'; }, 380);
    }
    var badge = document.getElementById('txq-mode-badge');
    if (badge) badge.style.display = 'none';
}

function setTxqRunMode(mode) {
    _txQueueStacked = (mode === 'stacked');
    document.getElementById('txq-mode-stk').classList.toggle('active', _txQueueStacked);
    document.getElementById('txq-mode-sep').classList.toggle('active', !_txQueueStacked);
    renderTxQueue();
}

function toggleTxQueueMode() {
    window._txQueueMode = !window._txQueueMode;
    var btn = document.getElementById('txq-qm-btn');
    if (btn) {
        btn.textContent = window._txQueueMode ? '◎ QUEUE MODE: ON' : '○ QUEUE MODE';
        btn.classList.toggle('active', window._txQueueMode);
    }
    var badge = document.getElementById('txq-mode-badge');
    if (badge) badge.style.display = window._txQueueMode ? 'block' : 'none';
}

// Called from onCell when queue mode is active
function txqAddCell(x, y) {
    var locs    = ALE_LOCATIONS[_activePlanet] || {};
    var portals = ALE_PORTALS[_activePlanet]   || [];
    var isPortal = portals.some(function(p){ return p.x===x && p.y===y; });
    var tavern   = (locs.taverns||[]).find(function(t){ return t.x===x && t.y===y; });
    if (isPortal) {
        _txQueue.push({ type:'portal', x:x, y:y, planet:_activePlanet });
    } else if (tavern) {
        _txQueue.push({ type:'travel+hire', x:x, y:y,
            name: tavern.name || ('Tavern '+x+','+y), land_id: tavern.land_id,
            objectives: tavern.objectives || [] });
    } else {
        _txQueue.push({ type:'travel', x:x, y:y });
    }
    renderTxQueue();
}
window.txqAddCell = txqAddCell;

async function txqAddAllTaverns() {
    var wallet = getWallet();
    var btn = document.querySelector('.txq-add-btn');
    if (btn) { btn.textContent = '…'; btn.disabled = true; }
    // Refresh from chain first — active_taverns changes after each hire
    if (wallet) { try { await fetchPlayerTaverns(wallet); } catch(e){} }
    if (btn) { btn.textContent = '+ ALL PLANETS'; btn.disabled = false; }

    // Use chain-queried ALE_LOCATIONS as the source of truth (no session filter)
    var byPlanet = {};
    Object.keys(ALE_LOCATIONS).forEach(function(planet) {
        var taverns = ALE_LOCATIONS[planet].taverns || [];
        if (taverns.length) byPlanet[planet] = taverns;
    });
    if (!Object.keys(byPlanet).length) return;

    // Current planet first, then the rest
    var order = [_activePlanet].concat(
        Object.keys(byPlanet).filter(function(p){ return p !== _activePlanet; })
    ).filter(function(p){ return byPlanet[p]; });

    var fromPlanet = _activePlanet;
    order.forEach(function(planet) {
        if (planet !== fromPlanet) {
            var portal = (ALE_PORTALS[fromPlanet]||[]).find(function(p){ return p.to === planet; });
            if (portal) {
                _txQueue.push({ type:'portal', x:portal.x, y:portal.y, planet:fromPlanet, to:planet });
            }
            fromPlanet = planet;
        }
        byPlanet[planet].forEach(function(tv) {
            _txQueue.push({ type:'travel+hire', x:tv.x, y:tv.y,
                name: tv.name || ('Tavern '+tv.x+','+tv.y),
                land_id: tv.land_id, objectives: tv.objectives||[] });
        });
    });
    renderTxQueue();
}

function txqCalcAP() {
    var simX = _playerPos ? _playerPos.x : 0, simY = _playerPos ? _playerPos.y : 0;
    var total = 0;
    _txQueue.forEach(function(item){
        if (item.type==='travel' || item.type==='travel+hire' || item.type==='portal') {
            total += 10 + Math.abs(item.x - simX) + Math.abs(item.y - simY);
            simX = item.x; simY = item.y;
        }
        if (item.type==='travel+hire' || item.type==='hire') {
            total += _hireBaseCost || 100;
        }
    });
    return total;
}

function renderTxQueue() {
    var list   = document.getElementById('txq-list');
    var apEl   = document.getElementById('txq-ap-total');
    var runBtn = document.getElementById('txq-run-btn');
    if (!list) return;

    var totalAP = txqCalcAP();
    if (apEl) {
        var haveAP = _playerAP !== null ? _playerAP : null;
        var apColor = haveAP === null ? '#c09060' : haveAP >= totalAP ? '#60e090' : '#ff7744';
        apEl.textContent = totalAP + ' AP';
        apEl.style.color = apColor;
    }

    if (!_txQueue.length) {
        list.innerHTML = '<div class="txq-empty">'
            + (window._txQueueMode ? 'Click cells on the map to add actions.' : 'Enable QUEUE MODE then click cells, or use + ALL TAVERNS.')
            + '</div>';
    } else {
        var simX = _playerPos ? _playerPos.x : 0, simY = _playerPos ? _playerPos.y : 0;
        var icons = { travel:'→', hire:'⊕', portal:'◈', 'travel+hire':'→⊕' };
        list.innerHTML = _txQueue.map(function(item, i){
            var ap = 0;
            if (item.type==='travel'||item.type==='travel+hire'||item.type==='portal') {
                ap += 10 + Math.abs(item.x - simX) + Math.abs(item.y - simY);
                simX = item.x; simY = item.y;
            }
            if (item.type==='travel+hire'||item.type==='hire') ap += _hireBaseCost||100;
            var label = item.type==='travel'      ? 'TRAVEL  ('+item.x+', '+item.y+')'
                      : item.type==='hire'        ? 'HIRE'
                      : item.type==='portal'      ? 'PORTAL  ('+item.x+', '+item.y+')'
                      : (item.name || 'TRAVEL + HIRE  ('+item.x+', '+item.y+')');
            return '<div class="txq-item" id="txq-item-'+i+'">'
                + '<span class="txq-item-icon">' + (icons[item.type]||'→') + '</span>'
                + '<span class="txq-item-label">' + label + '</span>'
                + '<span class="txq-item-ap">' + ap + ' AP</span>'
                + '<button class="txq-item-del" onclick="txqRemove('+i+')" title="Remove">×</button>'
                + '</div>';
        }).join('');
    }

    if (runBtn) runBtn.disabled = (!_txQueue.length || !getWallet() || _txQueueRunning);

    var btn = document.getElementById('txq-qm-btn');
    if (btn) {
        btn.textContent = window._txQueueMode ? '◎ QUEUE MODE: ON' : '○ QUEUE MODE';
        btn.classList.toggle('active', !!window._txQueueMode);
    }
}

// Re-score NFTs for a specific tavern's objectives and return optimal hire action data
function txqBestHire(wallet, allNFTs, objectives) {
    var objs = objectives || [];
    if (allNFTs && allNFTs.length && objs.length) {
        var scored = allNFTs.map(function(n) {
            var tmpl = (_tavernTemplateMap && _tavernTemplateMap[n.template_id]) || {};
            return { asset_id: n.asset_id, template_id: n.template_id,
                     mod_value: calcHireMod(tmpl, objs) };
        });
        var optTids  = autoSelectOptimalNFTs(scored, objs);
        var aids = [];
        optTids.forEach(function(tid){
            var nft = scored.find(function(n){ return n.template_id === tid; });
            if (nft) aids.push(nft.asset_id);
        });
        var reduction = calcTotalReduction(optTids, objs);
        return { wallet: wallet, asset_ids: aids,
                 cost_action_points: Math.max(1, (_hireBaseCost||100) - reduction) };
    }
    return { wallet: wallet, asset_ids: [], cost_action_points: _hireBaseCost || 100 };
}

async function runTxQueue() {
    var wallet = getWallet();
    if (!wallet || _txQueueRunning || !_txQueue.length) return;

    _txQueueRunning = true;
    _txQueueAbort   = false;
    _failedPlan     = []; // clear failures from previous run

    var runBtn   = document.getElementById('txq-run-btn');
    var closeBtn = document.getElementById('txq-close-btn');
    var progWrap = document.getElementById('txq-prog-wrap');
    var progFill = document.getElementById('txq-prog-fill');
    var progLbl  = document.getElementById('txq-prog-lbl');
    var rfBtn    = document.getElementById('txq-retry-failed-btn');

    if (runBtn)   { runBtn.disabled = true; runBtn.textContent = 'RUNNING…'; }
    if (closeBtn) { closeBtn.textContent = '■ ABORT'; closeBtn.style.color = '#ff6666'; }
    if (progWrap) { progWrap.style.display = 'block'; }
    if (progLbl)  { progLbl.textContent = 'Loading NFTs…'; }
    if (rfBtn)    { rfBtn.style.display = 'none'; }
    var cfEl = document.getElementById('txq-cost-fix');
    if (cfEl) cfEl.style.display = 'none';

    // Load player NFTs once; re-scored per tavern's objectives in txqBestHire
    var _allNFTs = [];
    try { _allNFTs = await loadPlayerHireNFTs(wallet, []); } catch(e) {}

    // Build execution plan.
    // Hire actions are always lazy (computed just before TX) so NFT exclusion and fresh
    // AP cost work correctly even across multiple taverns in the same run.
    // STACKED: travel+hire bundled in one TX (original fast mode).
    // SPLIT: travel then hire as separate TXs (safer, avoids hire-before-travel risk).
    var plan = [];
    var _usedHireNFTs = new Set();
    if (_txQueueStacked) {
        for (var i = 0; i < _txQueue.length; ) {
            var item = _txQueue[i];
            if (item.type === 'travel+hire') {
                plan.push({ label: item.name || 'TRAVEL+HIRE ('+item.x+','+item.y+')', qIdx: i,
                    tavern: item, isTravelAndHire: true,
                    objectives: item.objectives,
                    travelData: {wallet:wallet, x:item.x, y:item.y},
                    actions: null
                });
                i++;
            } else if (item.type === 'travel') {
                plan.push({ label: 'TRAVEL ('+item.x+','+item.y+')', qIdx: i,
                    actions: [{ account:'players.ale', name:'travel', authorization:[{actor:wallet,permission:'active'}], data:{wallet:wallet, x:item.x, y:item.y} }]
                });
                i++;
            } else if (item.type === 'hire') {
                plan.push({ label: 'HIRE', qIdx: i, tavern: item.tavern || null,
                    isHire: true, objectives: item.objectives, actions: null
                });
                i++;
            } else if (item.type === 'portal') {
                plan.push({ label: 'PORTAL ('+item.x+','+item.y+')', qIdx: i,
                    actions: [{ account:'players.ale', name:'travel', authorization:[{actor:wallet,permission:'active'}], data:{wallet:wallet, x:item.x, y:item.y} }]
                });
                i++;
            } else { i++; }
        }
    } else {
        _txQueue.forEach(function(item, i){
            if (item.type === 'travel' || item.type === 'portal') {
                plan.push({ label: 'TRAVEL ('+item.x+','+item.y+')', qIdx: i,
                    actions: [{ account:'players.ale', name:'travel', authorization:[{actor:wallet,permission:'active'}], data:{wallet:wallet, x:item.x, y:item.y} }]
                });
            } else if (item.type === 'travel+hire') {
                plan.push({ label: 'TRAVEL ('+item.x+','+item.y+')', qIdx: i,
                    actions: [{ account:'players.ale', name:'travel', authorization:[{actor:wallet,permission:'active'}], data:{wallet:wallet, x:item.x, y:item.y} }]
                });
                plan.push({ label: 'HIRE — '+(item.name||''), qIdx: i, tavern: item,
                    isHire: true, objectives: item.objectives, actions: null
                });
            } else if (item.type === 'hire') {
                plan.push({ label: 'HIRE', qIdx: i, tavern: item.tavern || null,
                    isHire: true, objectives: item.objectives, actions: null
                });
            }
        });
    }

    var succeeded = 0, failed = 0;
    for (var j = 0; j < plan.length; j++) {
        if (_txQueueAbort) break;
        var step = plan[j];
        var itemEl = document.getElementById('txq-item-' + step.qIdx);
        if (itemEl) itemEl.style.background = 'rgba(192,144,96,0.08)';
        if (progLbl)  progLbl.textContent  = (j+1) + ' / ' + plan.length + '  ·  ' + step.label;
        if (progFill) progFill.style.width = (j / plan.length * 100).toFixed(0) + '%';

        // Lazy hire: compute actions just before TX using only NFTs not yet deployed this run
        if (step.isTravelAndHire) {
            var _avail = _allNFTs.filter(function(n){ return !_usedHireNFTs.has(n.asset_id); });
            var _hd = txqBestHire(wallet, _avail, step.objectives);
            step.actions = [
                { account:'players.ale', name:'travel', authorization:[{actor:wallet,permission:'active'}], data: step.travelData },
                { account:'players.ale', name:'hire',   authorization:[{actor:wallet,permission:'active'}], data: _hd }
            ];
        } else if (step.isHire) {
            var _avail = _allNFTs.filter(function(n){ return !_usedHireNFTs.has(n.asset_id); });
            var _hd = txqBestHire(wallet, _avail, step.objectives);
            step.actions = [{ account:'players.ale', name:'hire',
                authorization:[{actor:wallet,permission:'active'}], data:_hd }];
        }

        try {
            if (window.walletSession) await window.walletSession.transact({actions: step.actions});
            else if (wax && wax.api)  await wax.api.transact({actions: step.actions},{blocksBehind:3,expireSeconds:30});
            else throw new Error('No wallet session');

            // Update player position after any travel action
            var travelAct = step.actions.find(function(a){ return a.name==='travel'; });
            if (travelAct) _playerPos = {planet:_activePlanet, x:travelAct.data.x, y:travelAct.data.y};

            // Track NFTs used in this hire so subsequent hires pick different ones
            if ((step.isHire || step.isTravelAndHire) && step.actions) {
                step.actions.forEach(function(a){
                    if (a.name === 'hire') (a.data.asset_ids || []).forEach(function(id){ _usedHireNFTs.add(id); });
                });
            }

            // Track used tavern
            var tav = step.tavern;
            if (tav && tav.land_id) {
                var key = _activePlanet + '.' + tav.land_id;
                _playerUsedTaverns.add(key);
                try {
                    var today = new Date().toISOString().slice(0,10);
                    localStorage.setItem('naron_used_taverns', JSON.stringify({date:today, keys:Array.from(_playerUsedTaverns)}));
                } catch(e){}
            }
            if (itemEl) {
                itemEl.style.background = 'rgba(96,224,144,0.06)';
                var lbl = itemEl.querySelector('.txq-item-label');
                if (lbl) lbl.style.color = '#60e090';
            }
            succeeded++;
        } catch(e) {
            console.error('Queue TX error (step '+j+'):', e);
            _failedPlan.push(step);
            if (itemEl) {
                itemEl.style.background = 'rgba(255,68,68,0.06)';
                var lbl = itemEl.querySelector('.txq-item-label');
                if (lbl) lbl.style.color = '#ff6688';
                // Inject per-item retry button
                if (!itemEl.querySelector('.txq-item-retry')) {
                    var retryBtn = document.createElement('button');
                    retryBtn.className = 'txq-item-retry';
                    retryBtn.textContent = '⟳';
                    retryBtn.title = 'Retry this step';
                    (function(s, rb) {
                        rb.onclick = function() { txqRetryStep(s, wallet, _allNFTs, rb); };
                    })(step, retryBtn);
                    var delBtn = itemEl.querySelector('.txq-item-del');
                    if (delBtn) itemEl.insertBefore(retryBtn, delBtn);
                    else itemEl.appendChild(retryBtn);
                }
            }
            failed++;
            // Cost mismatch — try to read the correct cost from the error, then auto-retry
            if (_isCostMismatchError(e) && (step.isHire || step.isTravelAndHire)) {
                _txQueueAbort = true;
                var _errCost = _extractCostFromError(e);
                if (_errCost) {
                    _hireBaseCost = _errCost;
                    _pendingAutoRetry = true;
                    if (progLbl) progLbl.textContent = '⚠ Cost corrected to ' + _errCost + ' AP — retrying…';
                } else {
                    if (progLbl) progLbl.textContent = '⚠ HIRE COST MISMATCH — enter correct AP below';
                    txqShowCostFix();
                }
            }
        }

        if (j < plan.length - 1 && !_txQueueAbort) {
            var _stepDelay = _txQueueStacked ? 1000 : 2000;
            await new Promise(function(r){ setTimeout(r, _stepDelay); });
        }
    }

    if (progFill) progFill.style.width = '100%';
    var _runSummary = _txQueueAbort
        ? '⚠ ABORTED  (' + succeeded + ' done)'
        : '✓ ' + succeeded + ' / ' + plan.length + (failed ? '  ·  ' + failed + ' FAILED' : '');
    if (progLbl)  progLbl.textContent = _runSummary + '  ·  refreshing…';
    if (runBtn)   { runBtn.textContent = '▶ RUN QUEUE'; runBtn.disabled = false; }
    if (closeBtn) { closeBtn.textContent = '▼'; closeBtn.style.color = ''; }
    if (rfBtn && _failedPlan.length) {
        rfBtn.style.display = '';
        rfBtn.textContent = '⟳ RETRY FAILED (' + _failedPlan.length + ')';
        rfBtn.disabled = false;
    }

    _txQueueRunning = false;
    applyMarker();
    updatePlayerPlanetLabel();

    // Auto-retry if cost was extracted from error and corrected automatically
    if (_pendingAutoRetry && _failedPlan.length) {
        _pendingAutoRetry = false;
        setTimeout(function() { txqRetryFailed(); }, 400);
        return;
    }
    _pendingAutoRetry = false;

    // Full refresh after run: clear NFT cache + re-fetch chain taverns + rebuild maps
    _playerNFTCache = null;
    _playerNFTCacheTime = 0;
    try { await fetchPlayerTaverns(wallet); } catch(e) {}
    _refreshAllMaps();
    updateTabCounts();
    loadPlayerHireNFTs(wallet, []).catch(function(){});
    if (progLbl) progLbl.textContent = _runSummary;
}

// Retry a single failed plan step (called from per-item ⟳ button)
async function txqRetryStep(step, wallet, allNFTs, retryBtn) {
    if (retryBtn) { retryBtn.disabled = true; retryBtn.textContent = '…'; }
    // Recompute hire action with current _hireBaseCost (handles cost mismatch correction)
    if (step.isTravelAndHire || step.isHire) {
        var avail = allNFTs || [];
        var hd = txqBestHire(wallet, avail, step.objectives);
        if (step.isTravelAndHire) {
            step.actions = [
                { account:'players.ale', name:'travel', authorization:[{actor:wallet,permission:'active'}], data: step.travelData },
                { account:'players.ale', name:'hire',   authorization:[{actor:wallet,permission:'active'}], data: hd }
            ];
        } else {
            step.actions = [{ account:'players.ale', name:'hire',
                authorization:[{actor:wallet,permission:'active'}], data: hd }];
        }
    }
    try {
        if (window.walletSession) await window.walletSession.transact({actions: step.actions});
        else if (wax && wax.api)  await wax.api.transact({actions: step.actions},{blocksBehind:3,expireSeconds:30});
        else throw new Error('No wallet session');

        var itemEl = document.getElementById('txq-item-' + step.qIdx);
        if (itemEl) {
            itemEl.style.background = 'rgba(96,224,144,0.06)';
            var lbl = itemEl.querySelector('.txq-item-label');
            if (lbl) lbl.style.color = '#60e090';
        }
        if (retryBtn) retryBtn.remove();

        _failedPlan = _failedPlan.filter(function(s){ return s !== step; });
        var rfBtn = document.getElementById('txq-retry-failed-btn');
        if (rfBtn) {
            if (!_failedPlan.length) rfBtn.style.display = 'none';
            else rfBtn.textContent = '⟳ RETRY FAILED (' + _failedPlan.length + ')';
        }

        var travelAct = step.actions.find(function(a){ return a.name==='travel'; });
        if (travelAct) _playerPos = {planet:_activePlanet, x:travelAct.data.x, y:travelAct.data.y};
        if (step.tavern && step.tavern.land_id) {
            var key = _activePlanet + '.' + step.tavern.land_id;
            _playerUsedTaverns.add(key);
            try {
                var today = new Date().toISOString().slice(0,10);
                localStorage.setItem('naron_used_taverns', JSON.stringify({date:today, keys:Array.from(_playerUsedTaverns)}));
            } catch(e){}
        }
    } catch(e) {
        console.error('Retry step failed:', e);
        if (retryBtn) { retryBtn.disabled = false; retryBtn.textContent = '⟳'; }
    }
}

// Retry all failed steps from the last run
async function txqRetryFailed() {
    if (!_failedPlan.length || _txQueueRunning) return;
    var wallet = getWallet();
    if (!wallet) return;

    _txQueueRunning = true;
    _txQueueAbort   = false;

    var rfBtn    = document.getElementById('txq-retry-failed-btn');
    var runBtn   = document.getElementById('txq-run-btn');
    var closeBtn = document.getElementById('txq-close-btn');
    var progFill = document.getElementById('txq-prog-fill');
    var progLbl  = document.getElementById('txq-prog-lbl');

    if (rfBtn)    { rfBtn.disabled = true; rfBtn.textContent = 'RETRYING…'; }
    if (runBtn)   { runBtn.disabled = true; }
    if (closeBtn) { closeBtn.textContent = '■ ABORT'; closeBtn.style.color = '#ff6666'; }
    if (progLbl)  { progLbl.textContent = 'Loading NFTs for retry…'; }

    var allNFTs = [];
    try { allNFTs = await loadPlayerHireNFTs(wallet, []); } catch(e) {}

    var toRetry = _failedPlan.slice();
    _failedPlan = [];
    var succeeded = 0, failed = 0;
