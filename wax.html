<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RECOVERY.ALE // CANDLE INTERFACE</title>
    <link rel="icon" type="image/png" href="NCico.png">
    <style>
        :root {
            --bg:         #08000c;
            --trace:      rgba(255,60,200,0.05);
            --pink:       #ff44cc;
            --pink-dim:   #992288;
            --pink-glow:  rgba(255,68,204,0.3);
            --gold:       #ffaa00;
            --gold-dim:   #997700;
            --gold-glow:  rgba(255,170,0,0.3);
            --text:       #ffe8ff;
            --muted:      #7a4488;
            --panel-bg:   rgba(12,0,18,0.95);
            --border:     rgba(255,68,204,0.18);
            --border-hi:  rgba(255,68,204,0.5);
            --border-gold:rgba(255,170,0,0.4);
            --red:        #ff4466;
        }
        *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

        html, body {
            height:100%; width:100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
        }

        /* ── CANDLE FANTASY CIRCUIT BACKGROUND ───────────────────────────── */
        body::before {
            content:'';
            position:fixed; inset:0; z-index:0; pointer-events:none;
            background-image:
                linear-gradient(var(--trace) 1px, transparent 1px),
                linear-gradient(90deg, var(--trace) 1px, transparent 1px),
                linear-gradient(rgba(255,60,200,0.02) 2px, transparent 2px),
                linear-gradient(90deg, rgba(255,60,200,0.02) 2px, transparent 2px);
            background-size: 40px 40px, 40px 40px, 200px 200px, 200px 200px;
        }
        body::after {
            content:'';
            position:fixed; inset:0; z-index:0; pointer-events:none;
            background:
                radial-gradient(ellipse 50% 60% at 50% 100%, rgba(255,100,0,0.06) 0%, transparent 70%),
                radial-gradient(ellipse 60% 30% at 20% 10%, rgba(255,68,204,0.05) 0%, transparent 60%),
                radial-gradient(ellipse 40% 40% at 80% 20%, rgba(255,170,0,0.04) 0%, transparent 60%);
        }

        .scanlines {
            position:fixed; inset:0; z-index:1; pointer-events:none;
            background: repeating-linear-gradient(
                to bottom, transparent 0px, transparent 3px,
                rgba(0,0,0,0.07) 3px, rgba(0,0,0,0.07) 4px
            );
        }

        /* ── LOCK SCREEN ──────────────────────────────────────────────────── */
        #lock-screen {
            position:fixed; inset:0; z-index:100;
            display:flex; align-items:center; justify-content:center;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        #lock-screen.unlocking { opacity:0; transform:scale(1.03); pointer-events:none; }

        .lock-flavor {
            position:absolute; top:10%; left:50%; transform:translateX(-50%);
            text-align:center; user-select:none;
        }
        .lock-flavor h1 {
            font-size:1.3em; letter-spacing:6px; color:var(--pink-dim);
            text-transform:uppercase; margin-bottom:8px;
            text-shadow: 0 0 20px var(--pink-glow);
        }
        .lock-flavor .lock-sub { font-size:0.65em; color:rgba(255,68,204,0.25); letter-spacing:3px; text-transform:uppercase; }

        .pcb-corner {
            position:absolute; width:80px; height:80px;
            border:1px solid var(--pink-dim); opacity:0.2; pointer-events:none;
        }
        .pcb-corner.tl { top:20px; left:20px; border-right:none; border-bottom:none; }
        .pcb-corner.tr { top:20px; right:20px; border-left:none; border-bottom:none; }
        .pcb-corner.bl { bottom:20px; left:20px; border-right:none; border-top:none; }
        .pcb-corner.br { bottom:20px; right:20px; border-left:none; border-top:none; }

        .node { position:absolute; width:6px; height:6px; border-radius:50%; background:var(--pink-dim); opacity:0.2; pointer-events:none; }

        /* ── KEYPAD ───────────────────────────────────────────────────────── */
        #keypad {
            position:absolute; bottom:32px; right:32px;
            background: rgba(8,0,12,0.97);
            border:1px solid var(--border-hi);
            box-shadow: 0 0 24px var(--pink-glow), inset 0 0 30px rgba(0,0,0,0.6);
            padding:14px 16px 12px; border-radius:3px; min-width:174px;
        }
        #keypad::before {
            content:'◈ ACCESS TERMINAL';
            display:block; font-size:0.55em; letter-spacing:3px;
            color:var(--muted); text-align:center; margin-bottom:10px;
        }
        #kp-display {
            background:#030003; border:1px solid var(--border);
            padding:6px 10px; margin-bottom:10px;
            font-size:1.0em; letter-spacing:8px; color:var(--pink);
            text-align:center; min-height:34px;
            box-shadow:inset 0 0 10px rgba(0,0,0,0.9);
            text-shadow: 0 0 8px var(--pink-glow);
        }
        #kp-display.error { color:var(--red); animation:kp-shake 0.4s; text-shadow:0 0 8px rgba(255,60,60,0.5); }
        #kp-display.ok    { color:var(--gold); text-shadow:0 0 10px var(--gold-glow); }

        @keyframes kp-shake {
            0%,100%{transform:translateX(0)} 20%{transform:translateX(-5px)}
            40%{transform:translateX(5px)}   60%{transform:translateX(-4px)} 80%{transform:translateX(4px)}
        }

        .kp-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:5px; margin-bottom:5px; }
        .kp-btn {
            background:rgba(20,0,24,0.9); border:1px solid var(--border);
            color:var(--text); cursor:pointer; padding:7px 2px 5px;
            text-align:center; border-radius:2px; transition:all 0.1s; user-select:none;
            display:flex; flex-direction:column; align-items:center; line-height:1;
        }
        .kp-btn:hover  { background:rgba(80,0,80,0.4); border-color:var(--pink); }
        .kp-btn:active { background:rgba(180,0,140,0.3); transform:scale(0.95); }
        .kp-num  { font-size:1.05em; font-weight:bold; color:#ffccee; }
        .kp-abc  { font-size:0.45em; letter-spacing:1px; color:var(--muted); margin-top:2px; }

        .kp-row-bottom { display:grid; grid-template-columns:1fr 1fr 1fr; gap:5px; }
        .kp-btn.clr  { color:var(--gold); border-color:rgba(255,170,0,0.3); }
        .kp-btn.clr:hover { background:rgba(60,40,0,0.5); border-color:var(--gold); }
        .kp-btn.ent  { color:var(--gold); border-color:var(--border-gold); font-size:0.72em; letter-spacing:1px; }
        .kp-btn.ent:hover { background:rgba(60,40,0,0.5); border-color:var(--gold); box-shadow:0 0 8px var(--gold-glow); }

        #kp-status { margin-top:7px; font-size:0.6em; letter-spacing:2px; text-align:center; color:var(--muted); min-height:1em; }

        /* ── MAIN CONTENT ─────────────────────────────────────────────────── */
        #main { display:none; position:relative; z-index:10; min-height:100vh; padding:0 0 40px; }
        #main.visible { display:block; animation:fade-in 0.7s ease; }
        @keyframes fade-in { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

        .main-header {
            background:rgba(8,0,12,0.98); border-bottom:1px solid var(--border-hi);
            padding:12px 24px; display:flex; align-items:center; gap:16px;
            position:sticky; top:0; z-index:50;
            box-shadow:0 2px 20px var(--pink-glow);
        }
        .main-header h1 { font-size:0.85em; letter-spacing:4px; color:var(--pink); text-transform:uppercase; flex:1; text-shadow:0 0 12px var(--pink-glow); }
        .main-header .hdr-sub { font-size:0.6em; color:var(--muted); letter-spacing:2px; }
        .refresh-btn {
            background:transparent; border:1px solid var(--border);
            color:var(--muted); font-family:'Courier New',monospace;
            font-size:0.68em; letter-spacing:2px; padding:5px 14px;
            cursor:pointer; transition:all 0.2s; text-transform:uppercase;
        }
        .refresh-btn:hover { color:var(--gold); border-color:var(--gold); box-shadow:0 0 8px var(--gold-glow); }
        .lock-btn {
            background:transparent; border:1px solid rgba(255,60,60,0.2);
            color:rgba(255,80,80,0.35); font-family:'Courier New',monospace;
            font-size:0.62em; letter-spacing:2px; padding:5px 10px; cursor:pointer; transition:all 0.2s;
        }
        .lock-btn:hover { color:var(--red); border-color:var(--red); }

        .content-wrap { padding:20px 24px; }

        /* ── OFFERS GRID ──────────────────────────────────────────────────── */
        .offers-row {
            display:grid;
            grid-template-columns: repeat(auto-fill, minmax(260px,1fr)) 230px;
            gap:16px; margin-bottom:24px; align-items:start;
        }

        .offer-box {
            background:var(--panel-bg); border:1px solid var(--border);
            border-radius:4px; padding:16px 18px;
            box-shadow:0 0 16px rgba(0,0,0,0.6);
            transition:border-color 0.2s, box-shadow 0.2s;
        }
        .offer-box:hover { border-color:var(--border-hi); box-shadow:0 0 20px var(--pink-glow); }
        .offer-box.active-offer { border-color:var(--border-gold); box-shadow:0 0 16px var(--gold-glow); }

        .offer-id-row { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
        .offer-id { font-size:0.58em; letter-spacing:3px; color:var(--muted); text-transform:uppercase; }

        .offer-state-badge {
            display:inline-block; font-size:0.55em; letter-spacing:2px;
            padding:2px 8px; border-radius:1px; text-transform:uppercase;
        }
        .badge-active  { background:rgba(255,170,0,0.15); color:#ffcc44; border:1px solid rgba(255,170,0,0.4); }
        .badge-ended   { background:rgba(80,0,30,0.4); color:#aa4466; border:1px solid rgba(180,0,60,0.3); }
        .badge-pending { background:rgba(50,0,60,0.4); color:#aa66cc; border:1px solid rgba(150,0,180,0.3); }

        .offer-name {
            font-size:0.92em; color:#ffccee; letter-spacing:1px;
            margin:4px 0 2px; line-height:1.3; font-weight:bold;
        }
        .offer-req-type { font-size:0.6em; color:var(--muted); letter-spacing:1px; margin-bottom:10px; }

        /* timestamps */
        .offer-times { font-size:0.64em; color:var(--muted); margin:6px 0 10px; line-height:2; }
        .offer-times .t-lbl { letter-spacing:1px; }
        .offer-times .t-val { color:var(--text); margin-left:4px; }
        .offer-times .t-remain { color:var(--gold); font-weight:bold; letter-spacing:2px; font-size:1.15em; display:block; margin-top:2px; }
        .offer-times .t-remain.urgent  { color:#ff8844; animation:pulse 1s infinite; }
        .offer-times .t-remain.expired { color:var(--red); }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.55} }

        /* gem fill bar */
        .offer-bar-wrap { margin:8px 0 4px; }
        .offer-bar-track { height:5px; background:rgba(50,0,50,0.8); border-radius:3px; overflow:hidden; }
        .offer-bar-fill {
            height:100%; border-radius:3px; transition:width 0.5s;
            background:linear-gradient(90deg,var(--pink-dim),var(--pink));
            box-shadow:0 0 6px var(--pink-glow);
        }
        .offer-bar-label { font-size:0.6em; color:var(--muted); text-align:right; margin-top:2px; letter-spacing:1px; }

        .offer-gems { margin:8px 0 4px; font-size:0.7em; color:var(--muted); }
        .offer-gems span { color:var(--text); }

        /* value sections */
        .offer-values {
            margin-top:8px; padding:8px 10px;
            background:rgba(20,0,24,0.7); border:1px solid rgba(255,68,204,0.12);
            border-radius:2px;
        }
        .val-section-label {
            font-size:0.58em; letter-spacing:2px; color:var(--muted);
            text-transform:uppercase; margin-bottom:5px;
            padding-bottom:3px; border-bottom:1px solid rgba(255,68,204,0.1);
        }
        .offer-val-row { display:flex; align-items:center; gap:6px; font-size:0.68em; margin-bottom:4px; }
        .offer-val-row:last-child { margin-bottom:0; }
        .offer-val-row .cur-logo { width:13px; height:13px; object-fit:contain; border-radius:50%; opacity:0.85; flex-shrink:0; }
        .offer-val-row .cur-lbl { flex:1; letter-spacing:1px; color:var(--muted); }
        .offer-val-row .cur-val { color:var(--text); font-size:1.0em; }

        /* DEAL bar */
        .deal-section { margin-top:10px; padding-top:10px; border-top:1px solid rgba(255,68,204,0.12); }
        .deal-label {
            display:flex; justify-content:space-between; align-items:baseline;
            font-size:0.6em; letter-spacing:2px; color:var(--muted);
            margin-bottom:6px; text-transform:uppercase;
        }
        .deal-multiplier { font-size:1.6em; font-weight:bold; letter-spacing:2px; }
        .deal-bad   { color:#ff4466; }
        .deal-low   { color:#ff7744; }
        .deal-fair  { color:var(--gold); }
        .deal-good  { color:#ffdd44; text-shadow:0 0 8px rgba(255,220,0,0.5); }
        .deal-great { color:var(--pink); text-shadow:0 0 10px var(--pink-glow); }
        .deal-bar-track { height:8px; background:rgba(30,0,30,0.9); border-radius:4px; overflow:hidden; }
        .deal-bar-fill  { height:100%; border-radius:4px; transition:width 0.5s; }
        .deal-scale {
            display:flex; justify-content:space-between;
            font-size:0.55em; color:rgba(120,40,140,0.6);
            margin-top:3px; letter-spacing:1px;
        }

        .no-offers {
            grid-column:1/-1; text-align:center;
            font-size:0.75em; color:var(--muted); padding:30px;
            border:1px dashed rgba(255,68,204,0.15); border-radius:3px;
        }

        /* ── GEM CALCULATOR ───────────────────────────────────────────────── */
        #calc-box {
            background:var(--panel-bg); border:1px solid var(--border-gold);
            border-radius:4px; padding:16px 18px;
            box-shadow:0 0 18px var(--gold-glow);
        }
        .calc-title {
            font-size:0.6em; letter-spacing:3px; color:var(--gold);
            text-transform:uppercase; margin-bottom:10px;
            padding-bottom:6px; border-bottom:1px solid var(--border-gold);
            text-shadow:0 0 8px var(--gold-glow);
        }
        .calc-input-wrap { display:flex; align-items:center; gap:6px; margin-bottom:12px; }
        .calc-input-wrap .cur-logo { width:18px; height:18px; object-fit:contain; border-radius:50%; opacity:0.9; flex-shrink:0; }
        #calc-gems {
            flex:1; background:rgba(20,0,24,0.9);
            border:1px solid var(--border); color:var(--text);
            font-family:'Courier New',monospace; font-size:0.88em;
            padding:6px 8px; outline:none; border-radius:2px; width:100%;
        }
        #calc-gems:focus { border-color:var(--pink); box-shadow:0 0 6px var(--pink-glow); }
        #calc-gems::placeholder { color:var(--muted); }

        .calc-row { display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid rgba(255,68,204,0.1); font-size:0.72em; }
        .calc-row:last-child { border-bottom:none; }
        .calc-row .cur-logo { width:15px; height:15px; object-fit:contain; border-radius:50%; opacity:0.85; flex-shrink:0; }
        .calc-row .c-lbl { flex:1; color:var(--muted); letter-spacing:1px; }
        .calc-row .c-val { color:var(--text); font-size:1.1em; letter-spacing:1px; min-width:80px; text-align:right; }

        .calc-note {
            margin-top:10px; font-size:0.58em; color:rgba(180,100,160,0.5);
            letter-spacing:1px; line-height:1.6; border-top:1px solid rgba(255,68,204,0.12);
            padding-top:8px;
        }

        /* ── REQUIREMENTS TABLE ───────────────────────────────────────────── */
        .req-section { background:var(--panel-bg); border:1px solid var(--border); border-radius:4px; overflow:hidden; }
        .req-header {
            background:rgba(12,0,16,0.98); padding:10px 16px;
            border-bottom:1px solid var(--border);
            display:flex; align-items:center; gap:12px;
        }
        .req-header h2 { font-size:0.72em; letter-spacing:3px; color:var(--pink); text-transform:uppercase; flex:1; }
        .req-count { font-size:0.6em; color:var(--muted); letter-spacing:2px; }
        .req-scroll { overflow-y:auto; max-height:440px; }
        .req-table { width:100%; border-collapse:collapse; font-size:0.7em; }
        .req-table thead th {
            position:sticky; top:0;
            background:rgba(10,0,14,0.99); color:var(--muted);
            font-size:0.85em; letter-spacing:2px; text-transform:uppercase;
            padding:8px 14px; text-align:left;
            border-bottom:1px solid var(--border);
        }
        .req-table thead th:first-child { color:var(--pink); }
        .req-table tbody tr { border-bottom:1px solid rgba(255,68,204,0.1); transition:background 0.1s; }
        .req-table tbody tr:hover { background:rgba(60,0,60,0.3); }
        .req-table tbody td { padding:7px 14px; color:var(--text); vertical-align:middle; }
        .req-table tbody td.name-cell { color:#ffccee; font-weight:bold; }
        .req-type-sub { display:block; font-size:0.75em; color:var(--muted); letter-spacing:1px; font-weight:normal; }
        .req-table .gem-cell { display:flex; align-items:center; gap:5px; white-space:nowrap; }
        .req-table .gem-cell img { width:13px; height:13px; object-fit:contain; }
        .req-empty { padding:30px; text-align:center; color:var(--muted); font-size:0.75em; letter-spacing:2px; }

        /* loading */
        .loading-pulse { display:inline-block; animation:fade-pulse 1.2s infinite; }
        @keyframes fade-pulse { 0%,100%{opacity:0.3} 50%{opacity:1} }

        #fetch-status { font-size:0.62em; color:var(--muted); letter-spacing:2px; text-align:right; padding:4px 0; }
        #fetch-status.ok  { color:var(--gold-dim); }
        #fetch-status.err { color:var(--red); }

        ::-webkit-scrollbar { width:5px; }
        ::-webkit-scrollbar-track { background:#030003; }
        ::-webkit-scrollbar-thumb { background:var(--pink-dim); border-radius:2px; }

        /* ── WALLET BUTTONS ───────────────────────────────────────────────── */
        .wallet-btn {
            background: rgba(8,0,12,0.95); color: var(--pink);
            border: 1px dashed var(--pink-dim); padding: 5px 13px;
            font-family: 'Courier New', monospace; font-size: 0.68em;
            letter-spacing: 1px; cursor: pointer; transition: all 0.2s; border-radius: 2px;
        }
        .wallet-btn:hover { border-color: var(--pink); box-shadow: 0 0 8px var(--pink-glow); }
        .wallet-btn.logged-in { background: rgba(255,170,0,0.08); color: var(--gold); border: 1px solid var(--gold-dim); }
        .wallet-btn.logged-in:hover { border-color: var(--gold); box-shadow: 0 0 8px var(--gold-glow); }
        .wallet-area { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }

        /* ── REQUIREMENT CHECK ───────────────────────────────────────────── */
        .req-check {
            display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:6px;
            margin:8px 0 4px; padding:6px 10px;
            background:rgba(255,68,204,0.06); border:1px solid rgba(255,68,204,0.18);
            border-radius:3px; font-size:0.67em; letter-spacing:1px;
        }
        .req-need { color:var(--muted); }
        .req-need strong { color:var(--text); }
        .req-yours { display:flex; align-items:center; gap:5px; }
        .req-yours.met   { color:#60e090; }
        .req-yours.unmet { color:var(--red); }
        .req-yours.unknown { color:var(--muted); font-style:italic; }

        /* ── CONTRIBUTOR LIST ─────────────────────────────────────────────── */
        .contrib-section { margin-top:10px; border-top:1px solid rgba(255,68,204,0.15); padding-top:8px; }
        .contrib-title { font-size:0.58em; color:var(--muted); letter-spacing:2px; text-transform:uppercase; margin-bottom:5px; }
        .contrib-row {
            display:flex; align-items:center; gap:6px;
            padding:3px 4px; font-size:0.64em; letter-spacing:0.5px;
            border-bottom:1px solid rgba(255,68,204,0.06);
        }
        .contrib-row:last-child { border-bottom:none; }
        .contrib-row.contrib-me { background:rgba(255,170,0,0.08); border-radius:2px; padding:3px 5px; border-bottom:none; margin-bottom:2px; }
        .contrib-wallet { flex:1; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .contrib-row.contrib-me .contrib-wallet { color:var(--gold); }
        .contrib-amt { color:var(--pink-dim); white-space:nowrap; }
        .contrib-row.contrib-me .contrib-amt { color:var(--gold-dim); }
        .contrib-share { color:var(--muted); font-size:0.85em; min-width:36px; text-align:right; }
        .contrib-row.contrib-me .contrib-share { color:var(--gold-dim); }
        .contrib-empty { font-size:0.62em; color:var(--muted); letter-spacing:1px; padding:4px 0; }
    </style>
    <script src="waxjs.js"></script>
    <script type="module">
        import { SessionKit } from 'https://esm.sh/@wharfkit/session@1';
        import { WebRenderer } from 'https://esm.sh/@wharfkit/web-renderer@1';
        import { WalletPluginAnchor } from 'https://esm.sh/@wharfkit/wallet-plugin-anchor@1';
        const kit = new SessionKit({
            appName: 'naroncodex',
            chains: [{ id: '1064487b3cd1a897ce03ae5b6a865651747e2e152090f99c1d19d44e01aea5a4', url: 'https://wax.greymass.com' }],
            ui: new WebRenderer(),
            walletPlugins: [new WalletPluginAnchor()],
        });
        window.walletKit = kit;
        try {
            const session = await kit.restore();
            if (session) {
                window.walletSession = session;
                localStorage.setItem('naron_wallet', String(session.actor));
                if (typeof checkWalletState === 'function') checkWalletState();
            }
        } catch(e) { console.warn('Session restore failed:', e); }
    </script>
</head>
<body>

<div class="scanlines"></div>

<!-- ══ LOCK SCREEN ══════════════════════════════════════════════════════ -->
<div id="lock-screen">
    <div class="pcb-corner tl"></div>
    <div class="pcb-corner tr"></div>
    <div class="pcb-corner bl"></div>
    <div class="pcb-corner br"></div>
    <div class="node" style="top:18%;left:8%"></div>
    <div class="node" style="top:24%;left:12%"></div>
    <div class="node" style="top:75%;left:6%"></div>
    <div class="node" style="top:40%;right:10%"></div>
    <div class="node" style="top:60%;right:14%"></div>

    <div class="lock-flavor">

    <div id="keypad">
        <div id="kp-display">_</div>

            <button class="kp-btn" onclick="kpPress('3')"><span class="kp-num">3</span><span class="kp-abc">DEF</span></button>
            <button class="kp-btn" onclick="kpPress('4')"><span class="kp-num">4</span><span class="kp-abc">GHI</span></button>
            <button class="kp-btn" onclick="kpPress('5')"><span class="kp-num">5</span><span class="kp-abc">JKL</span></button>
            <button class="kp-btn" onclick="kpPress('6')"><span class="kp-num">6</span><span class="kp-abc">MNO</span></button>
            <button class="kp-btn" onclick="kpPress('7')"><span class="kp-num">7</span><span class="kp-abc">PQRS</span></button>
            <button class="kp-btn" onclick="kpPress('8')"><span class="kp-num">8</span><span class="kp-abc">TUV</span></button>

            <button class="kp-btn" onclick="kpPress('0')"><span class="kp-num">0</span><span class="kp-abc">&nbsp;</span></button>
            <button class="kp-btn ent" onclick="kpEnter()">ENTER</button>
        </div>
        <div id="kp-status"></div>
    </div>
</div>

<!-- ══ MAIN CONTENT ═════════════════════════════════════════════════════ -->
<div id="main">
    <div class="main-header">
        <div>
            <h1>🕯 Recovery.ALE — Candle Interface</h1>
            <div class="hdr-sub" id="fetch-status">Loading chain data…</div>
        </div>
        <div class="wallet-area">
            <button id="wallet-connect-btn" class="wallet-btn logged-in" onclick="disconnectWallet()" style="display:none;"></button>
            <button id="wallet-btn-anchor" class="wallet-btn" onclick="loginWithAnchor()">[ ⚓ ANCHOR ]</button>
            <button id="wallet-btn-wcc" class="wallet-btn" onclick="loginWithWCC()">[ ☁ CLOUD ]</button>
        </div>
        <button class="refresh-btn" onclick="refreshAll()">⟳ REFRESH</button>
        <button class="lock-btn" onclick="lockScreen()">⌁ LOCK</button>
    </div>

    <div class="content-wrap">
        <div class="offers-row" id="offers-row">
            <div class="offer-box" style="grid-column:1/-1">
                <div class="offer-id"><span class="loading-pulse">Querying recovery.ale::offers…</span></div>
            </div>
        </div>

        <div class="req-section">
            <div class="req-header">
                <h2>◆ Requirements Registry</h2>
                <span class="req-count" id="req-count">—</span>
            </div>
            <div class="req-scroll">
                <table class="req-table" id="req-table">
                    <thead><tr id="req-head"></tr></thead>
                    <tbody id="req-body">
                        <tr><td><div class="req-empty"><span class="loading-pulse">Loading requirements…</span></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // ── CONVERSION RATES ─────────────────────────────────────────────────────
    const GEM_TO_WAX     = 500 / 1100;  // fixed shop rate
    const SHARDS_PER_TLM = 3;           // Zapps "good" price: 300 shards / 100 TLM
    let _liveWaxUsd  = null;
    let _liveTlmUsd  = null;
    let _gemToTlm    = 1900 / 1100;
    let _gemToShards = (1900 / 1100) * SHARDS_PER_TLM;
    let _reqMap      = {};   // requirement_type → display name
    let _offersCache  = [];   // last fetched offers, used for contribution re-render
    let _allContribs  = {};  // offer_id → [{wallet, amount}] sorted by amount desc
    let _playerStats  = {};  // permstat key → value for logged-in player

    const LOGO_GEMS   = 'Ale%20images/gems.png';
    const LOGO_SHARDS = 'Ale%20images/coin.png';
    const LOGO_WAX    = 'https://s2.coinmarketcap.com/static/img/coins/64x64/2300.png';
    const LOGO_TLM    = 'https://s2.coinmarketcap.com/static/img/coins/64x64/9119.png';

    async function fetchLivePrices() {
        try {
            const r = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=wax,alien-worlds&vs_currencies=usd', { cache:'no-store' });
            if (!r.ok) throw new Error('CoinGecko ' + r.status);
            const d = await r.json();
            _liveWaxUsd = d['wax']?.usd || null;
            _liveTlmUsd = d['alien-worlds']?.usd || null;
            if (_liveWaxUsd && _liveTlmUsd) {
                _gemToTlm    = GEM_TO_WAX * (_liveWaxUsd / _liveTlmUsd);
                _gemToShards = _gemToTlm * SHARDS_PER_TLM;
                updateCalcRateDisplay();
            }
        } catch(e) {}
    }

    function updateCalcRateDisplay() {
        const el = document.getElementById('calc-price-info');
        if (!el) return;
        if (!_liveWaxUsd || !_liveTlmUsd) { el.textContent = 'prices: fallback (offline)'; return; }
        const ratio = (_liveWaxUsd / _liveTlmUsd).toFixed(2);
        el.innerHTML =
            `<img src="${LOGO_WAX}" style="width:14px;height:14px;vertical-align:middle;border-radius:50%;margin-right:3px;">` +
            `$${_liveWaxUsd.toFixed(5)} &nbsp;` +
            `<img src="${LOGO_TLM}" style="width:14px;height:14px;vertical-align:middle;border-radius:50%;margin-right:3px;">` +
            `$${_liveTlmUsd.toFixed(5)}<br>1 WAX = ${ratio} TLM (live)`;
    }

    // ── KEYPAD ────────────────────────────────────────────────────────────────
    const ALPHA_MAP = {
        A:'2',B:'2',C:'2', D:'3',E:'3',F:'3', G:'4',H:'4',I:'4',
        J:'5',K:'5',L:'5', M:'6',N:'6',O:'6', P:'7',Q:'7',R:'7',S:'7',
        T:'8',U:'8',V:'8', W:'9',X:'9',Y:'9',Z:'9',
    };
    const VALID_CODES = ['64706', '62766'];
    const MAX_DIGITS  = 8;
    let _kpInput = '';

    function kpPress(d) { if (_kpInput.length < MAX_DIGITS) { _kpInput += d; updateKpDisplay(); } }
    function kpClear()  { _kpInput = ''; updateKpDisplay(); setKpStatus(''); }
    function updateKpDisplay() {
        const el = document.getElementById('kp-display');
        el.className = '';
        el.textContent = _kpInput.length ? '●'.repeat(_kpInput.length) : '_';
    }
    function setKpStatus(msg, cls) {
        const el = document.getElementById('kp-status');
        el.textContent = msg;
        el.style.color = cls === 'err' ? 'var(--red)' : cls === 'ok' ? 'var(--gold)' : 'var(--muted)';
    }
    function kpEnter() {
        if (!_kpInput) return;
        if (VALID_CODES.includes(_kpInput)) {
            const el = document.getElementById('kp-display');
            el.className = 'ok'; el.textContent = '✓ ACCESS GRANTED';
            setKpStatus('WELCOME BACK', 'ok');
            sessionStorage.setItem('rcv_unlocked', '1');
            setTimeout(() => {
                document.getElementById('lock-screen').classList.add('unlocking');
                setTimeout(() => {
                    document.getElementById('lock-screen').style.display = 'none';
                    document.getElementById('main').classList.add('visible');
                    refreshAll();
                }, 600);
            }, 600);
        } else {
            const el = document.getElementById('kp-display');
            el.className = 'error';
            setKpStatus('ACCESS DENIED', 'err');
            setTimeout(() => { _kpInput = ''; el.className = ''; el.textContent = '_'; setKpStatus(''); }, 1200);
        }
    }
    function lockScreen() {
        sessionStorage.removeItem('rcv_unlocked');
        document.getElementById('main').classList.remove('visible');
        document.getElementById('main').style.display = 'none';
        const ls = document.getElementById('lock-screen');
        ls.style.display = ''; ls.classList.remove('unlocking');
        _kpInput = ''; updateKpDisplay(); setKpStatus('');
    }
    document.addEventListener('keydown', function(e) {
        if (document.getElementById('lock-screen').style.display === 'none') return;
        const k = e.key.toUpperCase();
        if (ALPHA_MAP[k]) { kpPress(ALPHA_MAP[k]); return; }
        if (/^[0-9]$/.test(e.key)) { kpPress(e.key); return; }
        if (e.key === 'Enter')     { kpEnter(); return; }
        if (e.key === 'Backspace') { _kpInput = _kpInput.slice(0,-1); updateKpDisplay(); }
        if (e.key === 'Escape')    { kpClear(); }
    });
    if (sessionStorage.getItem('rcv_unlocked') === '1') {
        document.getElementById('lock-screen').style.display = 'none';
        document.getElementById('main').classList.add('visible');
    }

    // ── WAX API ───────────────────────────────────────────────────────────────
    const ENDPOINTS = ['https://wax.greymass.com','https://wax.eosusa.io','https://api.wax.alohaeos.com'];
    async function fetchRows(params) {
        let last;
        for (const ep of ENDPOINTS) {
            try {
                const r = await fetch(ep + '/v1/chain/get_table_rows', {
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({ json:true, ...params })
                });
                if (r.ok) return await r.json();
            } catch(e) { last = e; }
        }
        throw last || new Error('WAX API unavailable');
    }
    async function fetchAllRows(params) {
        let rows = [], lb = '';
        while (true) {
            const d = await fetchRows({ ...params, lower_bound: lb || undefined, limit:200 });
            if (!d.rows || !d.rows.length) break;
            rows = rows.concat(d.rows);
            if (!d.more) break;
            lb = d.next_key || ''; if (!lb) break;
        }
        return rows;
    }

    // ── FORMAT HELPERS ────────────────────────────────────────────────────────
    function fmtWax(n)    { return Number(n).toLocaleString(undefined,{minimumFractionDigits:8,maximumFractionDigits:8}); }
    function fmtTlm(n)    { return Number(n).toLocaleString(undefined,{minimumFractionDigits:4,maximumFractionDigits:4}); }
    function fmtShards(n) { return Number(n).toLocaleString(undefined,{minimumFractionDigits:1,maximumFractionDigits:1}); }
    function fmtBig(n)    { return Number(n).toLocaleString(undefined,{maximumFractionDigits:0}); }

    function tsToMs(ts) {
        if (!ts) return null;
        const n = Number(ts);
        return isNaN(n) ? new Date(ts + 'Z').getTime() : n * 1000;
    }
    function fmtTimestamp(ts) {
        if (!ts) return '—';
        try {
            const ms = tsToMs(ts);
            return new Date(ms).toUTCString().replace('GMT','UTC');
        } catch(e) { return String(ts); }
    }

    function countdown(endTs) {
        const ms = tsToMs(endTs);
        if (!ms) return { text:'—', cls:'' };
        const diff = Math.floor((ms - Date.now()) / 1000);
        if (diff <= 0) return { text:'EXPIRED', cls:'expired' };
        const h = Math.floor(diff / 3600);
        const m = Math.floor((diff % 3600) / 60);
        const s = diff % 60;
        const text = h > 0
            ? `${h}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`
            : `${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
        return { text, cls: diff < 300 ? 'urgent' : '' };
    }

    // ── REWARD PARSING ────────────────────────────────────────────────────────
    function parseReward(offer) {
        const rawAmt = offer.reward_amount || offer.winnings || offer.reward || '';
        const rawTyp = offer.reward_type   || offer.type     || '';
        let amount = 0, type = '';
        let isAssetString = false;
        if (typeof rawAmt === 'string' && /\s/.test(rawAmt.trim())) {
            // Asset string like "3113.4580 WAX" — decimal already applied
            const p = rawAmt.trim().split(/\s+/);
            amount = parseFloat(p[0].replace(/,/g,'')) || 0;
            type   = (p[1] || '').toLowerCase();
            isAssetString = true;
        } else {
            amount = parseFloat(rawAmt) || 0;
            type   = String(rawTyp).toLowerCase();
        }
        // Raw integers from chain need precision normalization
        if (!isAssetString && amount > 0) {
            if (type.includes('wax'))        amount = amount / 1e8;
            else if (type.includes('tlm'))   amount = amount / 1e4;
            else if (type.includes('shard')) amount = amount / 10;
        }
        return { amount, type };
    }

    function rewardToWax(amount, type) {
        if (!amount) return 0;
        const tlmPerWax = (_liveWaxUsd && _liveTlmUsd) ? _liveTlmUsd / _liveWaxUsd : 0.25;
        if (type.includes('wax'))   return amount;
        if (type.includes('tlm'))   return amount * tlmPerWax;
        if (type.includes('shard')) return (amount / SHARDS_PER_TLM) * tlmPerWax;
        if (type.includes('gem'))   return amount * GEM_TO_WAX;
        return 0;
    }

    function valRow(logo, lbl, val) {
        return `<div class="offer-val-row">
            <img class="cur-logo" src="${logo}" onerror="this.style.display='none'">
            <span class="cur-lbl">${lbl}</span>
            <span class="cur-val">${val}</span>
        </div>`;
    }

    function allCurrencyRows(waxAmt) {
        const tlmPerWax = (_liveWaxUsd && _liveTlmUsd) ? _liveWaxUsd / _liveTlmUsd : 3.8;
        return [
            valRow(LOGO_WAX,    'WAX',    fmtWax(waxAmt)),
            valRow(LOGO_TLM,    'TLM',    fmtTlm(waxAmt * tlmPerWax)),
            valRow(LOGO_SHARDS, 'SHARDS', fmtShards(waxAmt * tlmPerWax * SHARDS_PER_TLM)),
            valRow(LOGO_GEMS,   'GEMS',   fmtBig(waxAmt / GEM_TO_WAX)),
        ].join('');
    }

    function rewardValueHtml(offer) {
        const { amount, type } = parseReward(offer);
        if (!amount) return '';
        const waxVal = rewardToWax(amount, type);
        const tlmPerWax = (_liveWaxUsd && _liveTlmUsd) ? _liveWaxUsd / _liveTlmUsd : 3.8;
        const rows = [
            valRow(LOGO_WAX,    'WAX',    fmtWax(waxVal)),
            valRow(LOGO_TLM,    'TLM',    fmtTlm(waxVal * tlmPerWax)),
            valRow(LOGO_SHARDS, 'SHARDS', fmtShards(waxVal * tlmPerWax * SHARDS_PER_TLM)),
            valRow(LOGO_GEMS,   'GEMS',   fmtBig(waxVal / GEM_TO_WAX)),
        ].join('');
        return `<div class="offer-values"><div class="val-section-label">REWARD ≈ VALUE</div>${rows}</div>`;
    }

    function contributedValueHtml(contrib) {
        if (!contrib || contrib <= 0) return '';
        const waxVal = contrib * GEM_TO_WAX;
        return `<div class="offer-values"><div class="val-section-label">CONTRIBUTED ≈ VALUE (${fmtBig(contrib)} GEMS)</div>${allCurrencyRows(waxVal)}</div>`;
    }

    function dealBarHtml(offer) {
        const { amount, type } = parseReward(offer);
        const gems = offerGems(offer);
        if (!amount || !gems) return '';
        const rewardWax = rewardToWax(amount, type);
        const costWax   = gems * GEM_TO_WAX;
        if (!rewardWax || !costWax) return '';
        const deal = rewardWax / costWax;
        const barPct = Math.min(100, Math.max(0, (Math.log10(Math.max(0.01, deal)) + 1) / 2 * 100));
        const displayX = deal >= 10 ? deal.toFixed(1) + 'x+' : deal.toFixed(2) + 'x';
        let dealClass, barStyle;
        if      (deal < 0.5) { dealClass = 'deal-bad';   barStyle = 'background:#ff4466'; }
        else if (deal < 1.0) { dealClass = 'deal-low';   barStyle = 'background:#ff7744'; }
        else if (deal < 2.0) { dealClass = 'deal-fair';  barStyle = 'background:#ffaa00'; }
        else if (deal < 5.0) { dealClass = 'deal-good';  barStyle = 'background:linear-gradient(90deg,#ffaa00,#ffdd44)'; }
        else                  { dealClass = 'deal-great'; barStyle = 'background:linear-gradient(90deg,#ffaa00,#ff44cc)'; }
        return `<div class="deal-section">
            <div class="deal-label"><span>◈ DEAL METER</span><span class="deal-multiplier ${dealClass}">${displayX}</span></div>
            <div class="deal-bar-track"><div class="deal-bar-fill" style="width:${barPct.toFixed(1)}%;${barStyle}"></div></div>
            <div class="deal-scale"><span>0.1×</span><span>1×</span><span>10×+</span></div>
        </div>`;
    }

    // ── OFFER FIELD EXTRACTORS ────────────────────────────────────────────────
    function offerGems(o) {
        return o.gem_target || o.gems_required || o.required_gems || o.total_gems || o.target_gems || o.gems || o.gem_amount || 0;
    }
    function offerContributed(o) {
        return o.current_gems || o.gems_contributed || o.total_contributed || o.contributed || o.gem_count || o.contributions || 0;
    }
    function offerEndTime(o)   { return o.offer_end   || o.end_time  || o.end   || o.expiry  || o.expires  || null; }
    function offerStartTime(o) { return o.offer_start || o.start_time|| o.start || o.start_at|| null; }

    function badgeHtml(state) {
        const s = String(state || '').toLowerCase();
        if (s === 'active')                         return '<span class="offer-state-badge badge-active">● ACTIVE</span>';
        if (['ended','paying','paid'].includes(s))  return '<span class="offer-state-badge badge-ended">■ ENDED</span>';
        return `<span class="offer-state-badge badge-pending">◌ ${(state||'UNKNOWN').toUpperCase()}</span>`;
    }

    function reqCheckHtml(offer) {
        const reqType = offer.requirement_type || offer.req_type || '';
        const reqAmt  = offer.requirement_amount;
        if (reqAmt === undefined || reqAmt === null) return '';
        const reqName = offer.requirements || _reqMap[reqType] || reqType || 'requirement';
        const needHtml = `<span class="req-need">NEED: <strong>${fmtBig(reqAmt)}</strong> ${reqName}</span>`;
        const wallet = localStorage.getItem('naron_wallet');
        if (!wallet) return `<div class="req-check">${needHtml}</div>`;
        if (!Object.keys(_playerStats).length) {
            return `<div class="req-check">${needHtml}<span class="req-yours unknown">YOURS: loading…</span></div>`;
        }
        const myVal = _playerStats[reqType];
        if (myVal === undefined) {
            return `<div class="req-check">${needHtml}<span class="req-yours unknown">YOURS: —</span></div>`;
        }
        const met = myVal >= reqAmt;
        return `<div class="req-check">
            ${needHtml}
            <span class="req-yours ${met ? 'met' : 'unmet'}">
                YOURS: <strong>${fmtBig(myVal)}</strong> ${met ? '✓' : '✗'}
            </span>
        </div>`;
    }

    function contribListHtml(offerId, totalGems) {
        const me   = localStorage.getItem('naron_wallet') || '';
        const list = _allContribs[offerId];
        if (!list) return '';
        if (!list.length) return `<div class="contrib-section"><div class="contrib-empty">No contributions yet</div></div>`;
        const rows = list.map(c => {
            const isMe = me && c.wallet === me;
            const pct  = totalGems > 0 ? Math.round(c.amount / totalGems * 100) : 0;
            return `<div class="contrib-row${isMe ? ' contrib-me' : ''}">
                <img src="${LOGO_GEMS}" style="width:11px;height:11px;object-fit:contain;opacity:0.7;flex-shrink:0;">
                <span class="contrib-wallet">${isMe ? '◈ ' : ''}${c.wallet}</span>
                <span class="contrib-amt">${fmtBig(c.amount)}</span>
                <span class="contrib-share">${pct}%</span>
            </div>`;
        }).join('');
        return `<div class="contrib-section">
            <div class="contrib-title">Contributors (${list.length})</div>
            ${rows}
        </div>`;
    }

    // ── RENDER OFFERS ─────────────────────────────────────────────────────────
    let _offerTimerIds = [];
    function renderOffers(offers) {
        _offerTimerIds.forEach(clearInterval);
        _offerTimerIds = [];
        const row = document.getElementById('offers-row');
        if (!offers || !offers.length) {
            row.innerHTML = '<div class="no-offers">No offers found in recovery.ale</div>'; return;
        }
        _offersCache = offers;

        let html = '';
        offers.forEach((o, idx) => {
            const id       = o.id ?? idx;
            const reqType  = o.requirement_type || o.req_type || '';
            const name     = _reqMap[reqType] || o.title || o.name || o.offer_name || `Offer #${id}`;
            const state    = o.state || o.status || 'unknown';
            const gems     = offerGems(o);
            const contrib  = offerContributed(o);
            const pct      = gems > 0 ? Math.min(100, Math.round(contrib / gems * 100)) : 0;
            const endSec   = offerEndTime(o);
            const startSec = offerStartTime(o);
            const timerId  = `timer-${id}`;

            const { amount: rwdAmt, type: rwdType } = parseReward(o);
            const _rwdFmt = rwdType.includes('wax') ? fmtWax : rwdType.includes('tlm') ? fmtTlm : rwdType.includes('shard') ? fmtShards : fmtBig;
            const rwdDisplay = rwdAmt
                ? `${_rwdFmt(rwdAmt)} ${rwdType.toUpperCase() || '?'}`
                : '—';

            let timesHtml = `<div class="offer-times">`;
            if (startSec) timesHtml += `<span class="t-lbl">START:</span><span class="t-val">${fmtTimestamp(startSec)}</span><br>`;
            if (endSec) {
                timesHtml += `<span class="t-lbl">END:</span><span class="t-val">${fmtTimestamp(endSec)}</span><br>`;
                const cd = countdown(endSec);
                timesHtml += `<span class="t-remain ${cd.cls}" id="${timerId}">${cd.text}</span>`;
            }
            timesHtml += `</div>`;

            html += `<div class="offer-box ${String(state).toLowerCase() === 'active' ? 'active-offer' : ''}">
                <div class="offer-id-row">
                    <span class="offer-id">OFFER #${id}</span>
                    ${badgeHtml(state)}
                </div>
                <div class="offer-name">${name}</div>
                ${reqType ? `<div class="offer-req-type">${reqType}</div>` : ''}
                ${reqCheckHtml(o)}
                ${timesHtml}
                <div class="offer-gems">Contributed: <span>${fmtBig(contrib)}</span>
                    <img src="${LOGO_GEMS}" style="width:12px;height:12px;vertical-align:middle;margin:0 2px;" onerror="this.style.display='none'">
                    / <span>${fmtBig(gems)}</span>
                    <img src="${LOGO_GEMS}" style="width:12px;height:12px;vertical-align:middle;margin:0 2px;" onerror="this.style.display='none'">
                </div>
                <div class="offer-bar-wrap">
                    <div class="offer-bar-track"><div class="offer-bar-fill" style="width:${pct}%"></div></div>
                    <div class="offer-bar-label">${pct}% FILLED</div>
                </div>
                <div style="font-size:0.7em;color:var(--muted);margin:6px 0 4px;">REWARD: <strong style="color:#ffccee;">${rwdDisplay}</strong></div>
                ${rewardValueHtml(o)}
                ${contributedValueHtml(contrib)}
                ${dealBarHtml(o)}
                ${contribListHtml(o.offer_id, gems)}
            </div>`;
        });

        // Calculator panel (last column)
        html += `<div id="calc-box">
            <div class="calc-title">🕯 Gem Value Calc</div>
            <div class="calc-input-wrap">
                <img class="cur-logo" src="${LOGO_GEMS}" onerror="this.style.display='none'">
                <input id="calc-gems" type="number" min="0" placeholder="Enter gems…" oninput="calcUpdate()">
            </div>
            <div class="calc-row">
                <img class="cur-logo" src="${LOGO_WAX}" onerror="this.style.display='none'">
                <span class="c-lbl">WAX</span><span class="c-val" id="calc-wax">—</span>
            </div>
            <div class="calc-row">
                <img class="cur-logo" src="${LOGO_TLM}" onerror="this.style.display='none'">
                <span class="c-lbl">TLM</span><span class="c-val" id="calc-tlm">—</span>
            </div>
            <div class="calc-row">
                <img class="cur-logo" src="${LOGO_SHARDS}" onerror="this.style.display='none'">
                <span class="c-lbl">SHARDS</span><span class="c-val" id="calc-shards">—</span>
            </div>
            <div class="calc-note">
                SHOP: 500 WAX = 1,100 GEMS (fixed)<br>
                TLM &amp; SHARDS via live market<br>
                <span id="calc-price-info" style="color:var(--muted);font-size:1.05em;line-height:1.6;"><span class="loading-pulse">fetching prices…</span></span>
            </div>
        </div>`;

        row.innerHTML = html;
        updateCalcRateDisplay();

        // Start countdown timers
        offers.forEach((o, idx) => {
            const endSec = offerEndTime(o);
            const id = o.id ?? idx;
            if (!endSec) return;
            const tid = setInterval(() => {
                const el = document.getElementById(`timer-${id}`);
                if (!el) { clearInterval(tid); return; }
                const cd = countdown(endSec);
                el.textContent = cd.text;
                el.className   = `t-remain ${cd.cls}`;
            }, 1000);
            _offerTimerIds.push(tid);
        });
    }

    // ── RENDER REQUIREMENTS ───────────────────────────────────────────────────
    const GEM_FIELDS = new Set(['gem_cost','gems','required_gems','gems_required','gem_target','gem_amount','amount']);
    const HIDE_COLS  = new Set(['name','requirement_type','req_type']);  // handled specially

    function renderRequirements(rows) {
        const tbody = document.getElementById('req-body');
        const thead = document.getElementById('req-head');
        const count = document.getElementById('req-count');
        if (!rows || !rows.length) {
            thead.innerHTML = '<th>—</th>';
            tbody.innerHTML = '<tr><td><div class="req-empty">No requirements data found.</div></td></tr>';
            count.textContent = '0 ENTRIES'; return;
        }
        count.textContent = rows.length + ' ENTRIES';

        // Build requirement map for offer name lookup
        _reqMap = {};
        rows.forEach(r => {
            const key = r.requirement_type || r.req_type || r.id;
            if (key && r.name) _reqMap[String(key)] = r.name;
        });

        // Collect keys excluding the ones we'll show specially
        const keySet = new Set(); const keys = [];
        rows.forEach(r => Object.keys(r).forEach(k => {
            if (!keySet.has(k) && !HIDE_COLS.has(k)) { keySet.add(k); keys.push(k); }
        }));

        // Name + type are first two columns
        thead.innerHTML =
            `<th>NAME</th>` +
            keys.map(k => `<th>${k.replace(/_/g,' ').toUpperCase()}</th>`).join('');

        const html = rows.map(r => {
            const name    = r.name || '—';
            const subtype = r.requirement_type || r.req_type || '';
            const nameTd  = `<td class="name-cell">${name}${subtype ? `<span class="req-type-sub">${subtype}</span>` : ''}</td>`;
            const cells   = keys.map(k => {
                const v = r[k];
                if (v === null || v === undefined || v === '') return '<td>—</td>';
                if (GEM_FIELDS.has(k)) return `<td><div class="gem-cell"><img src="${LOGO_GEMS}">${fmtBig(v)}</div></td>`;
                return `<td>${v}</td>`;
            }).join('');
            return `<tr>${nameTd}${cells}</tr>`;
        }).join('');
        tbody.innerHTML = html;
    }

    // ── CALCULATOR ────────────────────────────────────────────────────────────
    window.calcUpdate = function() {
        const v = parseFloat(document.getElementById('calc-gems')?.value);
        const wEl = document.getElementById('calc-wax');
        const tEl = document.getElementById('calc-tlm');
        const sEl = document.getElementById('calc-shards');
        if (isNaN(v) || v <= 0) {
            [wEl,tEl,sEl].forEach(el => { if (el) el.textContent = '—'; }); return;
        }
        const tlmPerWax = (_liveWaxUsd && _liveTlmUsd) ? _liveWaxUsd / _liveTlmUsd : 3.8;
        const wax = v * GEM_TO_WAX;
        if (wEl) wEl.textContent = fmtWax(wax);
        if (tEl) tEl.textContent = fmtTlm(wax * tlmPerWax);
        if (sEl) sEl.textContent = fmtShards(wax * tlmPerWax * SHARDS_PER_TLM);
    };

    // ── FETCH & REFRESH ───────────────────────────────────────────────────────
    function setStatus(msg, cls) {
        const el = document.getElementById('fetch-status');
        if (el) { el.textContent = msg; el.className = cls || ''; }
    }

    async function refreshAll() {
        setStatus('Querying chain…', '');
        try {
            const [offersData, reqData] = await Promise.all([
                fetchAllRows({ code:'recovery.ale', scope:'recovery.ale', table:'offers' }),
                fetchAllRows({ code:'recovery.ale', scope:'recovery.ale', table:'requirements' }),
                fetchLivePrices(),
            ]);
            renderRequirements(reqData);   // build _reqMap first
            renderOffers(offersData);      // then render offers with names
            fetchAllContributions();       // load all contributor lists (async, re-renders when done)
            setStatus('Updated ' + new Date().toLocaleTimeString(), 'ok');
        } catch(e) {
            setStatus('✗ ' + (e.message || String(e)), 'err');
            document.getElementById('offers-row').innerHTML =
                '<div class="no-offers">Error: ' + (e.message || e) + '</div>';
        }
    }

    // ── WALLET ────────────────────────────────────────────────────────────────
    var wax = new waxjs.WaxJS({ rpcEndpoint: 'https://wax.greymass.com', userAccount: localStorage.getItem('naron_wallet') || '', tryAutoLogin: false });

    function checkWalletState() { updateWalletUI(localStorage.getItem('naron_wallet') || null); }
    function updateWalletUI(account) {
        const btnA   = document.getElementById('wallet-connect-btn');
        const btnAnc = document.getElementById('wallet-btn-anchor');
        const btnWCC = document.getElementById('wallet-btn-wcc');
        if (account) {
            if (btnA)   { btnA.textContent = '[ ' + account + ' ]'; btnA.style.display = ''; }
            if (btnAnc) btnAnc.style.display = 'none';
            if (btnWCC) btnWCC.style.display = 'none';
            fetchPlayerStats(account);  // async — re-renders when done
        } else {
            if (btnA)   { btnA.style.display = 'none'; }
            if (btnAnc) btnAnc.style.display = '';
            if (btnWCC) btnWCC.style.display = '';
            _playerStats = {};
        }
        if (_offersCache.length) renderOffers(_offersCache);
    }
    window.loginWithAnchor = async function() {
        try {
            const r = await window.walletKit.login();
            window.walletSession = r.session;
            localStorage.setItem('naron_wallet', String(r.session.actor));
            checkWalletState();
        } catch(e) { console.error('Anchor login failed:', e); }
    };
    window.loginWithWCC = async function() {
        try {
            const account = await wax.login();
            localStorage.setItem('naron_wallet', account);
            checkWalletState();
        } catch(e) { console.error('WCC login failed:', e); }
    };
    window.disconnectWallet = function() {
        if (window.walletKit && window.walletSession) {
            window.walletKit.logout(window.walletSession).catch(function(){});
            window.walletSession = null;
        }
        localStorage.removeItem('naron_wallet');
        if (wax) wax.userAccount = '';
        checkWalletState();
    };

    async function fetchPlayerStats(wallet) {
        _playerStats = {};
        if (!wallet) return;
        try {
            const resp = await fetchRows({
                code: 'players.ale', scope: 'players.ale', table: 'players',
                lower_bound: wallet, upper_bound: wallet, limit: 1
            });
            const row = (resp.rows || []).find(r => r.wallet === wallet);
            if (row && row.permstats) {
                row.permstats.forEach(({ first, second }) => { _playerStats[first] = second; });
            }
        } catch(e) { console.warn('fetchPlayerStats failed:', e); }
        if (_offersCache.length) renderOffers(_offersCache);
    }

    async function fetchAllContributions() {
        _allContribs = {};
        if (!_offersCache.length) return;
        await Promise.all(_offersCache.map(async (o) => {
            try {
                const resp = await fetchAllRows({
                    code: 'recovery.ale', scope: o.offer_id, table: 'contribution'
                });
                _allContribs[o.offer_id] = (resp || [])
                    .slice()
                    .sort((a, b) => b.amount - a.amount);
            } catch(e) { _allContribs[o.offer_id] = []; }
        }));
        renderOffers(_offersCache);
    }

    setInterval(fetchLivePrices, 5 * 60 * 1000);
    if (sessionStorage.getItem('rcv_unlocked') === '1') { refreshAll(); checkWalletState(); }
</script>
</body>
</html>
